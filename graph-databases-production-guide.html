<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphs in Production — A Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e17;
    --bg-alt:#0d1220;
    --panel:#111a2c;
    --panel-2:#141d33;
    --border:#22304a;
    --text:#eef2f9;
    --muted:#8a97b3;
    --muted-2:#5c6885;
    --teal:#5eead4;
    --teal-dim:#2c7a70;
    --gold:#e8a855;
    --danger:#f0707a;
    --violet:#a78bfa;
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(94,234,212,0.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(167,139,250,0.05), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  a{color:var(--teal); text-decoration:none;}

  /* ---------- Layout ---------- */
  .app{ display:grid; grid-template-columns:280px 1fr; min-height:100vh; position:relative; z-index:1;}
  .topbar{
    display:none;
    position:sticky; top:0; z-index:30;
    align-items:center; gap:12px;
    padding:14px 18px;
    background:rgba(10,14,23,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar button{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    width:44px; height:44px; border-radius:8px; font-size:18px; cursor:pointer;
    flex:none; -webkit-tap-highlight-color:transparent;
  }
  .topbar .brand{font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:0.02em;}

  /* ---------- Sidebar: rendered as a connected graph ---------- */
  .sidebar{
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-alt), var(--bg));
    border-right:1px solid var(--border);
    padding:28px 0 40px;
  }
  .sidebar .brand{
    font-family:var(--font-display); font-weight:700; font-size:19px;
    padding:0 24px 6px; letter-spacing:-0.01em;
  }
  .sidebar .brand span{color:var(--teal);}
  .sidebar .tagline{
    padding:0 24px 26px; font-size:12.5px; color:var(--muted-2); font-family:var(--font-mono);
    border-bottom:1px solid var(--border); margin-bottom:10px;
  }
  nav.graph-nav{ position:relative; padding:14px 0 6px 0;}
  nav.graph-nav::before{
    content:"";
    position:absolute; left:35px; top:6px; bottom:20px; width:2px;
    background:linear-gradient(180deg, var(--teal-dim), var(--border) 90%);
  }
  .nav-node{
    position:relative;
    display:flex; align-items:center; gap:14px;
    padding:11px 24px;
    min-height:40px;
    cursor:pointer;
    color:var(--muted);
    font-size:13.5px;
    font-weight:500;
    border:none; background:transparent; width:100%; text-align:left;
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  .nav-node .dot{
    position:relative; z-index:2;
    width:11px; height:11px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--muted-2);
    flex:none; transition:all .18s ease;
  }
  .nav-node .lbl-num{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2); width:16px;}
  .nav-node:hover{ color:var(--text); }
  .nav-node:hover .dot{ border-color:var(--teal); }
  .nav-node.active{ color:var(--text); }
  .nav-node.active .dot{ background:var(--teal); border-color:var(--teal); box-shadow:0 0 0 4px rgba(94,234,212,0.15);}
  .nav-node.active::after{
    content:""; position:absolute; left:0; top:4px; bottom:4px; width:3px; background:var(--teal); border-radius:0 3px 3px 0;
  }

  /* ---------- Main content ---------- */
  main{ position:relative; z-index:1; padding:52px 56px 120px; max-width:960px;}
  section{ display:none; animation:fade .35s ease; }
  section.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .eyebrow{
    font-family:var(--font-mono); font-size:12px; color:var(--teal);
    letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:""; width:18px; height:1px; background:var(--teal); }
  h1{
    font-family:var(--font-display); font-size:clamp(28px,4vw,40px); font-weight:700;
    letter-spacing:-0.02em; margin-bottom:14px; line-height:1.15;
  }
  h1 span{color:var(--muted-2); font-weight:500;}
  .lede{ font-size:16.5px; color:#c4cce0; max-width:66ch; margin-bottom:36px;}
  h2{
    font-family:var(--font-display); font-size:22px; font-weight:600; margin:44px 0 14px;
    letter-spacing:-0.01em; display:flex; align-items:center; gap:10px;
  }
  h2::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--gold); flex:none;}
  h3{ font-family:var(--font-display); font-size:16.5px; font-weight:600; margin:26px 0 10px; color:#dbe2f0;}
  p{ margin-bottom:14px; color:#c4cce0; font-size:15px; max-width:72ch;}
  ul,ol{ margin:0 0 16px 20px; color:#c4cce0; font-size:15px;}
  li{ margin-bottom:7px; max-width:70ch;}
  strong{ color:var(--text); font-weight:600;}
  code{
    font-family:var(--font-mono); font-size:0.86em; background:var(--panel-2);
    padding:2px 6px; border-radius:5px; color:var(--teal); border:1px solid var(--border);
  }
  pre{
    background:#0c1220; border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; overflow-x:auto; margin:16px 0 22px; position:relative;
  }
  pre code{ background:none; border:none; padding:0; color:#d7deee; font-size:13px; line-height:1.6;}
  pre .tag{
    position:absolute; top:10px; right:14px; font-family:var(--font-mono); font-size:10.5px;
    color:var(--muted-2); text-transform:uppercase; letter-spacing:0.06em;
  }
  .tok-kw{color:var(--violet);} .tok-str{color:#a3d9a5;} .tok-com{color:var(--muted-2);} .tok-fn{color:var(--teal);} .tok-num{color:var(--gold);}

  /* ELI8 callout */
  .eli8{
    display:flex; gap:16px; background:linear-gradient(135deg, rgba(232,168,85,0.09), rgba(232,168,85,0.03));
    border:1px solid rgba(232,168,85,0.28); border-radius:var(--radius);
    padding:18px 20px; margin:20px 0;
  }
  .eli8 .icon{
    flex:none; width:38px; height:38px; border-radius:50%; background:rgba(232,168,85,0.15);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .eli8 .label{ font-family:var(--font-mono); font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; font-weight:600;}
  .eli8 p{ margin-bottom:0; color:#dfe4ee; font-size:14.5px;}

  /* Callout variants */
  .callout{
    border-radius:var(--radius); padding:16px 20px; margin:18px 0; border:1px solid var(--border);
    background:var(--panel); font-size:14.5px; color:#c4cce0;
  }
  .callout.bank{ border-color:rgba(94,234,212,0.3); background:rgba(94,234,212,0.05); }
  .callout.bank .label{ color:var(--teal); font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; font-weight:600;}
  .callout.warn{ border-color:rgba(240,112,122,0.3); background:rgba(240,112,122,0.05); }
  .callout.warn .label{ color:var(--danger); font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; font-weight:600;}

  /* Card grid */
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin:20px 0;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; transition:border-color .15s ease;
  }
  .card:hover{ border-color:var(--teal-dim); }
  .card h4{ font-family:var(--font-display); font-size:14.5px; margin-bottom:8px; color:var(--text); display:flex; gap:8px; align-items:center;}
  .card p{ font-size:13.5px; margin-bottom:0; color:var(--muted);}
  .card .num{ font-family:var(--font-mono); color:var(--teal); font-size:12px;}

  .table-scroll{ overflow-x:auto; margin:18px 0 26px; border-radius:var(--radius); -webkit-overflow-scrolling:touch;}
  table{ width:100%; min-width:520px; border-collapse:collapse; margin:0; font-size:14px;}
  th,td{ text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); color:#c4cce0;}
  td{ white-space:normal; }
  th{ color:var(--muted-2); font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; font-weight:500; white-space:nowrap;}
  tr:hover td{ background:rgba(255,255,255,0.015); }

  .diagram-wrap{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; margin:20px 0 28px; overflow-x:auto;
  }
  .diagram-wrap svg{ display:block; margin:0 auto; }
  .diagram-cap{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted-2); text-align:center; margin-top:12px;}

  .section-nav{
    display:flex; justify-content:space-between; margin-top:56px; padding-top:24px; border-top:1px solid var(--border);
    font-size:13px; color:var(--muted-2);
  }
  .section-nav button{
    background:none; border:none; color:var(--muted); cursor:pointer; font-family:var(--font-body); font-size:13.5px;
    display:flex; align-items:center; gap:6px;
  }
  .section-nav button:hover{ color:var(--teal); }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  img,svg{ max-width:100%; height:auto; }

  /* ---------- Tablet & below: collapse sidebar into a drawer ---------- */
  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    .topbar{ display:flex; }
    .sidebar{
      position:fixed; top:0; left:0; width:280px; max-width:82vw; height:100vh; height:100dvh; z-index:40;
      transform:translateX(-100%); transition:transform .25s ease; box-shadow:20px 0 40px rgba(0,0,0,0.4);
    }
    .sidebar.open{ transform:translateX(0); }
    main{ padding:28px 24px 100px; max-width:100%; }
    .overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:35;}
    .overlay.show{ display:block; }
    body.no-scroll{ overflow:hidden; }
    h1{ font-size:clamp(24px,6vw,32px); }
    .lede{ font-size:15.5px; margin-bottom:28px; }
    h2{ font-size:19px; margin:36px 0 12px; }
    .grid{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
    .diagram-wrap{ padding:16px; }
    pre{ padding:14px 16px; }
    .section-nav{ flex-wrap:wrap; gap:14px; }
  }

  /* ---------- Phones ---------- */
  @media (max-width: 560px){
    .topbar{ padding:12px 16px; }
    main{ padding:22px 16px 90px; }
    h1{ font-size:clamp(22px,7vw,28px); line-height:1.2; }
    .eyebrow{ font-size:11px; }
    .lede{ font-size:14.5px; }
    h2{ font-size:17.5px; margin:30px 0 10px; gap:8px; }
    h3{ font-size:15px; }
    p, ul, ol, li{ font-size:14px; }
    .grid{ grid-template-columns:1fr; gap:10px; }
    .card{ padding:15px; }
    .eli8{ flex-direction:column; gap:10px; padding:16px; }
    .eli8 .icon{ width:32px; height:32px; font-size:16px; }
    .callout{ padding:14px 16px; font-size:14px; }
    pre code{ font-size:12px; }
    pre .tag{ position:static; display:block; margin-bottom:8px; }
    .diagram-wrap{ padding:12px; }
    .diagram-cap{ font-size:10.5px; }
    .section-nav{ flex-direction:column; align-items:flex-start; margin-top:40px; }
    table{ min-width:460px; font-size:13px; }
    th,td{ padding:8px 10px; }
    .sidebar{ width:250px; }
    .sidebar .brand{ font-size:17px; }
  }

  /* ---------- Very small phones ---------- */
  @media (max-width: 360px){
    main{ padding:18px 12px 80px; }
    h1{ font-size:22px; }
    .topbar .brand{ font-size:13px; }
    .sidebar{ width:88vw; max-width:88vw; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }
</style>

    <div class="brand">graph<span style="color:var(--teal)">://</span>production</div>

    <nav class="graph-nav" id="navGraph">
      <!-- nav nodes injected by JS -->
    </nav>
  </aside>

  <main id="main">
    <!-- sections injected by JS -->
  </main>
</div>

<script>
const SECTIONS = [
  {id:'home', label:'Why Graphs'},
  {id:'basics', label:'Graph DB Basics'},
  {id:'neo4j', label:'Neo4j & Cypher'},
  {id:'kg', label:'Knowledge Graphs'},
  {id:'graphrag', label:'GraphRAG'},
  {id:'graphiti', label:'Graphiti (Temporal)'},
  {id:'python', label:'Python Toolkit'},
  {id:'banking', label:'Banking Use Cases'},
  {id:'agentic', label:'Agentic Architecture'},
  {id:'ragprod', label:'Production RAG'},
  {id:'more', label:'More Concepts'},
];

const navGraph = document.getElementById('navGraph');
SECTIONS.forEach((s,i)=>{
  const btn = document.createElement('button');
  btn.className = 'nav-node';
  btn.dataset.target = s.id;
  btn.innerHTML = `<span class="lbl-num">${String(i).padStart(2,'0')}</span><span class="dot"></span><span>${s.label}</span>`;
  btn.addEventListener('click', ()=> showSection(s.id));
  navGraph.appendChild(btn);
});

function showSection(id){
  document.querySelectorAll('section').forEach(sec=> sec.classList.toggle('active', sec.id===id));
  document.querySelectorAll('.nav-node').forEach(n=> n.classList.toggle('active', n.dataset.target===id));
  document.getElementById('main').scrollTo({top:0, behavior:'instant'});
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.body.classList.remove('no-scroll');
  window.scrollTo({top:0});
}

document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
  document.body.classList.toggle('no-scroll');
});
document.getElementById('overlay').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.body.classList.remove('no-scroll');
});

function goRel(delta){
  const active = document.querySelector('.nav-node.active').dataset.target;
  const idx = SECTIONS.findIndex(s=>s.id===active);
  const next = SECTIONS[(idx+delta+SECTIONS.length)%SECTIONS.length];
  showSection(next.id);
}
window.goRel = goRel;
</script>

/* ============ HOME ============ */
HTML += `
<section id="home">
  <div class="eyebrow">Start here</div>
  <h1>Why graphs matter <span>when relationships are the point</span></h1>
  <p class="lede">A relational table is great at answering "what is this row?" A graph is built for a different question: "what is this thing connected to, and what is <em>that</em> connected to?" In banking, fraud, risk, and personalization are all questions about connections — which is exactly where graphs win.</p>

  <div class="eli8">
    <div class="icon">🧸</div>
    <div>
      <div class="label">Explain it like I'm 8</div>
      <p>Imagine your friends at school. A spreadsheet lists their names, one row each. But it can't easily tell you "who is friends with who, and who is friends with THEIR friends." A graph is like a big web of yarn connecting friend to friend — you can trace any thread and instantly see the whole web of connections.</p>
    </div>
  </div>

  <h2>What this guide covers</h2>

    <div class="card"><span class="num">05</span><h4>Graphiti</h4><p>Temporal knowledge graphs built for AI agent memory that changes over time.</p></div>

/* ============ BASICS ============ */
HTML += `
<section id="basics">
  <div class="eyebrow">01 — Foundations</div>
  <h1>Graph database basics</h1>
  <p class="lede">Every graph database, no matter the vendor, is built from four ideas. Get these right and everything else — Cypher, GraphRAG, Graphiti — is just a variation on the theme.</p>

  <div class="eli8">
    <div class="icon">🎈</div>
    <div>
      <div class="label">Explain it like I'm 8</div>
      <p>A <strong>node</strong> is a balloon — one thing, like "Mom" or "Bank Account #123." An <strong>edge</strong> is a string tying two balloons together, like "owns" or "sent money to." A <strong>property</strong> is a sticky note on a balloon, like "age: 8" or "balance: $500." A <strong>label</strong> is the color of the balloon, telling you what kind of thing it is — red balloons are "People," blue balloons are "Accounts."</p>
    </div>
  </div>

  <h2>The four building blocks</h2>
  <table>
    <tr><th>Concept</th><th>What it is</th><th>Banking example</th></tr>
    <tr><td><strong>Node</strong></td><td>An entity — a "thing" in the world</td><td>A customer, an account, a device, a merchant</td></tr>
    <tr><td><strong>Edge / Relationship</strong></td><td>A directed, typed connection between two nodes</td><td><code>(Customer)-[:OWNS]->(Account)</code></td></tr>
    <tr><td><strong>Property</strong></td><td>A key-value fact attached to a node or edge</td><td><code>amount: 4500, currency: "USD", date: "2026-08-12"</code></td></tr>
    <tr><td><strong>Label / Type</strong></td><td>The category a node or edge belongs to</td><td><code>:Customer</code>, <code>:Account</code>, <code>:TRANSFERRED_TO</code></td></tr>
  </table>

  <h2>Why not just use SQL joins?</h2>
  <p>A relational database <em>can</em> represent relationships — that's what foreign keys and JOINs are for. The problem is depth. Finding "accounts two hops from this one" is one JOIN. Finding "all accounts within 5 hops, where money moved in a loop" is five nested JOINs that get slower and messier at every step, because the database has to re-discover the relationships each time from scratch.</p>
  <p>A graph database stores the relationship itself as a first-class, indexed pointer. Walking from node to node costs roughly the same whether you're 1 hop away or 10 — this is often called <strong>index-free adjacency</strong>. That's the whole reason banks use graphs for fraud: fraud rings are deep, multi-hop patterns, and graphs traverse deep patterns cheaply.</p>

  <div class="callout bank">
    <div class="label">Banking angle</div>
    In a core banking data warehouse, "customer → account → transaction → counterparty account → counterparty customer" is a common multi-hop question — "is this money eventually coming back to the same person through a different account?" That's a graph traversal, not a table scan.
  </div>

  <h2>Property graph vs. other graph models</h2>
  <p>Most production systems (Neo4j, Amazon Neptune, ArangoDB) use the <strong>Labeled Property Graph (LPG)</strong> model described above. You'll also hear about <strong>RDF triple stores</strong> (subject–predicate–object, used heavily in knowledge-graph and semantic-web contexts, queried with SPARQL). They express similar ideas — LPG is more pragmatic and developer-friendly for application building; RDF is closer to formal ontologies and standards-based data interchange, common in regulatory and reference-data contexts.</p>

  <h2>Graph algorithms you'll actually use</h2>
  <div class="grid">
    <div class="card"><h4>Shortest Path</h4><p>Cheapest route between two nodes — e.g. how is Customer A connected to Customer B?</p></div>
    <div class="card"><h4>PageRank</h4><p>Which nodes are most "influential" by virtue of who points to them — used to rank suspicious accounts.</p></div>
    <div class="card"><h4>Community Detection</h4><p>Clusters of densely connected nodes — surfaces fraud rings and money-laundering networks automatically.</p></div>
    <div class="card"><h4>Centrality</h4><p>Which node sits at the crossroads of many paths — often a mule account or hub in a laundering scheme.</p></div>
    <div class="card"><h4>Similarity</h4><p>Nodes with overlapping neighborhoods — used for entity resolution ("are these two customer records the same person?").</p></div>

<section id="graphiti">
  <div class="eyebrow">05 — Memory that changes over time</div>
  <h1>Graphiti — temporal knowledge graphs</h1>
  <p class="lede">Graphiti (from Zep) is an open-source framework for building knowledge graphs that are <strong>temporally aware</strong> and built to be updated continuously and incrementally — designed specifically as memory for AI agents, rather than a one-time static knowledge graph you rebuild in a batch job.</p>

    </div>
  </div>

  <h2>Why static knowledge graphs aren't enough for agents</h2>
  <p>Most knowledge graphs are built in a batch pipeline: extract, resolve, load, and periodically rebuild from scratch. That's fine for reference data that changes slowly. But an AI agent having an ongoing conversation, watching a live transaction feed, or updating customer risk continuously needs a graph that can accept small, fast, incremental updates <strong>without a full rebuild</strong> — and needs to know not just what's true now, but what was true when.</p>

    <li><strong>Audit trail</strong> — what was retrieved, what the model said, and what data it was grounded in must be logged and retained per regulatory record-keeping requirements.</li>
    <li><strong>Evaluation before every release</strong> — a held-out eval set of banking-specific questions, scored for accuracy and groundedness, gates any change to prompts, retrieval logic, or models.</li>
  </ul>

  <div class="section-nav"><button onclick="goRel(-1)">← Agentic Architecture</button><button onclick="goRel(1)">Next: More Concepts →</button></div>
</section>`;
