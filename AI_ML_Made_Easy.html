249:{l:"SB10",t:"JWT Authentication with the OAuth2 Resource Server",s:"The user logs in once and gets a signed token (JWT). On every later request they send it in the Authorization header. Spring's resource server checks the signature and expiry for you.",e:"A cinema ticket: you pay once (login), then just show the ticket. The stamp on it proves it is real, and it expires.",f:["POST /login","Check password hash","Create JWT (HS256)","Client sends Bearer token","Resource server verifies"],k:["Add <code>spring-boot-starter-security-oauth2-resource-server</code>. It includes the Nimbus JOSE library.","<b>JwtEncoder</b> creates tokens. <b>JwtDecoder</b> checks them. Here both use the same secret (HS256).","The secret must be at least <b>32 bytes</b>. Keep it in an environment variable, not in Git.","<code>.oauth2ResourceServer(o -&gt; o.jwt(Customizer.withDefaults()))</code> turns it on.","In a controller, <code>Authentication auth</code> gives you <code>auth.getName()</code>, the token subject (username)."],q:"What does the resource server check in a JWT?",a:"The signature and the expiry time."},
250:{l:"SB11",t:"Testing, Actuator and Packaging",s:"Test your API with MockMvc, check its health with Actuator, and ship it as one jar file.",k:["<b>MockMvc</b> sends fake HTTP requests to your controllers without starting a real server.","Use <code>&#64;SpringBootTest</code> to start the whole app context for a test. For security tests add <code>spring-security-test</code>.","<b>Actuator</b> (<code>spring-boot-starter-actuator</code>) gives <code>/actuator/health</code> for monitoring.","<code>./mvnw package</code> builds <code>target/app.jar</code>. Run it with <code>java -jar</code>.","Put secrets in environment variables like <code>JWT_SECRET</code>."],e:"A dress rehearsal: you play the whole show with pretend visitors before the real opening.",q:"Which command builds the runnable jar?",a:"./mvnw package"},
251:{l:"SC1",t:"Capstone: Student API with Spring Boot 4, JWT and H2 (Plan)",s:"The same Student API you built in FastAPI, now in Spring Boot 4. It uses the <b>same endpoints and JSON shapes</b>, so your React, Vue and Angular frontends work with it without any change.",e:"Same brain, new language. The frontends can't tell the difference between FastAPI and Spring Boot.",f:["Frontend","JWT filter","Controller","Service","JPA repository","H2 file database"],x:tb([["Endpoint","Auth?","What it does"],["POST /register","No","Create an account"],["POST /login (form data)","No","Get a JWT token"],["GET /me","Yes","The logged-in user"],["POST /students","Yes","Add a student"],["GET /students?search=&amp;skip=&amp;limit=","Yes","List and search own students"],["GET /students/{id}","Yes","One student"],["PATCH /students/{id}","Yes","Change some fields"],["DELETE /students/{id}","Yes","Delete a student"],["GET /stats","Yes","Count, average, highest marks"]]),k:["Each student has an <b>owner</b>, so a user only sees their own. Someone else's student returns 404.","JSON uses snake_case (<code>access_token</code>, <code>owner_id</code>) to match the FastAPI version.","The server runs on <b>port 8000</b>, the same as FastAPI.","Files: the pom.xml, 3 entity and repository files, DTOs, exception handler, SecurityConfig, JwtService, 2 controllers, a service and tests."],q:"Why can the same frontend work with both FastAPI and Spring Boot?",a:"Because both APIs have the same endpoints, request shapes and response shapes."},
252:{l:"SC2",t:"Capstone Step 1: pom.xml, Entities and Repositories",s:"Set up the project dependencies, then create the two tables (users and students) and their repositories.",k:["The <code>pom.xml</code> uses the Boot 4 starter names: <code>webmvc</code>, <code>data-jpa</code>, <code>validation</code>, <code>security</code> and <code>security-oauth2-resource-server</code>.","<code>&#64;ManyToOne</code> owner links each student to a user. <code>unique = true</code> stops duplicate emails and usernames.","Repository method names like <code>findByIdAndOwnerId</code> are turned into SQL for you.","The table is named <b>users</b>, because <code>user</code> is a reserved word in many databases."],q:"What does findByIdAndOwnerId do?",a:"It finds a student by id, but only if it belongs to the given owner."},
253:{l:"SC3",t:"Capstone Step 2: DTOs and Error Handling",s:"Records define what goes in and out, with validation rules. A global handler makes every error look like the FastAPI version: <code>{&quot;detail&quot;: ...}</code>.",k:["<b>StudentRequest</b> (add), <b>StudentUpdate</b> (all fields optional, for PATCH), <b>StudentResponse</b> (includes id and owner id).","<b>UserResponse</b> has no password, so it never leaves the server.","Validation errors give <b>422</b> with a list of problems, and the frontends already know how to show it.","<code>ApiException</code> carries a status code and a message."],q:"Why does StudentUpdate have no &#64;NotBlank annotations?",a:"Every field is optional in a PATCH request, so a missing field simply means no change."},
254:{l:"SC4",t:"Capstone Step 3: Security Config and JWT Service",s:"The security rules, the JWT encoder and decoder, the password encoder, CORS, and a service that creates tokens.",k:["Open endpoints: <code>POST /register</code> and <code>POST /login</code>. Everything else needs a valid token.","<b>Stateless</b> sessions, <b>CSRF off</b> (this is a token API).","The same secret key feeds both <code>NimbusJwtEncoder</code> and <code>NimbusJwtDecoder</code>.","<code>JwtService.createToken</code> sets the subject (username) and an expiry time of 30 minutes.","CORS allows the React, Vue and Angular dev servers (ports 5173 and 4200)."],q:"Which two beans do you need for HS256 JWTs?",a:"A JwtEncoder (to create tokens) and a JwtDecoder (to verify them)."},
255:{l:"SC5",t:"Capstone Step 4: StudentService and the Controllers",s:"The service holds the rules (owner checks, duplicate emails, statistics). The controllers just connect URLs to the service.",k:["Every service method receives the <b>username from the token</b> and looks up the owner.","<code>&#64;Transactional</code> keeps changes safe. In update, changing the loaded entity is enough, and it is saved when the method ends.","<code>login</code> reads <b>form data</b> (<code>application/x-www-form-urlencoded</code>), exactly like the FastAPI version.","Names are tidied (trim, capitalise) and emails are lower-cased, like the Python version."],q:"Where does the controller get the current username from?",a:"From the Authentication object, whose name is the token subject."},
256:{l:"SC6",t:"Capstone Step 5: Configuration, Run and the H2 Console",s:"Set the properties, run the app on port 8000, and look inside the H2 database with its web console.",k:["<code>spring.jackson.property-naming-strategy=SNAKE_CASE</code> gives <code>access_token</code> and <code>owner_id</code>.","<b>JWT_SECRET</b> comes from an environment variable, with a development default.","<code>jdbc:h2:file:./data/studentdb</code> keeps your data after a restart.","The H2 console at <code>/h2-console</code> is for <b>development only</b>. Never expose it in production."],q:"Why is the H2 console dangerous in production?",a:"It gives direct access to the database through a web page."},
257:{l:"SC7",t:"Capstone Step 6: Testing with MockMvc",s:"Automatic tests that register users, log in, use the token, and check the rules: 401 without a token, 422 for bad data, 409 for duplicates, and 404 for another user's student.",k:["The test uses an in-memory H2 database, so your real data file is never touched.","<code>springSecurity()</code> adds the security filters to MockMvc.","Each test registers a unique user, so tests don't depend on each other.","Run all tests with <code>./mvnw test</code>."],q:"Why does the test use its own in-memory database?",a:"So tests never change your real data file."},
258:{l:"SC8",t:"Capstone Step 7: Connect the Frontends, Package and Level Up",s:"Point your React, Vue or Angular app at the Spring Boot server, or even serve the built frontend from Spring Boot itself.",x:tb([["","FastAPI version","Spring Boot version"],["Port","8000","8000"],["Login","/login, form data","/login, form data"],["Errors","{detail: ...}","{detail: ...}"],["Frontends","React, Vue, Angular","The same ones, unchanged"],["Database","SQLite","H2 file"],["Serve the built frontend","StaticFiles mount","Put it in src/main/resources/static"]]),k:["Run the Spring API, then run your frontend dev server. Nothing else needs to change.","For one server: copy the built frontend (<code>dist</code>) into <code>src/main/resources/static</code> and allow GET for the static files in the security rules.","Package with <code>./mvnw package</code> and run <code>java -jar</code>, or use the Dockerfile.","<b>Level up:</b> PostgreSQL with Flyway migrations, refresh tokens, roles (admin and teacher), pagination with <code>Pageable</code>, OpenAPI docs with springdoc, and deploy."],q:"What must you change in the frontend to use the Spring Boot API?",a:"Nothing. The API has the same address, endpoints and JSON shapes."}
,
270:{l:"JS1",t:"What is JavaScript? Running Your First Code",s:"JavaScript is the programming language of the web. It runs in every browser, and with Node.js it also runs on servers. It makes pages interactive.",e:"A web page is a human body: HTML is the skeleton, CSS is the clothes and skin, and JavaScript is the muscles that make it move.",k:["Three ways to run it: the <b>browser console</b> (press F12), a <code>&lt;script&gt;</code> tag in an HTML page, or <b>Node.js</b> (<code>node file.js</code>).","<code>console.log(...)</code> prints a message. <code>//</code> starts a comment.","JavaScript is <b>dynamically typed</b>: a variable can hold any kind of value.","The language standard is called <b>ECMAScript</b> (ES). A new version comes out every year.","JavaScript and Java are different languages, despite the similar name."],q:"Is JavaScript the same as Java?",a:"No. They are two different languages."},
271:{l:"JS2",t:"Variables, Data Types and Template Strings",s:"A variable stores a value. JavaScript has a few basic types of value, and template strings let you mix text and values easily.",e:"Labelled boxes: the label is the name, and what is inside can be a number, text or True/False.",x:tb([["Type","Example"],["string","'Riya'"],["number","15, 3.14, NaN, Infinity"],["bigint","9007199254740993n"],["boolean","true, false"],["undefined / null","No value yet / empty on purpose"],["symbol, object","Unique id, and everything else (arrays, functions, dates)"]]),k:["<b>const</b> for values that never get reassigned (use this first), <b>let</b> for values that change. Avoid <code>var</code>.","<code>typeof 5</code> gives <code>'number'</code>. (A famous quirk: <code>typeof null</code> is <code>'object'</code>.)","<b>Template strings</b> use backticks: <code>`Hi ${name}`</code>.","Convert with <code>Number('42')</code>, <code>String(42)</code>, <code>parseInt('42px')</code>."],q:"Which keyword should you use first for a variable?",a:"const. Use let only when the value must change."},
272:{l:"JS3",t:"Operators, Equality, Truthy and Falsy",s:"Operators calculate and compare. JavaScript has some surprises, mainly around equality and what counts as true or false.",k:["<b>Always use <code>===</code></b> (strict equal). <code>==</code> converts types first, so <code>'5' == 5</code> is true.","<b>Falsy</b> values: <code>false, 0, '', null, undefined, NaN, 0n</code>. Everything else is truthy, even <code>'0'</code> and <code>[]</code>.","<code>&amp;&amp;</code> and, <code>||</code> or, <code>!</code> not.","<b>Nullish coalescing</b> <code>a ?? b</code> uses b only if a is null or undefined (unlike <code>||</code>, it keeps 0 and '').","<b>Optional chaining</b> <code>user?.address?.city</code> stops safely if something is missing.","<code>**</code> power, <code>%</code> remainder, <code>??=</code> and <code>||=</code> assign only when needed."],e:"Strict equality is a security guard who checks both the name and the photo. Loose equality only checks the name.",q:"What does 0 ?? 5 give?",a:"0. The ?? operator only replaces null or undefined."},
273:{l:"JS4",t:"Control Flow: if, switch and Loops",s:"Control flow lets your program choose and repeat.",k:["<code>if / else if / else</code>, and <code>switch</code> with <code>break</code>.","<code>for (let i = 0; i &lt; 5; i++)</code>, <code>while</code>, <code>do...while</code>.","<b>for...of</b> walks through the values of an array or string. <b>for...in</b> walks through the keys of an object.","<code>break</code> stops a loop and <code>continue</code> skips one round.","Tip: arrays have <code>forEach</code>, <code>map</code> and <code>filter</code>, which are often neater than loops."],e:"A traffic signal decides what you do, and a loop is a ride on a merry-go-round that repeats.",q:"Which loop is used to go through the values of an array?",a:"for...of."},
274:{l:"JS5",t:"Functions: Declarations, Arrow Functions, Rest and Spread",s:"A function is a reusable block of code. In JavaScript, functions are values, so you can store them, pass them and return them.",e:"A recipe: write it once, then cook it as many times as you like with different ingredients.",k:["<b>Declaration:</b> <code>function add(a, b) { return a + b; }</code>. <b>Arrow:</b> <code>const add = (a, b) =&gt; a + b;</code>.","<b>Default parameters:</b> <code>function hi(name = 'friend')</code>.","<b>Rest</b> <code>(...nums)</code> collects arguments. <b>Spread</b> <code>[...a, ...b]</code> expands them.","<b>Callback:</b> a function you pass to another function. <b>Higher-order function:</b> one that takes or returns functions.","A function without <code>return</code> gives <code>undefined</code>."],q:"What does the rest operator (...nums) do in a parameter list?",a:"It collects all the extra arguments into an array."},
275:{l:"JS6",t:"Arrays and Array Methods",s:"An array is an ordered list. The built-in methods let you transform lists without writing loops.",x:tb([["Method","What it does"],["map","Change every item and return a new array"],["filter","Keep only items that pass a test"],["reduce","Combine all items into one value"],["find / findIndex","First match (or its position)"],["some / every","Does any / do all pass the test?"],["sort, toSorted","Sort (toSorted gives a new array, ES2023)"],["includes, at, flat, slice","Check, pick by index (negative allowed), flatten, copy part"]]),k:["<b>Destructuring:</b> <code>const [first, second] = list;</code>.","<code>push, pop, shift, unshift, splice</code> change the array. <code>map, filter, slice, toSorted</code> return a new one.","<code>sort()</code> sorts as text by default. Use <code>(a, b) =&gt; a - b</code> for numbers."],q:"Which method keeps only the items that pass a test?",a:"filter."},
276:{l:"JS7",t:"Objects, JSON, Map and Set",s:"An object stores named values (properties). JSON is a text format for sending objects over the internet. Map and Set are special collections.",e:"An object is a student record card with labelled fields. JSON is that card photocopied as plain text.",k:["<code>const s = { name: 'Riya', marks: 92 };</code> Access with <code>s.name</code> or <code>s['name']</code>.","<b>Destructuring:</b> <code>const { name, marks } = s;</code>. <b>Spread:</b> <code>{ ...s, marks: 95 }</code> copies and changes.","<code>Object.keys / values / entries</code> list the contents. <code>Object.groupBy</code> (ES2024) groups items.","<code>JSON.stringify(obj)</code> and <code>JSON.parse(text)</code>. <code>structuredClone(obj)</code> makes a deep copy.","<b>Map</b> (any key type, keeps order) and <b>Set</b> (unique values)."],q:"How do you turn a JSON text into an object?",a:"JSON.parse(text)"},
277:{l:"JS8",t:"Scope, Closures, Hoisting and this",s:"These are the ideas that confuse most beginners, and they explain how JavaScript really works.",e:"A closure is a backpack: a function carries the variables from where it was born, even after the place is gone.",k:["<b>let and const</b> live inside the nearest <code>{ }</code> block. <b>var</b> lives in the whole function.","<b>Hoisting:</b> function declarations can be used before they appear. Using a <code>let</code> before its line causes an error (the temporal dead zone).","<b>Closure:</b> an inner function remembers the outer function's variables. It is how counters and private data are made.","<b>this</b> depends on how a function is called. Arrow functions have no own <code>this</code>; they use the surrounding one.","<code>call</code>, <code>apply</code> and <code>bind</code> set <code>this</code> by hand."],q:"What is a closure?",a:"A function that remembers the variables of the place where it was created."},
278:{l:"JS9",t:"Classes, Prototypes and Inheritance",s:"Classes are a clean way to make many similar objects. Under the hood, JavaScript uses prototypes: objects that inherit from other objects.",k:["<code>class Student { constructor(name) { this.name = name; } }</code> and <code>new Student('Riya')</code>.","<code>extends</code> and <code>super</code> for inheritance. <code>static</code> belongs to the class.","<b>Private fields</b> start with <code>#</code> and can't be touched from outside (ES2022).","<code>get</code> and <code>set</code> make computed properties.","<b>Prototype chain:</b> if a property is missing, JavaScript looks in the parent object, and so on up the chain."],e:"A class is a cookie cutter. Each cookie (object) has its own sprinkles, but the shape is shared.",q:"How do you make a class field private?",a:"Start its name with # (for example #password)."},
279:{l:"JS10",t:"Modules and npm",s:"Modules split your code into files. npm is the world's biggest library store for JavaScript.",k:["<code>export function add() {}</code> and <code>import { add } from './math.js'</code>. A file can also have one <code>export default</code>.","In a browser use <code>&lt;script type='module'&gt;</code>. In Node, use <code>.mjs</code> files or <code>&quot;type&quot;: &quot;module&quot;</code> in package.json.","<b>Dynamic import:</b> <code>const m = await import('./big.js')</code> loads code only when needed.","<code>npm init -y</code> creates <code>package.json</code>. <code>npm install name</code> adds a library. <code>npm run script</code> runs a script.","<code>node_modules</code> holds the libraries. Never put it in Git."],e:"Modules are the chapters of a book, and npm is the library where you borrow other people's chapters.",q:"Which file lists the libraries and scripts of a project?",a:"package.json"},
280:{l:"JS11",t:"Asynchronous JavaScript: Promises, async/await and fetch",s:"JavaScript does one thing at a time, but it never waits idly. Slow tasks (network, timers) run in the background and call you back when ready.",e:"A restaurant: you order (start a task), get a token number (a promise) and sit down. You are called when the food is ready, so the waiter never stands staring at the kitchen.",f:["Call stack","Web API does the slow work","Queue","Event loop","Callback runs"],k:["A <b>Promise</b> is a value that will arrive later: pending, fulfilled or rejected.","<code>async</code> functions return promises. <code>await</code> pauses <i>that function</i> until the promise settles.","<code>Promise.all</code> (all succeed), <code>allSettled</code> (wait for all), <code>race</code> (first one), <code>any</code> (first success).","<code>fetch(url)</code> does not throw on 404 or 500. Check <code>res.ok</code>.","<b>AbortController</b> cancels a request. Microtasks (promises) run before timers."],q:"Does fetch throw an error on a 404 response?",a:"No. You must check res.ok yourself."},
281:{l:"JS12",t:"The DOM and Events",s:"The DOM is the page as JavaScript sees it: a tree of elements you can read and change. Events (clicks, typing) let you react to the user.",e:"The DOM is a family tree of the page. JavaScript can find any member and change their clothes, or add a new baby.",k:["Find: <code>document.querySelector('#id')</code>, <code>querySelectorAll('.card')</code>.","Change: <code>textContent</code>, <code>classList.add/toggle</code>, <code>setAttribute</code>, <code>style</code>.","Create: <code>document.createElement('li')</code> then <code>append(...)</code>.","Listen: <code>el.addEventListener('click', handler)</code>.","<b>Event delegation:</b> one listener on the parent handles clicks on many children (use <code>e.target.closest()</code>).","<b>Security:</b> <code>textContent</code> is safe. <code>innerHTML</code> with user text can run attacker code (XSS), so escape it."],q:"Which is safer for putting user text on a page: textContent or innerHTML?",a:"textContent."},
282:{l:"JS13",t:"Web APIs: Storage, URLs, Dates and Error Handling",s:"Browsers give you many built-in tools. You also need to handle errors, because things go wrong.",k:["<b>localStorage</b> keeps text in the browser forever. <b>sessionStorage</b> until the tab closes. Store objects with <code>JSON.stringify</code>.","<code>new URL(...)</code> and <code>URLSearchParams</code> build and read addresses safely.","<code>setTimeout</code> runs once. <code>setInterval</code> repeats (stop it with <code>clearInterval</code>).","<code>Date</code> and <code>Intl.DateTimeFormat</code> / <code>toLocaleDateString</code> show dates for any country.","<code>try / catch / finally</code> and <code>throw new Error('...', { cause })</code>.","DevTools: <code>debugger</code>, breakpoints, the Network tab."],e:"A browser is a Swiss army knife. Storage is the notepad, timers are the alarm, and try/catch is the first-aid kit.",q:"What must you do before saving an object in localStorage?",a:"Convert it to text with JSON.stringify."},
283:{l:"JS14",t:"Modern JavaScript: ES2015 to ES2025",s:"JavaScript gets a new version every year. This table is your map of the features worth knowing.",x:tb([["Version","Highlights"],["ES2015 (ES6)","let/const, arrow functions, classes, modules, promises, template strings, destructuring, spread, Map, Set, symbols, generators"],["ES2016 to ES2017","** operator, Array.includes, async/await, Object.values and entries, padStart"],["ES2018 to ES2019","Object spread, Promise.finally, flat and flatMap, Object.fromEntries, optional catch binding"],["ES2020","Optional chaining ?., nullish ??, BigInt, Promise.allSettled, dynamic import, globalThis"],["ES2021","??=, ||=, &amp;&amp;=, replaceAll, Promise.any, numeric separators 1_000_000"],["ES2022","Class fields and #private, top-level await, at(), Object.hasOwn, Error cause"],["ES2023","findLast, toSorted, toReversed, toSpliced, with"],["ES2024","Object.groupBy, Map.groupBy, Promise.withResolvers"],["ES2025","Set methods (union, intersection...), iterator helpers, Promise.try, JSON modules"]]),k:["Check browser or Node support on MDN or caniuse.com before using the newest features.","<b>Generators</b> (<code>function*</code> and <code>yield</code>) and <b>iterators</b> produce values one at a time.","Later versions add more every year, so look at the TC39 proposals page for what is coming."],q:"Which operator safely reads user?.address?.city?",a:"Optional chaining (?.), added in ES2020."},
284:{l:"JS15",t:"Node.js Essentials and Tooling",s:"Node.js runs JavaScript outside the browser. It is used for servers, scripts and build tools.",k:["Run a file: <code>node app.js</code>. Built-in modules: <code>fs/promises</code>, <code>path</code>, <code>http</code>, <code>os</code>. Import with the <code>node:</code> prefix.","<b>ESM</b> (<code>import</code>) is the modern way. <b>CommonJS</b> (<code>require</code>) is the older way.","<code>process.argv</code> reads command-line arguments and <code>process.env</code> reads environment variables.","<b>Tooling:</b> <b>Vite</b> (dev server and build), <b>ESLint</b> (finds mistakes), <b>Prettier</b> (formats code), <b>Vitest</b> (tests).","Node has a built-in test runner: <code>node --test</code>."],e:"Node.js is like taking the browser's engine out and putting it in a truck, so it can do work anywhere.",q:"Which Node module reads and writes files?",a:"fs (usually fs/promises)."},
285:{l:"JS16",t:"Mini Project: Todo App (HTML, JavaScript and localStorage)",s:"A full small app in one file. It adds, completes, filters and deletes tasks, and remembers them after you refresh the page.",k:["Save the code as <code>todo.html</code> and open it in a browser. No server is needed.","It uses <b>event delegation</b>, <b>localStorage</b>, <b>array methods</b> and <b>safe text rendering</b>.","Try adding: edit a task, due dates, drag to reorder, or dark mode."],q:"Why does the app use textContent and not innerHTML for task names?",a:"So a task such as &lt;b&gt; or a script tag cannot break or attack the page."},
286:{l:"TS1",t:"Why TypeScript? Setup and First Program",s:"TypeScript is JavaScript with types. You describe what kind of data each variable holds, and the editor warns you about mistakes before you run the code. It compiles to plain JavaScript.",e:"A spell-checker for code. It underlines mistakes while you type.",f:["Write .ts","tsc or Vite checks types","Plain .js","Runs anywhere"],k:["Install: <code>npm install -D typescript</code>, then <code>npx tsc --init</code> to create <code>tsconfig.json</code>.","Compile: <code>npx tsc</code>. Run quickly with <code>npx tsx file.ts</code>. Recent Node versions (22.18+ and 24+) can also run <code>.ts</code> files directly if they only use removable type syntax.","Turn on <b>strict mode</b> (<code>&quot;strict&quot;: true</code>). It is the main reason to use TypeScript.","Types exist only while writing. They are erased in the final JavaScript.","TypeScript 6.0 (2026) was the last version written in JavaScript. TypeScript 7.0 is a faster native compiler. Everything in this course works the same."],q:"Do types exist when the program runs?",a:"No. They are removed when the code is compiled to JavaScript."},
287:{l:"TS2",t:"Basic Types, Inference, unknown and never",s:"TypeScript knows the type of a value, either because you write it or because it works it out (inference).",k:["Basic types: <code>string, number, boolean, bigint, null, undefined</code>. Arrays: <code>number[]</code>. Tuples: <code>[string, number]</code>.","<b>Inference:</b> <code>const age = 15</code> is already a number. Write types only where needed.","<b>Literal types:</b> <code>'login' | 'register'</code> allows only those two texts.","<b>any</b> turns off checking (avoid it). <b>unknown</b> is the safe version: you must check before using it.","<b>never</b> means 'can't happen' (used for complete checks).","<b>enum</b> alternatives: a union of literals or an <code>as const</code> object."],e:"Labels on lunch boxes: you can't put a shoe in the box marked 'sandwich'.",q:"Which is safer, any or unknown?",a:"unknown, because you must check the type before using the value."},
288:{l:"TS3",t:"Functions, Objects, type and interface",s:"You describe the shape of objects with a type alias or an interface, and the types of function inputs and outputs.",k:["<code>function add(a: number, b: number): number</code>. Optional parameter: <code>b?: number</code>.","<code>interface Student { id: number; name: string; email?: string; readonly created: Date }</code>.","<code>type</code> and <code>interface</code> are very similar. <code>interface</code> can be extended and merged, <code>type</code> can also name unions.","Function types: <code>type Handler = (e: Event) =&gt; void</code>.","<code>void</code> means returns nothing. Overloads allow several call shapes."],e:"A form template: it lists every field and which are optional.",q:"What does the ? mean in email?: string?",a:"The property is optional."},
289:{l:"TS4",t:"Union Types and Narrowing",s:"A value can be one of several types (a union). TypeScript narrows it to the exact type inside your checks.",k:["<code>string | number</code> is a union. <code>A &amp; B</code> is an intersection (has everything from both).","<b>Narrowing:</b> <code>typeof x === 'string'</code>, <code>'name' in obj</code>, <code>x instanceof Date</code>, <code>if (x)</code>.","<b>Discriminated union:</b> each shape has a <code>kind</code> field, and a <code>switch</code> on it narrows each case.","<b>Type guard:</b> <code>function isCircle(s: Shape): s is Circle</code>.","<code>satisfies</code> checks a value against a type without widening it (TS 4.9)."],e:"A door with several keys. First you check which key you hold, then you know which lock it opens.",q:"What is a discriminated union?",a:"A union where every member has a common field (like kind) with a different literal value, used to tell them apart."},
290:{l:"TS5",t:"Generics",s:"Generics let one function or type work with many types while staying safe.",e:"A box labelled 'Box of T'. The T is filled in when you use it: a box of apples or a box of books.",k:["<code>function first&lt;T&gt;(list: T[]): T | undefined</code>.","<code>interface ApiResponse&lt;T&gt; { data: T; error?: string }</code>.","<b>Constraints:</b> <code>&lt;T extends { id: number }&gt;</code>.","<b>Defaults:</b> <code>&lt;T = string&gt;</code>.","Built-in generics: <code>Array&lt;T&gt;</code>, <code>Promise&lt;T&gt;</code>, <code>Record&lt;K, V&gt;</code>."],q:"What does Promise&lt;Student&gt; mean?",a:"A promise that will give a Student when it finishes."},
291:{l:"TS6",t:"Utility, Mapped and Conditional Types",s:"TypeScript can build new types from old ones, so you don't repeat yourself.",x:tb([["Utility","Result"],["Partial&lt;T&gt;","All properties optional (great for update forms)"],["Required&lt;T&gt;","All properties required"],["Pick&lt;T, K&gt; / Omit&lt;T, K&gt;","Keep or remove chosen properties"],["Readonly&lt;T&gt;","All properties read-only"],["Record&lt;K, V&gt;","An object with keys K and values V"],["ReturnType&lt;F&gt;","The return type of a function"]]),k:["<code>keyof T</code> gives the property names. <code>typeof value</code> gives the type of a value.","<b>Mapped type:</b> <code>{ [K in keyof T]: string }</code>.","<b>Conditional type:</b> <code>T extends string ? 'text' : 'other'</code>.","<b>Template literal types:</b> <code>`on${Capitalize&lt;string&gt;}`</code>."],q:"Which utility type makes every property optional?",a:"Partial&lt;T&gt;"},
292:{l:"TS7",t:"Classes in TypeScript",s:"TypeScript adds access control and shortcuts to JavaScript classes.",k:["<code>public</code>, <code>private</code>, <code>protected</code>, <code>readonly</code>. Real privacy at runtime uses <code>#field</code>.","<b>Parameter properties:</b> <code>constructor(private name: string) {}</code> declares and sets the field in one go. (Not allowed when you enable the erasable syntax option.)","<code>abstract class</code> can't be created directly. <code>implements</code> promises a class follows an interface.","Generic classes: <code>class Repo&lt;T&gt;</code>."],e:"A bank counter: customers use public methods, and the vault is private.",q:"What does implements do?",a:"It makes the compiler check that a class has everything an interface requires."},
293:{l:"TS8",t:"Modules, tsconfig and Declaration Files",s:"TypeScript organises code with ES modules, and tsconfig.json tells the compiler how strict to be.",k:["<code>export</code> and <code>import</code> work as in JavaScript. Use <code>import type { Student }</code> for types only.","Important options: <code>strict</code>, <code>target</code>, <code>module</code>, <code>moduleResolution</code>, <code>noUncheckedIndexedAccess</code>, <code>verbatimModuleSyntax</code>.","<b>.d.ts</b> files describe the types of JavaScript libraries. Install them as <code>npm i -D @types/node</code> (DefinitelyTyped).","<b>Path aliases</b> and project references help big projects.","Most tools (Vite, Next.js) check types separately from running code. Run <code>tsc --noEmit</code> in CI."],q:"What is a .d.ts file?",a:"A file that only describes types, for code written in JavaScript."},
294:{l:"TS9",t:"Typed APIs, Async Code and Runtime Validation",s:"Types disappear at runtime, so data from a server is not guaranteed to match your types. Combine generics with checks.",k:["<code>async function get&lt;T&gt;(url: string): Promise&lt;T&gt;</code> gives a typed fetch helper.","<b>Type guard functions</b> check data at runtime: <code>function isStudent(x: unknown): x is Student</code>.","Libraries like <b>Zod</b> or <b>Valibot</b> define a schema once and give both the check and the type.","Make your own error class: <code>class ApiError extends Error</code>, with a <code>status</code> field.","In <code>catch (err)</code> the error is <code>unknown</code>. Check <code>err instanceof Error</code>."],e:"The label on a parcel says 'books', but you still open it at the gate to be sure.",q:"Why validate API data at runtime when you have types?",a:"Types are erased, so they can't guarantee what the server really sends."},
295:{l:"TS10",t:"Modern TypeScript Features Cheat Sheet",s:"The most useful features added over the years, and where the language is heading.",x:tb([["Version","Feature"],["3.7","Optional chaining and nullish coalescing"],["4.1","Template literal types"],["4.9","satisfies operator"],["5.0","Standard decorators, const type parameters"],["5.2","using declarations (automatic cleanup)"],["5.4","NoInfer utility type"],["5.5","Inferred type predicates"],["5.8","--erasableSyntaxOnly (works with Node running .ts files)"],["6.0 (2026)","Last JavaScript-based compiler, a bridge to 7.0"],["7.0","Native compiler written in Go, often about 10 times faster (release candidate in June 2026)"]]),k:["Check typescriptlang.org for the latest version and its release notes.","Strict mode plus <code>noUncheckedIndexedAccess</code> catches many real bugs.","Type your data at the edges (API and forms) and let inference do the rest."],q:"Which TypeScript feature checks a value against a type without making the type wider?",a:"satisfies"},
296:{l:"SS1",t:"What is SCSS? Setup and Your First Stylesheet",s:"Sass is a power-up for CSS. SCSS is its most popular syntax: it looks like CSS but adds variables, nesting, mixins and more. A tool compiles it to normal CSS for the browser.",e:"CSS is writing by hand. SCSS is a word processor with templates and shortcuts, and it prints plain CSS at the end.",f:["styles.scss","Sass compiler","styles.css","Browser"],k:["Install: <code>npm install -D sass</code>. Compile: <code>npx sass src/styles.scss dist/styles.css --watch</code>.","Vite, Next.js, Angular and Vue understand <code>.scss</code> files once <code>sass</code> is installed.","<b>SCSS</b> (<code>.scss</code>, uses braces) and the older indented <b>Sass</b> syntax (<code>.sass</code>). This course uses SCSS.","Any valid CSS is valid SCSS. <code>//</code> comments are removed in the output, <code>/* */</code> comments stay.","The reference compiler is <b>Dart Sass</b>."],q:"What does the Sass compiler produce?",a:"Plain CSS that browsers understand."},
297:{l:"SS2",t:"Variables, Maps and Lists",s:"Variables store values like colors and sizes, so you change them in one place.",k:["<code>$primary: #2f3fbf;</code> then <code>color: $primary;</code>.","<code>!default</code> lets a value be overridden: <code>$radius: 8px !default;</code>.","<b>Maps:</b> <code>$colors: (primary: #2f3fbf, danger: #c0183c);</code> read with <code>map.get($colors, primary)</code>.","<b>Lists:</b> <code>$sizes: 4px 8px 16px;</code>.","Sass variables are replaced at build time. <b>CSS custom properties</b> (<code>--primary</code>) live in the browser and can change at runtime (for dark mode). Use both."],e:"Paint colour codes written on one chart on the wall. Change the chart and every room is repainted.",q:"How is a Sass variable different from a CSS custom property?",a:"A Sass variable disappears at build time. A CSS custom property stays in the browser and can change while the page runs."},
298:{l:"SS3",t:"Nesting and the Parent Selector (&)",s:"Nesting lets you write child rules inside parent rules, like the HTML structure. The &amp; symbol means the parent selector.",k:["<code>.card { .title { ... } }</code> becomes <code>.card .title</code>.","<code>&amp;:hover</code> becomes <code>.btn:hover</code>. <code>&amp;.active</code> becomes <code>.btn.active</code>.","<b>BEM style:</b> <code>.card { &amp;__title {} &amp;--big {} }</code> gives <code>.card__title</code> and <code>.card--big</code>.","<code>.dark &amp; { ... }</code> puts the parent after another selector.","You can nest <code>@media</code> inside a rule.","<b>Warning:</b> nest at most 3 levels, or the CSS becomes heavy and hard to override."],q:"What does &:hover inside .btn compile to?",a:".btn:hover"},
299:{l:"SS4",t:"Mixins, Functions and Built-in Modules",s:"A mixin is a reusable block of CSS. A function calculates and returns a value.",k:["<code>&#64;mixin center { display: flex; ... }</code> and use it with <code>&#64;include center;</code>.","Mixins take arguments: <code>&#64;mixin button($bg, $pad: 8px)</code>. <code>&#64;content</code> lets the caller add its own rules.","<code>&#64;function rem($px) { &#64;return math.div($px, 16) * 1rem; }</code>.","<b>Built-in modules:</b> <code>&#64;use 'sass:math';</code> (<code>math.div</code>, <code>math.round</code>), <code>sass:map</code>, <code>sass:color</code>, <code>sass:string</code>.","Division with <code>/</code> is deprecated. Use <code>math.div</code>."],e:"A mixin is a stamp, and a function is a calculator that hands you a number.",q:"Which function should you use for division in modern Sass?",a:"math.div (after &#64;use 'sass:math')"},
300:{l:"SS5",t:"Control Directives: &#64;if, &#64;each, &#64;for, &#64;while",s:"Sass has loops and conditions, so you can generate many CSS rules from a short description.",k:["<code>&#64;if $theme == dark { ... } &#64;else { ... }</code>.","<code>&#64;each $name, $color in $map { .text-#{$name} { color: $color; } }</code>.","<code>&#64;for $i from 1 through 5 { .mt-#{$i} { margin-top: $i * 4px; } }</code> makes a spacing scale.","<code>#{ }</code> is <b>interpolation</b>. It puts a variable inside a selector or property name.","Don't generate thousands of classes you never use. The CSS file gets big."],q:"What does #{$name} do?",a:"It inserts the value of the variable into a selector or property name."},
301:{l:"SS6",t:"Modules and Architecture: &#64;use, &#64;forward, Partials and &#64;extend",s:"Big stylesheets are split into small files called partials. &#64;use brings them together safely.",k:["A <b>partial</b> starts with an underscore: <code>_variables.scss</code>. Load it with <code>&#64;use 'variables';</code>.","Members are used with a <b>namespace</b>: <code>variables.$primary</code>. Use <code>&#64;use 'variables' as *;</code> to drop the prefix.","<code>&#64;forward</code> re-exports files, so one <code>index</code> file can expose a whole folder.","<code>&#64;use 'config' with ($radius: 4px);</code> configures a module.","<b>&#64;extend</b> with <code>%placeholder</code> shares styles without copying.","<b>&#64;import is deprecated</b> and will be removed from Dart Sass. Use &#64;use."],e:"A school with departments: each department has its own office (partial), and the main office (main.scss) brings them together.",q:"What replaces the old &#64;import in modern Sass?",a:"&#64;use (and &#64;forward)."},
302:{l:"SS7",t:"Responsive Design, Theming and SCSS vs Modern CSS",s:"Combine mixins, maps and CSS custom properties to build responsive, themeable styles.",k:["A <b>breakpoint mixin</b> keeps media queries tidy: <code>&#64;include up(md) { ... }</code>.","<b>Themes:</b> define colors as CSS variables on <code>:root</code>, then change them in <code>[data-theme='dark']</code> or <code>prefers-color-scheme</code>.","<b>Mobile first:</b> write small-screen styles first, then add <code>min-width</code> queries.","Plain CSS now has variables, nesting and <code>color-mix()</code>. SCSS is still handy for mixins, loops, maps and functions.","Use <b>stylelint</b> and <b>autoprefixer</b> to keep CSS clean and compatible."],q:"What is mobile-first design?",a:"Writing styles for small screens first, and adding bigger-screen changes with min-width media queries."},
303:{l:"TC1",t:"Capstone: Student Dashboard with TypeScript and SCSS (Plan)",s:"A framework-free Student Dashboard built with TypeScript and SCSS using Vite. It logs in to your Student API (FastAPI or Spring Boot) with a JWT, then adds, searches, edits and deletes students.",e:"The same app as the React, Vue and Angular versions, built with just the web platform, so you see what the frameworks do for you.",f:["index.html","main.ts (state + events)","ui.ts (HTML templates)","students.ts, auth.ts","api.ts (typed fetch)","Your API"],x:tb([["File","Job"],["styles/*.scss","Design tokens, mixins, base and component styles"],["types.ts","Student, Stats and Token types"],["api.ts","One typed request helper and ApiError"],["auth.ts, students.ts","Login, logout, token storage and student calls"],["ui.ts","HTML template functions with safe escaping"],["main.ts","App state, rendering and event handling"]]),k:["Run your API on port 8000 first. The CORS list from the earlier capstones already allows Vite on port 5173.","Setup: <code>npm create vite@latest student-ts -- --template vanilla-ts</code>, then <code>npm install</code> and <code>npm install -D sass</code>.","Create a <code>.env</code> file with <code>VITE_API_URL=http://127.0.0.1:8000</code>.","Delete the sample files (<code>counter.ts</code>, <code>style.css</code>)."],q:"Which two tools does the capstone add on top of the Vite vanilla-ts template?",a:"The sass package (for SCSS) and our own code. TypeScript is already included."},
304:{l:"TC2",t:"Capstone Step 1: The SCSS Design System",s:"Start with the look. Variables and a map hold the design tokens, a mixin handles breakpoints, and partials keep the styles organised.",k:["<code>_variables.scss</code>: colors, spacing, radius.","<code>_mixins.scss</code>: a <code>up()</code> breakpoint mixin and a <code>card</code> mixin.","<code>_base.scss</code> and <code>_components.scss</code>: reset, layout, buttons, form and table.","<code>main.scss</code> brings them together with <code>&#64;use</code>. The table becomes scrollable on small screens."],q:"Why split the styles into partials?",a:"Each file has one job, which makes the styles easier to read and change."},
305:{l:"TC3",t:"Capstone Step 2: Types, API Client, Auth and Student Calls",s:"The typed foundation. One generic request function handles tokens, form data, JSON and errors for every call.",k:["<code>request&lt;T&gt;()</code> returns <code>Promise&lt;T&gt;</code>, so every call is typed.","<code>ApiError</code> carries the HTTP status. A 401 means the token expired.","Login sends <b>form data</b> (<code>URLSearchParams</code>), as FastAPI and the Spring version expect.","<code>import type</code> is used for types, which the Vite template requires (<code>verbatimModuleSyntax</code>)."],q:"What does request&lt;Student[]&gt;('/students') return?",a:"A Promise that gives an array of Student objects."},
306:{l:"TC4",t:"Capstone Step 3: HTML Templates in ui.ts",s:"Functions that return HTML strings for the login page, the dashboard, the form and the table. All text from the user is escaped.",k:["<code>escapeHtml()</code> turns &lt; &gt; &amp; and quotes into safe text, so a student called <code>&lt;script&gt;</code> can't attack the page.","Buttons carry <code>data-action</code> and <code>data-id</code> attributes, so one listener can handle all clicks (event delegation).","The table body and statistics have their own ids, so searching updates only those parts."],q:"Why do we escape student names before putting them in innerHTML?",a:"To stop XSS: a malicious name containing HTML or script could otherwise run in the page."},
307:{l:"TC5",t:"Capstone Step 4: main.ts, State and Events",s:"The brain of the app: a typed state object, a render function, and three delegated listeners for click, submit and input.",k:["<code>State</code> is an interface, and every change goes through <code>render()</code> or the partial <code>refreshTable()</code>.","A <b>debounce</b> of 300 ms waits for the user to stop typing before searching.","<code>FormData</code> reads form fields, so we don't need state for each input.","On a <b>401</b> reply, the app logs out and shows the login page."],q:"What does the 300 ms debounce on the search box prevent?",a:"Sending a request on every key press."},
308:{l:"TC6",t:"Capstone Step 5: Run, Build, Serve and Level Up",s:"Run the dev server, build the production files, and serve them from your FastAPI or Spring Boot server.",k:["Dev: <code>npm run dev</code> (http://localhost:5173). The type check runs with <code>npx tsc --noEmit</code>.","Build: put <code>VITE_API_URL=</code> (empty) in <code>.env.production</code>, then <code>npm run build</code>. Copy <code>dist</code> into FastAPI's <code>StaticFiles</code> mount or Spring's <code>static</code> folder.","This app has no hash router, so it's one page: login or dashboard is chosen by the token.","<b>Level up:</b> keep form values after an error, add pagination, dark mode with CSS variables, tests with Vitest, and a Zod schema for API responses."],q:"Why must the build use an empty VITE_API_URL when the backend serves it?",a:"So the app calls the same address it was loaded from."}
,
310:{l:"EX1",t:"What are Node.js and Express? Your First Server",s:"Node.js runs JavaScript on a server. Express is the most popular small framework on top of it for building web APIs. It is the Node.js world's answer to FastAPI.",e:"Node.js is the kitchen, and Express is the waiter who takes orders (requests) and brings back dishes (responses).",f:["Client","Request","Express route","Response (JSON)"],x:tb([["Task","FastAPI (Python)","Express (Node.js)"],["Run","fastapi dev main.py","node --watch index.js"],["Route","&#64;app.get('/')","app.get('/', handler)"],["Validation","Pydantic","Zod"],["Auth","Depends + JWT","Middleware + JWT"],["Docs","Automatic at /docs","Add Swagger UI yourself"]]),k:["Install Node.js 22 or newer from nodejs.org. Check with <code>node -v</code>.","<code>npm init -y</code>, then <code>npm pkg set type=module</code> to use <code>import</code> syntax.","<code>npm install express</code>. Current Express is <b>version 5</b>.","Express 5 highlights: errors thrown in <code>async</code> handlers go to your error handler automatically, <code>req.body</code> is <code>undefined</code> until a body parser runs, and wildcard routes need a name like <code>/*splat</code>.","Run with <code>node --watch index.js</code> to restart on every change."],q:"Which command installs Express?",a:"npm install express"},
311:{l:"EX2",t:"Node.js Core Modules and Configuration",s:"Node comes with built-in modules for files, paths, events and more. Settings like secrets and ports belong in environment variables, not in code.",k:["Import built-ins with the <code>node:</code> prefix: <code>node:fs/promises</code>, <code>node:path</code>, <code>node:crypto</code>, <code>node:events</code>.","<code>import.meta.dirname</code> gives the folder of the current file (Node 20.11+).","<code>process.env.PORT</code> reads an environment variable. <code>node --env-file=.env app.js</code> loads a <code>.env</code> file (Node 20.6+).","<b>Never commit .env</b> to Git. Add it to .gitignore.","<code>crypto.randomUUID()</code> makes a unique id. <code>EventEmitter</code> lets parts of a program talk to each other."],e:"Environment variables are sticky notes on the machine: 'the port is 3000, the secret is ...'. The code reads the notes, so the same code works on every computer.",q:"Why keep secrets in environment variables?",a:"So they stay out of your code and Git, and each computer can use different values."},
312:{l:"EX3",t:"Express Routing: Requests, Responses and a CRUD API",s:"A route connects an HTTP method and a URL to a function. The function reads the request (req) and sends a response (res).",x:tb([["Action","Method","Example","Success code"],["Create","POST","/students","201"],["Read","GET","/students, /students/1","200"],["Update","PUT / PATCH","/students/1","200"],["Delete","DELETE","/students/1","204"]]),k:["<code>req.params.id</code> reads <code>/students/7</code>. <code>req.query.search</code> reads <code>?search=ri</code>. <code>req.body</code> reads the JSON body.","<code>res.json(data)</code> sends JSON. <code>res.status(404).json({...})</code> sets the status. <code>res.sendStatus(204)</code> sends only a status.","Values in <code>req.params</code> and <code>req.query</code> are always text. Convert with <code>Number()</code>.","<code>express.json()</code> must be added so Express can read JSON bodies."],q:"Where does Express put the id from /students/7?",a:"In req.params.id (as text)."},
313:{l:"EX4",t:"Middleware: The Heart of Express",s:"Middleware is a function that runs between the request and your route. It can read or change the request, stop it, or pass it on with next().",e:"A security check, a ticket counter and a luggage scanner at an airport. Every passenger goes through them in order before boarding.",f:["Request","Logger","express.json()","Auth check","Route","Response"],k:["<code>app.use(fn)</code> runs <code>fn</code> for every request. Order matters: they run in the order you write them.","Signature: <code>(req, res, next)</code>. Call <code>next()</code> to continue, or send a response to stop.","<b>Error middleware</b> has four arguments: <code>(err, req, res, next)</code>, and goes <b>last</b>.","Put a <b>404 handler</b> after all routes.","Built-in: <code>express.json()</code>, <code>express.urlencoded()</code>, <code>express.static()</code>."],q:"How many arguments does an error-handling middleware have?",a:"Four: err, req, res, next."},
314:{l:"EX5",t:"Routers and Project Structure",s:"As the app grows, split routes into files with express.Router, and keep app creation separate from starting the server.",k:["<code>const router = express.Router();</code> then <code>app.use('/students', router)</code>.","<b>app.js</b> builds the app and exports it. <b>server.js</b> calls <code>listen</code>. This makes testing easy.","Keep layers: <b>routes</b> (HTTP), <b>services or repositories</b> (rules and data), <b>middleware</b> (shared checks).","Group by feature as the project grows: <code>students/</code>, <code>auth/</code>."],e:"A school has departments. The main office (app.js) just points visitors to the right department (router).",q:"Why separate app.js from server.js?",a:"Tests can import the app without opening a network port."},
315:{l:"EX6",t:"Validation with Zod (the Pydantic of Node)",s:"Never trust incoming data. Zod lets you describe the expected shape once, then checks and cleans the data, and gives clear error messages.",e:"A gate guard with a checklist: name 2 to 50 letters, age 5 to 100, valid email. Anything else is turned back with a reason.",k:["<code>npm install zod</code>. <code>z.object({ name: z.string().min(2) })</code>.","<code>schema.safeParse(data)</code> returns <code>{ success, data }</code> or <code>{ success: false, error }</code>.","Clean data while checking: <code>.trim()</code>, <code>.toLowerCase()</code>, <code>.transform(fn)</code>, <code>.default(0)</code>.","<code>error.issues</code> lists each problem with its <code>path</code> and <code>message</code>.","Write a <code>validate(schema)</code> middleware and reuse it on every route. Bad data gets <b>422</b>."],q:"Which Zod method checks data without throwing?",a:"safeParse"},
316:{l:"EX7",t:"SQLite with better-sqlite3",s:"better-sqlite3 gives a fast, simple way to use a SQLite database file. Its calls are synchronous, so the code is short.",f:["db.prepare(sql)","run / get / all","SQLite file"],k:["<code>npm install better-sqlite3</code>. <code>new Database('students.db')</code> creates the file.","<code>db.exec(sql)</code> runs setup SQL. <code>db.prepare(sql)</code> makes a reusable statement.","<code>.run(...)</code> for insert, update and delete. <code>.get(...)</code> for one row. <code>.all(...)</code> for many rows.","<b>Always use ? placeholders</b>, never put user text into the SQL string. This stops SQL injection.","<code>db.transaction(fn)</code> makes several steps all-or-nothing.","Later you can switch to an ORM such as Prisma or Drizzle."],q:"How do you prevent SQL injection with better-sqlite3?",a:"Use ? placeholders and pass values to run, get or all."},
317:{l:"EX8",t:"Authentication: Password Hashing and JWT",s:"Passwords are stored only as hashes. After login the server gives a signed token (JWT). The client sends it on every request, and a middleware checks it.",e:"A cinema ticket: pay once, show the ticket after. It has a stamp that can't be faked and an expiry time.",f:["POST /login","bcrypt checks hash","jwt.sign()","Authorization: Bearer token","requireAuth middleware","jwt.verify()"],k:["<code>npm install bcryptjs jsonwebtoken</code>.","<code>await bcrypt.hash(password, 10)</code> to store, <code>await bcrypt.compare(password, hash)</code> to check.","<code>jwt.sign({ sub: username }, secret, { expiresIn: 1800 })</code> and <code>jwt.verify(token, secret, { algorithms: ['HS256'] })</code>.","A JWT is signed, not hidden. Never put secrets in it.","The <b>secret</b> comes from an environment variable and must be long and random.","Send <b>401</b> for a missing or bad token."],q:"Why store a password hash and not the password?",a:"If the database leaks, attackers still can't read the real passwords."},
318:{l:"EX9",t:"Errors, Security and Production Basics",s:"A good API fails politely and safely. Handle errors in one place and add basic protections.",k:["Make an <code>HttpError</code> class with a status and a message. Throw it anywhere. One error middleware turns it into JSON.","Express 5 sends thrown errors from <code>async</code> handlers to the error middleware.","<b>helmet</b> sets safe HTTP headers. <b>cors</b> controls which websites can call you. <b>express-rate-limit</b> slows down attackers.","Never send stack traces to clients. Log them on the server.","<code>process.on('SIGTERM', ...)</code> lets you close the server and database neatly.","Set <code>NODE_ENV=production</code> when you deploy."],q:"Where should unknown errors be logged?",a:"On the server only. Clients get a short, safe message."},
319:{l:"EX10",t:"Testing with node:test and Supertest",s:"Automatic tests call your API without starting a real server and check the answers.",k:["Node has a built-in test runner: <code>node --test</code>. No extra framework is needed.","<code>npm install -D supertest</code> makes fake HTTP calls: <code>request(app).get('/students')</code>.","Use an in-memory database for tests: <code>DB_PATH=:memory:</code>.","Use unique usernames in each test so tests don't depend on each other.","Test the happy path, the validation errors and the permission rules."],e:"A dress rehearsal: you play the whole show with pretend visitors before the real opening.",q:"Which package makes fake HTTP requests to an Express app in tests?",a:"supertest"},
320:{l:"EC1",t:"Capstone: Student API with Express, Zod, SQLite and JWT (Plan)",s:"The same Student API again, now in Node.js. It has the <b>same endpoints and JSON shapes</b> as the FastAPI and Spring Boot versions, so your React, Vue, Angular and TypeScript frontends work with it unchanged.",e:"Same brain, a fourth language. The frontends can't tell the difference.",f:["Frontend","cors + helmet","express.json","requireAuth","Route","Zod validate","SQLite"],x:tb([["FastAPI version","Express version"],["Pydantic schemas","Zod schemas"],["SQLAlchemy + SQLite","better-sqlite3 + SQL"],["Depends(get_current_user)","requireAuth middleware"],["HTTPException","HttpError + error middleware"],["passlib or pwdlib","bcryptjs"],["PyJWT","jsonwebtoken"],["pytest + TestClient","node:test + supertest"]])+tb([["Endpoint","Auth?","What it does"],["POST /register","No","Create an account"],["POST /login (form data)","No","Get a JWT token"],["GET /me","Yes","The logged-in user"],["POST /students","Yes","Add a student"],["GET /students?search=&amp;skip=&amp;limit=","Yes","List and search own students"],["GET /students/:id","Yes","One student"],["PATCH /students/:id","Yes","Change some fields"],["DELETE /students/:id","Yes","Delete a student"],["GET /stats","Yes","Count, average, highest marks"]]),k:["Each student has an <b>owner_id</b>. Someone else's student returns 404.","Runs on <b>port 8000</b> like the other versions.","Errors look like <code>{ &quot;detail&quot;: ... }</code>, with 422 for bad data."],q:"Why can the same frontend work with FastAPI, Spring Boot and Express?",a:"All three have the same endpoints, request shapes and response shapes."},
321:{l:"EC2",t:"Capstone Step 1: Setup, Config and the Database",s:"Create the project, install the packages, read settings from environment variables, and create the SQLite tables.",k:["<code>.env</code> holds <code>JWT_SECRET</code>. It is loaded with <code>--env-file</code>.","<code>db.js</code> creates the folder, opens the database, turns on foreign keys and creates the <code>users</code> and <code>students</code> tables.","<code>email</code> and <code>username</code> are <code>UNIQUE</code>. <code>owner_id</code> links a student to a user.","In production the server refuses to start with the default secret."],q:"Which SQL keyword stops two students from having the same email?",a:"UNIQUE"},
322:{l:"EC3",t:"Capstone Step 2: Errors and Zod Validation",s:"One HttpError class, one error middleware and the Zod schemas. Errors look exactly like the FastAPI ones.",k:["Validation errors give <b>422</b> with <code>detail</code> as a list of <code>{ loc, msg }</code>.","Create and update schemas share field rules, but only create has <code>marks.default(0)</code>. Otherwise PATCH would reset marks.","Names are tidied (trim, capital letters) and emails are lower-cased inside the schema.","Broken JSON from <code>express.json()</code> is turned into a 422 too."],q:"Why must the update schema not use default(0) for marks?",a:"A missing marks field in PATCH would be replaced by 0, changing the student's marks by accident."},
323:{l:"EC4",t:"Capstone Step 3: Auth (Hashing, JWT and Middleware)",s:"Register, login and the requireAuth middleware that protects every other route.",k:["<code>/login</code> reads <b>form data</b>, so the app needs <code>express.urlencoded()</code>.","The same message is used for a wrong username and a wrong password. This does not reveal which usernames exist.","<code>requireAuth</code> reads <code>Authorization: Bearer ...</code>, verifies the token, loads the user and puts it on <code>req.user</code>.","Wrong or expired tokens give 401."],q:"Where does requireAuth put the logged-in user?",a:"On req.user."},
324:{l:"EC5",t:"Capstone Step 4: Student Routes (CRUD and Stats)",s:"The routes for adding, listing, reading, updating and deleting students, plus the stats. Every query is filtered by the owner.",k:["Every SQL statement includes <code>owner_id = ?</code>. A user can never touch another user's data.","<code>skip</code> and <code>limit</code> are checked and limited to 1 to 100.","PATCH builds the SQL <code>SET</code> part only from the fields that were sent (from a safe list).","Duplicate emails give <b>409</b>, and missing students give <b>404</b>."],q:"Why is the PATCH column list taken from a fixed list in the code?",a:"So user input can never become part of the SQL (that would allow SQL injection)."},
325:{l:"EC6",t:"Capstone Step 5: app.js, server.js and Running It",s:"Put everything together: security headers, CORS, body parsers, routes, the optional built frontend, the 404 handler and the error middleware.",k:["Order: helmet, cors, body parsers, routes, static files, 404, error handler.","Drop a built frontend into the <code>public</code> folder and Express serves it at <code>/</code>.","Graceful shutdown closes the server on Ctrl+C.","Try the curl commands: register, login, create, list, stats, and one without a token."],q:"Why does the error middleware have to be the last one?",a:"It only catches errors from the middleware and routes that come before it."},
326:{l:"EC7",t:"Capstone Step 6: Tests, Frontends, Docker and Level Up",s:"Test the API automatically, connect your frontends, and package it in a container.",k:["Tests use an in-memory database and Supertest. They check 401, 422, 409, 404 and the full CRUD flow.","<b>Frontends:</b> run the API on port 8000 and start your React, Vue, Angular or TypeScript app. No change is needed.","<b>One server:</b> copy the built <code>dist</code> into <code>public</code>.","<b>Level up:</b> an ORM (Prisma or Drizzle), PostgreSQL, refresh tokens, roles, OpenAPI docs with Swagger UI, TypeScript, and logging with pino."],q:"What must you change in the frontend to use the Express API?",a:"Nothing. The API has the same address, endpoints and JSON shapes."}
