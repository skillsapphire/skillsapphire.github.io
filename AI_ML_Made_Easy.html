340:{l:"SO1",t:"Good Design: Coupling, Cohesion, DRY, KISS and YAGNI",s:"Good software is easy to change. Two ideas explain most of it: parts should depend on each other as little as possible (low coupling), and each part should do one related job (high cohesion).",e:"A LEGO model can be rebuilt brick by brick (low coupling). A glued model must be broken to change anything (high coupling).",x:tb([["Rule","Meaning"],["DRY","Don't Repeat Yourself: one fact, one place"],["KISS","Keep It Simple: the simplest thing that works"],["YAGNI","You Aren't Gonna Need It: don't build for an imaginary future"],["Composition over inheritance","Build objects from small parts instead of deep class trees"],["Tell, don't ask","Tell an object what to do instead of pulling out its data to decide for it"]])+tb([["Code smell","Usually means"],["Very long method","Doing too many things: split it"],["God class (does everything)","Break it into focused classes"],["Magic numbers like 0.18","Give them names: TAX_RATE"],["Copy-pasted code","Extract a method or class"],["Changing one thing breaks five files","Too much coupling"]]),k:["The next five lessons (SOLID) are rules that give you low coupling and high cohesion.","Rules are guides, not laws. Over-engineering is also a problem.","The code examples in this part use Java 17 or newer, but the ideas work in every language."],q:"What does low coupling mean?",a:"Parts of the program depend on each other as little as possible, so you can change one without breaking others."},
341:{l:"SO2",t:"S: Single Responsibility Principle",s:"A class should have only one reason to change. Each class does one job.",e:"A restaurant has a cook, a cashier and a cleaner. If one person did all three jobs, a change in the menu, the prices or the cleaning rules would all land on the same person.",k:["'One reason to change' means one <b>actor</b> or concern: calculation, saving, formatting, e-mailing.","Signs of a violation: a class name with 'And' or 'Manager', many unrelated imports, a huge file.","Fix: split into small classes and let one class coordinate them.","Smaller classes are easier to test and to reuse."],q:"What is wrong with a class that calculates grades, saves to the database and sends e-mails?",a:"It has several reasons to change, so a change in one job can break the others. Each job should be its own class."},
342:{l:"SO3",t:"O: Open/Closed Principle",s:"Software should be open for extension but closed for modification. You add new behaviour by adding new code, not by editing old, tested code.",e:"A phone with a USB port: you add new devices by plugging them in. You don't open the phone and solder wires every time.",k:["A long <code>if / else if</code> or <code>switch</code> on a type is the usual warning sign.","Fix: put the varying behaviour behind an <b>interface</b> and add a new class for each new case.","This is the Strategy pattern in disguise (see the patterns lessons).","Don't make everything extensible. Do it where change really keeps happening."],q:"You must add a new discount type. With the Open/Closed Principle, what do you do?",a:"Add a new class that implements the discount interface, and leave the existing code unchanged."},
343:{l:"SO4",t:"L: Liskov Substitution Principle",s:"Wherever you use a parent type, you must be able to use any of its child types without surprises. A child must keep the promises of the parent.",e:"If a recipe says 'use any bird to carry the message' and you hand over a penguin, the plan fails. A penguin is a bird, but it is not a flying bird.",k:["Don't throw 'not supported' errors from an overridden method. That breaks the promise.","A child may <b>accept more</b> and <b>promise more</b>, never accept less or promise less.","Famous trap: <code>Square extends Rectangle</code>. Setting the width of a square changes its height, so code written for rectangles gets wrong answers.","Fix: use a smaller shared interface, or composition instead of inheritance."],q:"Why is Square extends Rectangle a bad idea if the rectangle has setWidth and setHeight?",a:"Code that expects a rectangle to keep its height when the width changes breaks when it gets a square."},
344:{l:"SO5",t:"I: Interface Segregation Principle",s:"Don't force a class to depend on methods it doesn't use. Prefer many small interfaces over one big one.",e:"A TV remote with 100 buttons for every device. If you only own a fan, 95 buttons are useless and confusing. A simple fan remote is better.",k:["A <b>fat interface</b> forces classes to write empty or exception-throwing methods.","Fix: split it into role interfaces such as <code>Workable</code> and <code>Feedable</code>.","A class can implement several small interfaces.","Callers then depend only on what they need, which also helps testing."],q:"A Robot class must implement eat() just because the Worker interface has it. Which principle is broken?",a:"Interface Segregation. Split Worker into smaller interfaces."},
345:{l:"SO6",t:"D: Dependency Inversion Principle",s:"High-level code should depend on abstractions (interfaces), not on low-level details. The details are handed in from outside.",e:"A lamp plugs into a wall socket (an interface). It doesn't care if the power comes from solar or coal. You can swap the power plant without changing the lamp.",f:["High-level class","Interface","Low-level class (e-mail, SMS, fake)"],k:["<b>Dependency Injection (DI)</b> is the technique: pass the dependency through the constructor.","Spring, FastAPI's <code>Depends</code>, NestJS and Angular are all DI systems.","Testing becomes easy: give the class a <b>fake</b> instead of the real e-mail server.","Inversion means the arrow of dependency points to the abstraction, from both sides."],q:"Why does Dependency Inversion make testing easier?",a:"You can inject a fake object in place of the real one, so tests are fast and don't need real services."},
346:{l:"DP1",t:"Design Patterns: What They Are and Why They Matter",s:"A design pattern is a proven, named solution to a problem that keeps coming back in software design. Patterns give developers a shared vocabulary.",e:"Cooking recipes: 'make a roux' tells every cook exactly what to do. 'Use the Observer pattern' tells every developer the structure of the solution.",x:tb([["Group","Question it answers","Patterns"],["Creational","How do I create objects?","Singleton, Factory Method, Abstract Factory, Builder, Prototype"],["Structural","How do I combine objects?","Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy"],["Behavioral","How do objects talk and share work?","Strategy, Observer, Command, State, Template Method, Chain of Responsibility, Iterator, Mediator, Memento, Visitor, Interpreter"]]),k:["The classic book 'Design Patterns' (the Gang of Four, 1994) describes 23 patterns.","A pattern has a name, a problem, a solution and trade-offs.","Don't force patterns. First feel the pain, then pick the pattern.","<b>Anti-patterns</b> are bad habits: God object, spaghetti code, golden hammer (using one pattern everywhere)."],q:"Name the three groups of GoF patterns.",a:"Creational, Structural and Behavioral."},
347:{l:"DP2",t:"Singleton: One and Only One",s:"Make sure a class has exactly one instance and give everyone access to it.",e:"The principal of a school. There is only one, and everyone goes to the same person.",k:["Make the constructor private and offer a static way to get the instance.","Best Java ways: an <b>enum</b> singleton, or the lazy <b>holder</b> idiom. Both are thread-safe.","Classic trouble: hidden global state and hard testing.","In modern apps, let a DI container create one shared instance (Spring beans are singletons by default) instead of writing your own Singleton."],q:"What is a safer modern alternative to writing your own Singleton?",a:"Let a dependency injection container manage a single shared instance."},
348:{l:"DP3",t:"Factory Method and Abstract Factory",s:"Let a special method or class decide which object to create, so the calling code doesn't need to know the exact class.",e:"You order 'a ride' in an app. The app (factory) decides whether to send a bike, a car or an auto.",k:["<b>Simple factory:</b> one method with a switch. Easy and often enough.","<b>Factory Method:</b> subclasses decide which class to create.","<b>Abstract Factory:</b> creates a whole family of related objects (for example a dark theme button and checkbox together).","It supports the Open/Closed Principle and keeps <code>new</code> out of the business code."],q:"What is the main benefit of a factory?",a:"The calling code doesn't depend on concrete classes, so it's easier to change and extend."},
349:{l:"DP4",t:"Builder: Building Complex Objects Step by Step",s:"Build an object with many parts or optional settings in readable steps, instead of a constructor with ten confusing parameters.",e:"Ordering a sandwich: bread, then filling, then sauce, then 'toast it'. At the end you say 'done' and get the finished sandwich.",k:["A constructor like <code>new Student('Riya', 15, null, null, true, 0)</code> is hard to read. A builder reads like a sentence.","Methods return the builder (<b>fluent style</b>): <code>.name('Riya').age(15).build()</code>.","The builder can check everything in <code>build()</code> and create an immutable object.","Java's <code>StringBuilder</code> and <code>HttpRequest.newBuilder()</code> are builders. Records plus a builder are a good pair."],q:"What problem does Builder solve?",a:"Constructors with many parameters, especially optional ones, which are hard to read and easy to get wrong."},
350:{l:"DP5",t:"Adapter: Making Incompatible Things Work Together",s:"Wrap an existing class so it matches the interface your code expects.",e:"A travel plug adapter: your charger is fine and the wall socket is fine, but they don't fit. The adapter sits in the middle.",k:["Use it for legacy code or third-party libraries you cannot change.","The adapter <b>implements your interface</b> and <b>holds the old object</b> inside.","Java examples: <code>Arrays.asList</code>, <code>InputStreamReader</code>.","It keeps messy details of other systems out of your core code."],q:"When would you use an Adapter?",a:"When you need to use a class whose interface doesn't match the one your code expects, and you can't change it."},
351:{l:"DP6",t:"Decorator: Adding Behaviour by Wrapping",s:"Add features to an object at runtime by wrapping it in another object with the same interface.",e:"Coffee: start with plain coffee, wrap it with milk, wrap that with sugar. Each wrapper adds a little to the price and the taste.",k:["Each decorator <b>implements the same interface</b> and holds the wrapped object.","You can stack decorators in any order: logging, caching, retry, compression.","It is an alternative to a huge tree of subclasses (a class for every combination).","Java I/O is the classic example: <code>new BufferedReader(new FileReader(...))</code>. Middleware in Express and FastAPI works the same way."],q:"How does a decorator differ from inheritance?",a:"It adds behaviour at runtime by wrapping, and you can combine many decorators, while inheritance is fixed at compile time."},
352:{l:"DP7",t:"Facade and Proxy",s:"A Facade gives a simple front door to a complicated system. A Proxy stands in for another object to control access to it.",e:"Facade: the reception desk at a hospital, where you just say what you need and they arrange the doctors and tests. Proxy: a security guard who decides who may meet the manager.",k:["<b>Facade</b> simplifies. It does not hide the subsystem, it just offers an easy entry.","<b>Proxy</b> has the <b>same interface</b> as the real object. Uses: lazy loading, caching, access control, logging, remote calls.","Spring uses proxies for <code>&#64;Transactional</code> and caching. Java has dynamic proxies built in.","An API gateway is a Facade plus a Proxy for your microservices."],q:"What is the difference between a Facade and a Proxy?",a:"A Facade offers a simpler interface to a complex system. A Proxy has the same interface as the real object and controls access to it."},
353:{l:"DP8",t:"Composite: Treating Groups Like Single Items",s:"Arrange objects in a tree where a single item and a group of items are used in the same way.",e:"Folders and files. You can ask 'how big are you?' to a file or to a folder (which asks everything inside it).",k:["A common interface (<code>FileSystemItem</code>) with <b>leaf</b> classes (file) and <b>composite</b> classes (folder).","The caller does not care whether it holds one item or a whole tree.","Examples: file systems, menus with submenus, UI components, organisation charts.","Recursion is natural here."],q:"Which classes does the Composite pattern have?",a:"A common interface, leaf classes, and composite classes that hold children of that interface."},
354:{l:"DP9",t:"Strategy: Swappable Algorithms",s:"Define a family of algorithms behind one interface, and let the program choose one at runtime.",e:"Going to school: by bus, by cycle or on foot. The goal is the same and the method can be swapped.",k:["The class that uses the strategy (the <b>context</b>) just calls the interface.","In Java a strategy can be a <b>lambda</b>, like <code>Comparator</code>.","This is how you fix a long if/else chain (Open/Closed Principle).","Examples: payment methods, sorting, price rules, compression."],q:"Which pattern replaces a long if/else that chooses between algorithms?",a:"Strategy."},
355:{l:"DP10",t:"Observer: Telling Everyone Who Cares",s:"When one object changes, it automatically notifies all objects that subscribed to it.",e:"A YouTube channel. When a new video is uploaded, all subscribers get a notification. The channel doesn't know who they are.",k:["The <b>subject</b> keeps a list of observers and calls them when something happens.","Loose coupling: the subject depends only on the observer interface.","This is the base of event systems, UI listeners (<code>addEventListener</code>), and message brokers.","Beware of memory leaks: unsubscribe when you don't need updates."],q:"What is the main benefit of the Observer pattern?",a:"The subject can notify many listeners without knowing who they are, so they are loosely coupled."},
356:{l:"DP11",t:"Command: Requests as Objects (Undo and Redo)",s:"Turn an action into an object. Then you can store it, queue it, log it, or undo it.",e:"A restaurant order slip. The waiter writes it down, it goes to the kitchen queue, and it can be cancelled before cooking.",k:["A <code>Command</code> has <code>execute()</code> and often <code>undo()</code>.","An <b>invoker</b> runs commands and keeps a history (a stack) for undo.","Used for: undo and redo, job queues, macros, transactions, task schedulers.","A lambda can be a simple command."],q:"Which data structure is commonly used to implement undo with the Command pattern?",a:"A stack of executed commands."},
357:{l:"DP12",t:"State: Behaviour That Changes with the State",s:"Let an object change its behaviour when its internal state changes, without a mess of if statements.",e:"A traffic light. Red, green and yellow each have different rules, and each state knows which state comes next.",k:["Each state is its own class (or enum constant) with its own behaviour.","The context object delegates to the current state.","Perfect for order workflows (NEW, PAID, SHIPPED, DELIVERED) and for connection or game states.","Compare: Strategy is chosen by the client, State changes by itself."],q:"How is State different from Strategy?",a:"In State, the object switches its own behaviour as its state changes. In Strategy, the client chooses the algorithm."},
358:{l:"DP13",t:"Template Method and Chain of Responsibility",s:"Template Method fixes the skeleton of an algorithm and lets subclasses fill in some steps. Chain of Responsibility passes a request along a line of handlers until one handles it.",e:"Template: a recipe with fixed steps (boil, add, serve) where you choose the vegetable. Chain: a complaint going from clerk to manager to director.",k:["<b>Template Method:</b> an abstract class with a <code>final</code> method that calls the steps. Frameworks use it everywhere ('hooks').","<b>Chain:</b> each handler either processes the request or passes it on. Middleware in Express, servlet filters and Spring Security filters are chains.","Chain makes it easy to add, remove or reorder checks.","Prefer composition (Strategy) when the steps can be passed in as functions."],q:"Which pattern are Express middleware and servlet filters examples of?",a:"Chain of Responsibility."},
359:{l:"DP14",t:"The Other Patterns, Modern Patterns and Anti-Patterns",s:"A quick map of the rest of the Gang of Four patterns, plus patterns you will meet in real back-end projects.",x:tb([["Pattern","One line"],["Prototype","Create new objects by copying an existing one"],["Bridge","Separate an abstraction from its implementation so both can vary"],["Flyweight","Share common data between many small objects to save memory"],["Iterator","Go through a collection without knowing how it is stored"],["Mediator","One object coordinates talk between others (a chat room)"],["Memento","Save and restore an object's state (snapshots)"],["Visitor","Add new operations to a class tree without changing the classes"],["Interpreter","Define a small language and evaluate it"]])+tb([["Modern pattern","One line"],["Repository","Hides the database behind a collection-like interface"],["DTO","A plain object used to carry data across a boundary"],["Unit of Work","Groups changes into one transaction"],["Dependency Injection","Dependencies are handed in from outside"],["Null Object","A do-nothing object instead of null"],["Specification","Business rules as combinable objects"],["CQRS","Separate models for reading and writing (see microservices)"]]),k:["Anti-patterns: God object, spaghetti code, copy-paste programming, premature optimisation, golden hammer, singleton overuse.","Patterns you have already used in this course: Repository and DTO (Spring and FastAPI capstones), Chain (Express middleware), Proxy (Spring transactions), Observer (events in Redis streams), Builder (Java HttpRequest)."],q:"Which pattern hides the database behind a collection-like interface?",a:"Repository."},
360:{l:"SD1",t:"System Design: Requirements and Back-of-the-Envelope Estimation",s:"System design means planning how the parts of a large system (servers, databases, caches, queues) fit together so it works for millions of users. You start from requirements and rough numbers, not from technology.",e:"Planning a city's water supply: first ask how many people, how much water each, and when it is needed most. Only then choose pipes and tanks.",f:["Requirements","Estimate","High-level design","Deep dive","Bottlenecks and trade-offs"],x:tb([["Latency (approximate)","Time"],["Read from memory (RAM)","about 100 nanoseconds"],["Random read from SSD","about 100 microseconds"],["Round trip in the same data centre","about 0.5 milliseconds"],["Disk seek (spinning disk)","about 10 milliseconds"],["Round trip across continents","about 150 milliseconds"]])+tb([["Availability","Downtime per year"],["99%","3.65 days"],["99.9%","8.76 hours"],["99.99%","52.6 minutes"],["99.999%","5.26 minutes"]]),k:["<b>Functional requirements:</b> what the system does (post a photo, follow someone). <b>Non-functional:</b> speed, availability, consistency, scale, cost, security.","<b>Estimate:</b> users, requests per second (QPS), storage, bandwidth. A day has about 86,400 seconds, and peak traffic is a few times the average.","Always state your assumptions, and discuss trade-offs. There is no single perfect design."],q:"About how many seconds are in a day, for quick estimates?",a:"About 86,400 (roughly 100,000 is fine for rough maths)."},
361:{l:"SD2",t:"Scalability and Load Balancing",s:"Scaling means handling more users. You can make one machine bigger (vertical) or add more machines (horizontal). A load balancer spreads requests across the machines.",e:"A supermarket with one counter and a long queue. Add more counters (horizontal), and a staff member at the door sends each customer to the shortest queue (load balancer).",f:["Clients","Load balancer","Server 1","Server 2","Server 3"],x:tb([["","Vertical scaling","Horizontal scaling"],["How","Bigger machine","More machines"],["Limit","Hardware limit, a single point of failure","Practically unlimited, needs a stateless design"],["Cost","Gets expensive fast","Cheap machines in bulk"]]),k:["<b>Stateless servers:</b> keep no user data in the server's memory (store sessions in Redis or in a JWT). Then any server can answer any request.","Load balancer algorithms: round robin, least connections, weighted, IP hash (sticky).","<b>L4</b> balancers look at TCP and IP. <b>L7</b> balancers read HTTP (paths, headers).","Health checks remove broken servers. Autoscaling adds servers when CPU or queue length grows.","Examples: nginx, HAProxy, AWS ALB, Kubernetes Service."],q:"Why must servers be stateless to scale horizontally?",a:"So any server can handle any request, and you can add or remove servers freely."},
362:{l:"SD3",t:"Caching: Making Things Fast",s:"A cache stores the answers to common questions in fast memory, so you don't repeat slow work like database queries.",e:"A teacher writes a frequently asked answer on the board. Students read it instead of asking again and again.",x:tb([["Strategy","How it works","Good for"],["Cache-aside","App checks the cache, on a miss reads the DB and fills the cache","Most read-heavy apps"],["Write-through","Write to the cache and the DB together","Data that must be fresh"],["Write-back","Write to the cache first, save to the DB later","Very high write speed (risk of loss)"],["Read-through","The cache itself loads from the DB","Simple clients"]]),k:["<b>Eviction:</b> when the cache is full, remove something. LRU (least recently used) is popular.","<b>TTL</b> (time to live) lets data expire by itself.","There are two hard things: naming and <b>cache invalidation</b>. Change the DB, then delete or update the key.","<b>Cache stampede:</b> many requests miss at the same moment and hit the database. Fix with a lock, or by refreshing early.","Layers: browser, CDN (static files near users), application cache (Redis, Memcached), database cache."],q:"In cache-aside, what happens on a cache miss?",a:"The app reads from the database, then stores the result in the cache for next time."},
363:{l:"SD4",t:"Databases: SQL, NoSQL, Indexing, Replication and Sharding",s:"Choosing and scaling the database is the heart of most designs.",x:tb([["","SQL (relational)","NoSQL"],["Data","Tables with fixed columns","Documents, key-value, wide-column, graph"],["Strengths","Joins, transactions (ACID), strong rules","Flexible shape, easy horizontal scaling"],["Examples","PostgreSQL, MySQL, SQLite","MongoDB, Redis, Cassandra, DynamoDB"],["Choose when","Related data, money, consistency","Huge scale, simple access patterns, flexible data"]]),k:["<b>ACID:</b> Atomic, Consistent, Isolated, Durable. <b>BASE:</b> Basically Available, Soft state, Eventually consistent.","<b>Index:</b> like a book's index. Reads get fast, writes get a little slower, and it uses space. Index the columns you filter or join on.","<b>Replication:</b> copies of the data. A leader handles writes and followers handle reads (watch for replication lag).","<b>Sharding:</b> split the data across machines by a key. A bad key creates a 'hot' shard. <b>Consistent hashing</b> reduces data movement when machines are added.","<b>CAP theorem:</b> during a network partition you must choose consistency or availability. PACELC adds: otherwise, you trade latency against consistency."],q:"What is the trade-off of adding an index?",a:"Faster reads, but slower writes and extra storage."},
364:{l:"SD5",t:"APIs, Protocols and Rate Limiting",s:"How clients and services talk, and how to keep an API fast, safe and fair.",x:tb([["Style","Best for","Notes"],["REST over HTTP/JSON","Public and simple APIs","Easy, cacheable, universal"],["gRPC","Service-to-service","Binary, fast, strict contracts"],["GraphQL","Mobile and complex UIs","Client picks the fields, harder caching"],["WebSocket","Chat, live updates","Two-way, long-lived connection"],["Server-Sent Events","One-way live feed","Simple, over HTTP"]]),k:["<b>Pagination:</b> offset (<code>?skip=20&amp;limit=10</code>) is simple but slow on big tables. <b>Cursor</b> pagination (<code>?after=id</code>) stays fast.","<b>Idempotency:</b> repeating the same request gives the same result (GET, PUT, DELETE). For POST use an <b>Idempotency-Key</b> so retries don't charge twice.","<b>Versioning:</b> <code>/v1/students</code> or a header.","<b>Rate limiting</b> algorithms: token bucket, leaky bucket, fixed window, sliding window. Answer with <b>429 Too Many Requests</b>.","HTTP codes: 2xx success, 4xx client mistake, 5xx server problem."],q:"What does an Idempotency-Key protect against?",a:"A retried request being processed twice, such as charging a customer two times."},
365:{l:"SD6",t:"Messaging and Asynchronous Processing",s:"Instead of waiting for slow work, put a message in a queue and let another service handle it later.",e:"The post box: you drop a letter and walk away. The postman delivers it when ready, even if the receiver is not home.",f:["Producer","Queue or topic (broker)","Consumer(s)"],x:tb([["","Message queue","Publish/subscribe (event stream)"],["Delivery","One consumer gets each message","Every subscriber gets a copy"],["Examples","RabbitMQ, SQS, Redis lists","Kafka, Redis Streams, SNS, Pulsar"],["Use","Background jobs, task distribution","Events, notifications, data pipelines"]]),k:["Benefits: faster responses, smoothing traffic spikes (<b>buffering</b>), decoupling, easy retries.","<b>Delivery:</b> at-most-once (may lose), at-least-once (may repeat), exactly-once (hard, usually 'at-least-once plus idempotent consumer').","<b>Idempotent consumer:</b> processing the same message twice must be safe. Keep a set of handled message ids.","<b>Dead-letter queue (DLQ):</b> messages that keep failing go here for a human to check.","<b>Back-pressure:</b> slow consumers should be able to slow producers, or the queue grows without end.","<b>Outbox pattern:</b> save the event in the same DB transaction as the data, then publish it from there."],q:"Why must consumers be idempotent with at-least-once delivery?",a:"Because the same message can arrive more than once, and processing it twice must not cause damage."},
366:{l:"SD7",t:"Reliability: Retries, Timeouts, Circuit Breakers and Bulkheads",s:"Things fail all the time: networks, disks, other services. A reliable system expects failure and handles it.",e:"A house's electric fuse. When there's a fault, the fuse cuts the circuit to protect everything else, and you restore it after fixing the problem.",x:tb([["Technique","What it does"],["Timeout","Never wait forever for another service"],["Retry with exponential backoff and jitter","Try again after 1s, 2s, 4s... plus random delay, so everyone doesn't retry together"],["Circuit breaker","After many failures, stop calling for a while (closed, open, half-open)"],["Bulkhead","Separate resource pools, so one slow part can't use up everything"],["Fallback","Return a default or cached answer"],["Redundancy and failover","Run copies in different zones; switch when one fails"]]),k:["<b>SLI</b> is what you measure (error rate), <b>SLO</b> is the goal (99.9%), <b>SLA</b> is the promise to customers, with penalties.","Only retry <b>idempotent</b> operations, and limit the number of retries.","Design for graceful degradation: if recommendations fail, still show the page.","Test failures on purpose (chaos engineering)."],q:"Why add random jitter to retry delays?",a:"So many clients don't all retry at the same instant and overload the recovering service."},
367:{l:"SD8",t:"Observability and Security",s:"You can't fix what you can't see, and you can't trust what you didn't protect.",k:["<b>Three pillars of observability:</b> <b>logs</b> (what happened), <b>metrics</b> (numbers over time: rate, errors, duration), <b>traces</b> (the path of one request across services).","Use <b>structured (JSON) logs</b> with a <b>correlation id</b> in every line.","<b>Health checks:</b> liveness (is it alive?) and readiness (can it take traffic?).","<b>Alerting</b> on symptoms users feel (error rate, latency), not on every small thing.","<b>Security basics:</b> HTTPS everywhere, hash passwords, validate all input, least privilege, secrets in a vault or environment, rate limits, keep dependencies updated.","<b>AuthN</b> proves who you are (login, OAuth2, OIDC). <b>AuthZ</b> decides what you may do (roles, ownership).","Know the OWASP Top 10: injection, broken access control, weak crypto and more."],e:"A car's dashboard: speed, fuel, warning lights. Without it you only find problems when the car stops.",q:"What is a correlation id used for?",a:"To follow one request through the logs of all the services it touches."},
368:{l:"SD9",t:"Design a URL Shortener",s:"A classic design problem. Turn a long web address into a short one, and redirect when someone opens it.",f:["POST /shorten","Make id","Base62 code","Store","GET /code","Cache lookup","301 or 302 redirect"],x:tb([["Step","Decision"],["Requirements","Create short links, redirect fast, optional expiry and custom alias, analytics"],["Estimate","100 million new links a month is about 40 writes per second. A 100 to 1 read ratio gives about 4,000 reads per second"],["Code length","7 characters of base62 (a-z, A-Z, 0-9) gives 62^7, about 3.5 trillion links"],["Database","Key-value or SQL: code (primary key), long_url, created_at, expires_at"],["Speed","Cache hot links in Redis. Redirect from memory"],["IDs","Counter ranges handed to each server, or a Snowflake-style id. Don't use random codes without collision checks"],["Redirect","301 is permanent (browsers cache, fewer hits). 302 is temporary (every click is counted)"]]),k:["Add rate limiting and URL validation, and block malicious links.","Analytics are written through a queue, so redirects stay fast.","Scale: stateless app servers behind a load balancer, a cache, sharded database by code."],q:"Why use base62 for the short code?",a:"It uses 62 characters (letters and digits), so a few characters can encode a huge number, and the code is URL-safe."},
369:{l:"SD10",t:"Design a News Feed and a Chat System",s:"Two classic real-time designs: building a feed of posts, and delivering chat messages instantly.",x:tb([["News feed","Fan-out on write (push)","Fan-out on read (pull)"],["How","When someone posts, copy the post id into every follower's feed list","Build the feed when the user opens the app"],["Good","Fast reads","Cheap writes, always fresh"],["Bad","Celebrities with millions of followers make huge write bursts","Slow reads"],["Real systems","Hybrid: push for normal users, pull for celebrities","(same)"]]),k:["<b>Chat:</b> clients keep a <b>WebSocket</b> open to a chat server. Messages go through a broker so any server can reach any user.","Store messages in a write-friendly database (Cassandra or similar). Use per-chat message ids for ordering.","<b>Presence</b> (online or offline) uses heartbeats and short TTLs in Redis.","Offline users get push notifications, and messages are delivered when they return.","Group chats: fan-out on write for small groups."],q:"Why do big social networks use a hybrid for the news feed?",a:"Push is fast for normal users, but too heavy for celebrities with millions of followers, so those posts are pulled when needed."},
370:{l:"SD11",t:"Case Study: Growing the Student Platform",s:"Take the Student API you built in this course and grow it from one server to a system for a million users, step by step.",f:["1 Monolith + SQLite","2 Move to PostgreSQL","3 Add a cache","4 Load balancer + many servers","5 Read replicas","6 Queue for e-mails","7 Split into services"],x:tb([["Step","Problem","Solution"],["1","Works for 100 users","One FastAPI server and a SQLite file"],["2","SQLite can't be shared between servers","PostgreSQL on its own machine"],["3","Stats are requested constantly","Redis cache-aside with a short TTL"],["4","One server is a single point of failure","Several stateless API servers behind nginx"],["5","The database is busy with reads","Read replicas for GET requests"],["6","Sending e-mails slows requests down","Publish an event to a queue, a worker sends mail"],["7","Teams block each other","Split into auth and student services (see the microservices capstone)"]]),k:["Notice that JWT makes the API <b>stateless</b>, which is what makes step 4 possible.","Always write a short <b>design doc</b>: goals, non-goals, design, alternatives, risks.","Measure first. Add each part only when you have the problem."],q:"Why can't several API servers share a SQLite file well?",a:"SQLite is a single-file database made for one machine. Many servers writing to it cause locks and network file problems, so you move to a database server such as PostgreSQL."},
371:{l:"MS1",t:"Monolith, Modular Monolith or Microservices?",s:"A monolith is one deployable application. Microservices split the system into small independent services, each owning its own data and deployed separately.",e:"A monolith is one big restaurant kitchen. Microservices are a food court: each stall (pasta, pizza, juice) cooks on its own, but more stalls means more rent, more coordination and more things that can go wrong.",x:tb([["","Monolith","Modular monolith","Microservices"],["Deploy","One unit","One unit, clear modules","Many small units"],["Complexity","Low at first, grows","Medium","High (network, data, operations)"],["Scaling","Scale everything together","Scale everything together","Scale each service separately"],["Team fit","Small team","Medium team","Many teams"],["Failure","One bug can stop all","One bug can stop all","Isolated, if designed well"]]),k:["<b>Start with a modular monolith.</b> Move to microservices only when team size or scaling really requires it.","<b>Bounded context</b> (from Domain-Driven Design): a part of the business with its own words and rules (Students, Billing, Notifications). A service should follow a bounded context.","<b>Conway's law:</b> systems copy the communication structure of the organisation. Give each team an owned service.","<b>Distributed monolith</b> = the worst of both: many services that must be deployed together. Avoid it.","Microservices need: automation (CI/CD), monitoring, containers, and good API design."],q:"What is the recommended starting point for most new projects?",a:"A well-structured modular monolith."},
372:{l:"MS2",t:"Service Communication: REST, gRPC, Events, API Gateway",s:"Services must talk. You choose between direct calls (synchronous) and messages (asynchronous), and put a gateway in front for the outside world.",f:["Client","API Gateway","Auth service","Student service","Message broker","Notification service"],x:tb([["","Synchronous (REST or gRPC)","Asynchronous (events)"],["Style","Ask and wait for the answer","Announce what happened"],["Coupling","Caller needs the callee up now","Services don't need each other online"],["Use for","Queries, when you need the answer","Notifications, replication, workflows"],["Risk","Chains of calls become slow and fragile","Eventual consistency, harder to debug"]]),k:["<b>API Gateway:</b> one entry point. It routes, checks authentication, rate-limits, and hides internal services. (nginx, Kong, Traefik, Spring Cloud Gateway)","<b>BFF</b> (Backend for Frontend): a gateway tailored to one kind of client, like mobile.","<b>Service discovery:</b> services find each other by name (Docker and Kubernetes DNS, Consul).","Prefer <b>events</b> when the caller does not need an answer. Always set <b>timeouts</b> on sync calls.","Avoid long chains: A calls B calls C calls D."],q:"Which communication style is better for 'send a welcome e-mail after a student is created'?",a:"Asynchronous events, because the caller doesn't need to wait for the e-mail."},
373:{l:"MS3",t:"Data in Microservices: Database per Service, Sagas, Outbox, CQRS",s:"Each service owns its data, and no other service touches its database. So you can no longer use one big transaction across services.",e:"A school trip booking involves the bus company, the hotel and the museum. If the hotel says no after the bus is paid, you must cancel the bus yourself. That cleanup step is the heart of a saga.",x:tb([["Concept","Meaning"],["Database per service","Only the owner reads and writes its tables. Others use its API or its events"],["Eventual consistency","Data across services is correct after a short delay"],["Saga","A chain of local transactions. If one fails, run compensating actions to undo earlier ones"],["Choreography vs orchestration","Services react to each other's events, or a central orchestrator tells each step what to do"],["Outbox","Save the event in the same DB transaction as the data, then publish it, so you never lose events"],["CQRS","Separate models for writing and for reading (fast read views)"],["Event sourcing","Store every change as an event, and rebuild the state from them"]]),k:["No two-phase commit across services. It is slow and fragile.","Share data with <b>events or APIs</b>, never a shared database.","Make every step and compensation <b>idempotent</b>."],q:"What does a saga do when step 3 of 4 fails?",a:"It runs compensating actions to undo steps 1 and 2."},
374:{l:"MS4",t:"Resilience Patterns in Microservices",s:"With many network calls, something is always slow or down. Resilience patterns stop one failure from spreading.",f:["Closed (normal)","Too many failures","Open (fail fast)","After a wait","Half-open (test)","Success: closed"],k:["<b>Circuit breaker:</b> closed (calls pass), open (fail fast, no calls), half-open (a trial call). It gives the broken service time to recover.","<b>Timeout + retry with backoff and jitter</b> for temporary glitches.","<b>Bulkhead:</b> limit concurrent calls per dependency, so one slow service can't use all your threads.","<b>Fallback:</b> a default, cached or partial answer.","<b>Health checks and graceful degradation</b>: keep working with fewer features.","Libraries: Resilience4j (Java), Polly (.NET), tenacity and pybreaker (Python), cockatiel (Node). Service meshes (Istio, Linkerd) can do much of it for you."],e:"A fuse box in a house: one faulty appliance trips its own fuse instead of the whole building.",q:"What does an open circuit breaker do?",a:"It fails calls immediately, without trying the broken service, until a wait time passes."},
375:{l:"MS5",t:"Deploying Microservices: Docker, Compose and Kubernetes",s:"Each service is packed into a container image. Compose runs a few containers on one machine. Kubernetes runs and heals many containers across many machines.",x:tb([["Kubernetes object","Job"],["Pod","One or more containers that run together"],["Deployment","Keeps N copies of a pod running and does rolling updates"],["Service","A stable name and address in front of pods (load balances)"],["Ingress","Routes outside traffic to services (like a gateway)"],["ConfigMap and Secret","Settings and sensitive values, kept outside the image"],["HorizontalPodAutoscaler","Adds or removes pods based on load"]]),k:["<b>Twelve-factor app</b> rules: config in the environment, stateless processes, logs to stdout, one codebase, disposable processes.","One image for all environments. Change only the config.","<b>CI/CD:</b> every push runs tests, builds the image and deploys.","Use <b>readiness and liveness probes</b> so traffic only goes to healthy pods.","Start with Compose. Move to Kubernetes when you need autoscaling and self-healing."],q:"Which Kubernetes object keeps a set number of pod copies running?",a:"A Deployment."},
376:{l:"MS6",t:"Observability and Security in Microservices",s:"With many services, finding a problem is like finding a leak in a building with many pipes. You need central logs, metrics and traces, and secure service-to-service calls.",k:["<b>Correlation id:</b> the gateway creates it, and every service copies it into its logs and into outgoing calls.","<b>Distributed tracing</b> (OpenTelemetry, Jaeger, Zipkin) shows how long each service took in one request.","<b>Centralised logs</b> (Loki, ELK) and <b>metrics</b> (Prometheus plus Grafana). Watch the RED metrics: Rate, Errors, Duration.","<b>Edge security:</b> the gateway checks the JWT. <b>Inside:</b> pass the JWT on, or use <b>mTLS</b> (services prove their identity with certificates).","<b>Zero trust:</b> every call is checked, even inside the network. Keep secrets in Kubernetes Secrets or a vault.","Rate limit at the gateway and validate input in every service."],q:"What does distributed tracing show?",a:"The path and time spent in each service for a single request."},
377:{l:"MS7",t:"Testing, Contracts and Migrating Step by Step",s:"Microservices are tested at several levels. Contract tests make sure two services still understand each other. The Strangler Fig pattern moves a monolith to services slowly and safely.",e:"A strangler fig tree grows around an old tree until it can stand alone. You grow new services around the old monolith, route one feature at a time, and finally remove the old code.",k:["<b>Test pyramid:</b> many fast unit tests, fewer integration tests, very few end-to-end tests.","<b>Contract testing</b> (Pact, schema checks): the consumer states what it needs, and the provider's build must satisfy it.","<b>Strangler Fig:</b> put a gateway in front, route one URL at a time from the monolith to the new service.","<b>Versioning:</b> add fields, don't remove them. Keep old versions until clients move.","<b>Anti-patterns:</b> distributed monolith, shared database, too many tiny services, chatty calls, no ownership."],x:tb([["Anti-pattern","Why it hurts"],["Shared database","Services are secretly coupled, and no one can change a table"],["Distributed monolith","Must deploy together, with network cost and no benefit"],["Nano-services","More network calls than useful work"],["No monitoring","You can't find which service failed"]]),q:"What does the Strangler Fig pattern do?",a:"It replaces a monolith slowly, by routing one feature at a time to new services behind a gateway."},
378:{l:"MC1",t:"Capstone: Student Platform as Microservices (Plan)",s:"Split the Student API into three services plus a gateway, all started with one command. It keeps the <b>same endpoints and JSON shapes</b> as before, so your React, Vue, Angular and TypeScript frontends work through the gateway without any change.",e:"The single school office is now three departments (accounts, students, mail), with one reception desk (the gateway) at the front door.",f:["Browser","Gateway (nginx :8000)","auth-service","student-service","Redis stream","notification-service"],x:tb([["Service","Port","Job","Data"],["gateway (nginx)","8000","Routes requests, CORS","none"],["auth-service","8001","/register, /login, /me. Creates JWTs","its own SQLite"],["student-service","8002","/students, /stats. Checks JWTs, publishes events","its own SQLite"],["notification-service","none","Reads events and sends (fake) welcome e-mails","none"],["redis","6379","The event stream","a stream"]]),k:["The services share only the <b>JWT secret</b>. They never share a database.","The student service calls nobody. It only <b>publishes an event</b> to Redis. If Redis is down, creating a student still works (graceful degradation).","The token carries the user id (<code>uid</code>) and name (<code>sub</code>), so the student service needs no call to the auth service.","Patterns used: API gateway, database per service, event-driven messaging, stateless JWT, health checks.","You need Docker with Docker Compose."],q:"Which two things do the services share?",a:"The JWT secret and the event stream in Redis. No database is shared."},
379:{l:"MC2",t:"Capstone Step 1: The Auth Service",s:"A small FastAPI service with its own database. It registers users, checks passwords and issues JWTs.",k:["Its SQLite file lives in its own Docker volume (<code>/data</code>).","The token contains <code>sub</code> (username), <code>uid</code> (user id) and an expiry.","<code>JWT_SECRET</code> comes from the environment. The service refuses to start without it.","<code>/health</code> is used by Docker health checks."],q:"Why does the token contain the user id (uid)?",a:"So other services can know the user without calling the auth service."},
380:{l:"MC3",t:"Capstone Step 2: The Student Service",s:"CRUD for students, protected by the JWT. It trusts the token (verified with the shared secret) and publishes an event when a student is created or deleted.",k:["No call to the auth service is needed: it verifies the signature itself.","Students belong to the <code>uid</code> in the token, so users only see their own students.","<code>publish()</code> uses short timeouts and catches errors, so a broker outage never breaks a request.","Better in production: the <b>outbox pattern</b> so events are never lost."],q:"What happens to a create-student request if Redis is down?",a:"The student is still created. The event is skipped and a warning is logged."},
381:{l:"MC4",t:"Capstone Step 3: The Notification Worker",s:"A background worker that reads events from a Redis stream using a consumer group, 'sends' an e-mail, and acknowledges the message.",k:["A <b>consumer group</b> lets several workers share the work, and each message goes to one of them.","<code>XACK</code> is sent only after handling, so a crash means the message is delivered again (at-least-once).","The handler is written to be idempotent-friendly. In real life, keep processed ids.","If the worker is down, events wait in the stream and are processed when it returns."],q:"Why acknowledge the message only after handling it?",a:"If the worker crashes before finishing, the message is not lost and will be delivered again."},
382:{l:"MC5",t:"Capstone Step 4: Gateway and Docker Compose",s:"nginx is the single front door on port 8000. Docker Compose builds and starts everything with one command.",k:["nginx routes <code>/register</code>, <code>/login</code> and <code>/me</code> to the auth service, and <code>/students</code> and <code>/stats</code> to the student service.","The gateway also adds <b>CORS</b> headers, so the services don't have to.","Services find each other by name (<code>auth</code>, <code>students</code>, <code>redis</code>) using Docker's built-in DNS.","<code>JWT_SECRET</code> is put in a <code>.env</code> file next to the compose file."],q:"How does the gateway know where to send /students?",a:"A location rule in nginx.conf forwards it to the student service."},
383:{l:"MC6",t:"Capstone Step 5: Run, Break It on Purpose and Level Up",s:"Start the platform, use it with curl or your frontend, then switch parts off to see resilience in action.",k:["<code>docker compose up --build</code>, then open <code>http://localhost:8000</code> for the frontend or use curl.","<b>Experiment 1:</b> stop Redis. Creating students still works. <b>Experiment 2:</b> stop the notification worker, create students, start it again, and watch the waiting events get processed.","<b>Experiment 3:</b> stop the auth service. Logged-in users can still use /students until their token expires (stateless JWT).","<b>Level up:</b> PostgreSQL per service, the outbox pattern, OpenTelemetry tracing, rate limiting at the gateway, Kubernetes manifests, a CI pipeline and contract tests."],q:"Why can users keep using /students when the auth service is down?",a:"The student service verifies the JWT itself with the shared secret and doesn't need to call the auth service."}

Q = np.zeros((n_states, 2))                # Q-table: actions 0 = left, 1 = right
alpha, gamma, eps = 0.1, 0.9, 0.2          # learning rate, discount, explore chance
for episode in range(500):
    s = 0
    while s != 4:
        if random.random() < eps:
            a = random.choice([0, 1])      # explore

        s2 = max(0, s - 1) if a == 0 else s + 1
        r = 10 if s2 == 4 else -1          # reward

from sqlalchemy.orm import Session
from sqlalchemy.exc import IntegrityError
from models import Student
from schemas import StudentCreate, StudentUpdate

def create_student(db: Session, data: StudentCreate):
    student = Student(**data.model_dump())
    db.add(student)
    try:
        db.commit()
    except IntegrityError:                 # the email already exists
        db.rollback()
        raise ValueError("A student with this email already exists")
    db.refresh(student)
    return student

def get_student(db: Session, student_id: int):
    return db.get(Student, student_id)

def list_students(db: Session, search: str = ""):
    stmt = select(Student).order_by(Student.id)
    if search:
        stmt = stmt.where(Student.name.ilike(f"%{search}%"))   # ilike ignores capital letters
    return db.scalars(stmt).all()

def update_student(db: Session, student_id: int, data: StudentUpdate):
    student = db.get(Student, student_id)
    if student is None:
        return None
    for field, value in data.model_dump(exclude_unset=True).items():
        setattr(student, field, value)     # change only what the user sent
    try:
        db.commit()
    except IntegrityError:
        db.rollback()
        raise ValueError("A student with this email already exists")
    db.refresh(student)
    return student

def delete_student(db: Session, student_id: int):
    student = db.get(Student, student_id)
    if student is None:
        return False
    db.delete(student)
    db.commit()
    return True

def class_stats(db: Session):
    return db.execute(select(func.count(Student.id),
                             func.avg(Student.marks),
                             func.max(Student.marks))).one()`,

    token = jwt.encode({"sub": form.username, "exp": exp}, SECRET, algorithm=ALGO)

password_hash = PasswordHash.recommended()

def hash_password(password: str) -> str:
    return password_hash.hash(password)

def verify_password(password: str, hashed: str) -> bool:
    return password_hash.verify(password, hashed)

def create_access_token(username: str) -> str:
    expire = datetime.now(timezone.utc) + timedelta(minutes=TOKEN_MINUTES)
    return jwt.encode({"sub": username, "exp": expire}, SECRET_KEY, algorithm=ALGORITHM)

                          detail="Invalid or expired token",
                          headers={"WWW-Authenticate": "Bearer"})
    try:
        payload = jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM])
    except jwt.InvalidTokenError:           # bad signature or expired
        raise error

    if username is None:
        raise error
    user = db.scalar(select(User).where(User.username == username))

        stmt = stmt.where(Student.name.ilike(f"%{search}%"))
    return db.scalars(stmt.order_by(Student.id).offset(skip).limit(limit)).all()

@app.get("/stats")
def stats(db: Session = Depends(get_db), user: User = Depends(get_current_user)):
    count, avg, top = db.execute(
        select(func.count(Student.id), func.avg(Student.marks), func.max(Student.marks))
        .where(Student.owner_id == user.id)).one()
    return {"students": count, "average_marks": round(avg or 0, 1), "highest_marks": top or 0}

@app.get("/students/{student_id}", response_model=schemas.StudentRead)
def read_student(student_id: int, db: Session = Depends(get_db),
                 user: User = Depends(get_current_user)):
    return get_own_student(db, user, student_id)

@app.patch("/students/{student_id}", response_model=schemas.StudentRead)
def update_student(student_id: int, data: schemas.StudentUpdate,
                   db: Session = Depends(get_db), user: User = Depends(get_current_user)):
    student = get_own_student(db, user, student_id)
    for field, value in data.model_dump(exclude_unset=True).items():
        setattr(student, field, value)      # change only what was sent
    try:
        db.commit()
    except IntegrityError:
        db.rollback()
        raise HTTPException(status_code=409, detail="Email already exists")
    db.refresh(student)
    return student

@app.delete("/students/{student_id}", status_code=204)
def delete_student(student_id: int, db: Session = Depends(get_db),
                   user: User = Depends(get_current_user)):
    db.delete(get_own_student(db, user, student_id))
    db.commit()`,

158:`import { useState, useEffect, useRef, useMemo } from "react";

// Custom hook: remembers a value in localStorage
function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    const saved = localStorage.getItem(key);
    return saved ? JSON.parse(saved) : initial;
  });
  useEffect(() => {
    localStorage.setItem(key, JSON.stringify(value));
  }, [key, value]);
  return [value, setValue];
}

export default function App() {
  const [marks, setMarks] = useLocalStorage("marks", [80, 65, 90]);
  const inputRef = useRef(null);                 // points to the input element

  const average = useMemo(
    () => marks.reduce((sum, m) => sum + m, 0) / marks.length,
    [marks]                                      // recalculated only when marks change
  );

  function addMark() {
    const value = Number(inputRef.current.value);
    if (value) setMarks([...marks, value]);
    inputRef.current.value = "";
    inputRef.current.focus();
  }

  return (
    <div>
      <p>Marks: {marks.join(", ")}</p>
      <p>Average: {average.toFixed(1)}</p>
      <input ref={inputRef} type="number" placeholder="New mark" />
      <button onClick={addMark}>Add</button>
    </div>
  );
}`,

162:`// ---------- src/api.js ----------
const API = import.meta.env.VITE_API_URL ?? "http://127.0.0.1:8000";

function errorMessage(data) {
  // FastAPI sends detail as text (400, 401, 404, 409) or as a list (422)
  if (Array.isArray(data.detail)) {
    return data.detail.map((d) => d.loc[d.loc.length - 1] + ": " + d.msg).join(", ");
  }
  return data.detail || "Something went wrong";
}

export async function request(path, { method = "GET", body, token, form } = {}) {
  const headers = {};
  if (token) headers.Authorization = "Bearer " + token;

  let payload;
  if (form) {
    payload = new URLSearchParams(form);          // login needs form data, not JSON
  } else if (body) {
    headers["Content-Type"] = "application/json";
    payload = JSON.stringify(body);
  }

  const res = await fetch(API + path, { method, headers, body: payload });
  if (res.status === 204) return null;            // delete returns no content
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(errorMessage(data));
    err.status = res.status;
    throw err;
  }
  return data;
}


// ---------- src/AuthContext.jsx ----------
import { createContext, useContext, useState } from "react";
import { request } from "./api";

const AuthContext = createContext(null);

export function AuthProvider({ children }) {
  const [token, setToken] = useState(localStorage.getItem("token"));

  async function login(username, password) {
    const data = await request("/login", { method: "POST", form: { username, password } });
    localStorage.setItem("token", data.access_token);
    setToken(data.access_token);
  }

  function logout() {
    localStorage.removeItem("token");
    setToken(null);
  }

  return (
    <AuthContext.Provider value={{ token, login, logout }}>
      {children}
    </AuthContext.Provider>
  );
}

export function useAuth() {
  return useContext(AuthContext);
}`,

import { useState, useEffect } from "react";
import { useAuth } from "../AuthContext";
import { request } from "../api";

const empty = { name: "", age: "", email: "", marks: "" };

export default function StudentForm({ editing, onSaved, onCancel }) {
  const { token } = useAuth();
  const [form, setForm] = useState(empty);
  const [error, setError] = useState("");

  useEffect(() => {                                  // fill the form when Edit is clicked
    setForm(editing ? { ...editing } : empty);
    setError("");
  }, [editing]);

  function change(e) {
    setForm({ ...form, [e.target.name]: e.target.value });   // one handler for every input
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const body = {
      name: form.name,
      age: Number(form.age),
      email: form.email,
      marks: Number(form.marks || 0),
    };
    try {
      if (editing) {
        await request("/students/" + editing.id, { method: "PATCH", body, token });
      } else {
        await request("/students", { method: "POST", body, token });
      }
      setForm(empty);
      setError("");
      onSaved();
    } catch (err) {
      setError(err.message);                         // e.g. "age: Input should be <= 100"

181:`// ---------- src/api.js ----------
const API = import.meta.env.VITE_API_URL ?? "http://127.0.0.1:8000";

function errorMessage(data) {
  // FastAPI sends detail as text (400, 401, 404, 409) or as a list (422)
  if (Array.isArray(data.detail)) {
    return data.detail.map((d) => d.loc[d.loc.length - 1] + ": " + d.msg).join(", ");
  }
  return data.detail || "Something went wrong";
}

export async function request(path, { method = "GET", body, token, form } = {}) {
  const headers = {};
  if (token) headers.Authorization = "Bearer " + token;

  let payload;
  if (form) {
    payload = new URLSearchParams(form);          // login needs form data, not JSON
  } else if (body) {
    headers["Content-Type"] = "application/json";
    payload = JSON.stringify(body);
  }

  const res = await fetch(API + path, { method, headers, body: payload });
  if (res.status === 204) return null;            // delete returns no content
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(errorMessage(data));
    err.status = res.status;
    throw err;
  }
  return data;
}


// ---------- src/stores/auth.js ----------
import { defineStore } from "pinia";
import { ref } from "vue";
import { request } from "../api";

export const useAuthStore = defineStore("auth", () => {
  const token = ref(localStorage.getItem("token"));

  async function login(username, password) {
    const data = await request("/login", { method: "POST", form: { username, password } });
    localStorage.setItem("token", data.access_token);
    token.value = data.access_token;
  }

  function logout() {
    localStorage.removeItem("token");
    token.value = null;
  }

  return { token, login, logout };
});`,

  router.push("/login");

async function load() {

    );
    stats.value = await request("/stats", { token: auth.token });

import { isDevMode } from '@angular/core';
import { HttpErrorResponse } from '@angular/common/http';

// While developing (ng serve) call FastAPI on port 8000.
// In the production build, use the same address as the page.
export const API = isDevMode() ? 'http://127.0.0.1:8000' : '';

export function errorMessage(err: unknown): string {
  if (err instanceof HttpErrorResponse) {
    if (err.status === 0) return 'Cannot reach the server. Is FastAPI running?';
    const detail = err.error?.detail;
    if (Array.isArray(detail)) {          // 422: a list of problems
      return detail.map((d: any) => d.loc[d.loc.length - 1] + ': ' + d.msg).join(', ');
    }
    if (typeof detail === 'string') return detail;
  }
  return 'Something went wrong';
}

import { Injectable, inject, signal } from '@angular/core';
import { HttpClient, HttpParams } from '@angular/common/http';
import { Router } from '@angular/router';
import { firstValueFrom } from 'rxjs';
import { API } from './api';
import { Token } from './models';

@Injectable({ providedIn: 'root' })
export class AuthService {
  private http = inject(HttpClient);
  private router = inject(Router);

  readonly token = signal<string | null>(localStorage.getItem('token'));

  async register(username: string, password: string) {
    await firstValueFrom(this.http.post(API + '/register', { username, password }));
  }

  async login(username: string, password: string) {
    const body = new HttpParams().set('username', username).set('password', password);  // form data
    const data = await firstValueFrom(this.http.post<Token>(API + '/login', body));
    localStorage.setItem('token', data.access_token);
    this.token.set(data.access_token);
  }

  logout() {
    localStorage.removeItem('token');
    this.token.set(null);
    this.router.navigate(['/login']);
  }
}`,
203:`// ---------- src/app/auth.interceptor.ts ----------
import { HttpInterceptorFn } from '@angular/common/http';
import { inject } from '@angular/core';
import { catchError, throwError } from 'rxjs';
import { AuthService } from './auth.service';

export const authInterceptor: HttpInterceptorFn = (req, next) => {
  const auth = inject(AuthService);
  const token = auth.token();
  if (token) {
    req = req.clone({ setHeaders: { Authorization: 'Bearer ' + token } });
  }
  return next(req).pipe(
    catchError((err) => {
      if (err.status === 401 && token) auth.logout();     // the token expired
      return throwError(() => err);
    })
  );
};

import { Injectable, inject } from '@angular/core';

import { firstValueFrom } from 'rxjs';
import { API } from './api';
import { Student, StudentInput, Stats } from './models';

@Injectable({ providedIn: 'root' })
export class StudentService {
  private http = inject(HttpClient);       // the interceptor adds the token for us

  list(search: string) {

  }
  stats() {
    return firstValueFrom(this.http.get<Stats>(API + '/stats'));
  }

    return firstValueFrom(this.http.post<Student>(API + '/students', data));
  }
  update(id: number, data: StudentInput) {
    return firstValueFrom(this.http.patch<Student>(API + '/students/' + id, data));
  }
  remove(id: number) {
    return firstValueFrom(this.http.delete<void>(API + '/students/' + id));
  }
}


// ---------- src/app/pages/dashboard.ts ----------
import { Component, inject, signal, OnInit } from '@angular/core';
import { FormsModule } from '@angular/forms';
import { AuthService } from '../auth.service';
import { StudentService } from '../student.service';
import { StudentForm } from '../student-form';
import { Student, Stats } from '../models';
import { errorMessage } from '../api';

@Component({
  selector: 'app-dashboard',
  imports: [FormsModule, StudentForm],
  templateUrl: './dashboard.html',
})
export class DashboardPage implements OnInit {
  private auth = inject(AuthService);
  private service = inject(StudentService);

  students = signal<Student[]>([]);
  stats = signal<Stats | null>(null);
  search = signal('');
  editing = signal<Student | null>(null);       // the student being edited, or null
  error = signal('');

  ngOnInit() {
    this.load();
  }

  async load() {
    try {
      this.students.set(await this.service.list(this.search()));
      this.stats.set(await this.service.stats());
      this.error.set('');
    } catch (err) {
      this.error.set(errorMessage(err));        // a 401 is handled by the interceptor

import { Component, inject, input, output, signal, effect } from '@angular/core';
import { FormsModule } from '@angular/forms';
import { StudentService } from './student.service';
import { Student, StudentInput } from './models';
import { errorMessage } from './api';

@Component({
  selector: 'app-student-form',
  imports: [FormsModule],
  templateUrl: './student-form.html',
})
export class StudentForm {
  private service = inject(StudentService);

  editing = input<Student | null>(null);       // sent by the dashboard
  saved = output<void>();                      // tell the dashboard we finished
  cancelled = output<void>();

  name = signal('');
  age = signal<number | null>(null);
  email = signal('');
  marks = signal<number | null>(null);
  error = signal('');

  constructor() {
    effect(() => {                             // fill the form when Edit is clicked
      const s = this.editing();
      this.name.set(s?.name ?? '');
      this.age.set(s?.age ?? null);
      this.email.set(s?.email ?? '');
      this.marks.set(s?.marks ?? null);
      this.error.set('');
    });
  }

  async submit() {
    const body: StudentInput = {
      name: this.name(),
      age: Number(this.age()),
      email: this.email(),
      marks: Number(this.marks() ?? 0),
    };
    try {
      const current = this.editing();
      if (current) await this.service.update(current.id, body);
      else await this.service.create(body);
      this.name.set('');
      this.age.set(null);
      this.email.set('');
      this.marks.set(null);
      this.error.set('');
      this.saved.emit();
    } catch (err) {
      this.error.set(errorMessage(err));       // e.g. "age: Input should be <= 100"
    }
  }
}

        }

        int n = 3;

            n--;
        }

        int tries = 0;
        do {                                        // runs at least once
            tries++;
        } while (tries < 3);

        int[] marks = {80, 65, 90};
        for (int m : marks) {                       // enhanced for (for-each)
            System.out.println(m);
        }

        for (int i = 0; i < 10; i++) {
            if (i == 2) continue;                   // skip this round
            if (i == 5) break;                      // stop the loop
            System.out.print(i + " ");              // 0 1 3 4
        }
        System.out.println();

        outer:                                      // a label lets break leave both loops
        for (int i = 1; i <= 3; i++) {
            for (int j = 1; j <= 3; j++) {
                if (i * j == 4) break outer;
                System.out.println(i + "x" + j);
            }
        }
    }
}`,

    }

228:`import java.util.concurrent.*;
import java.util.concurrent.atomic.AtomicInteger;

public class Concurrency {
    public static void main(String[] args) throws Exception {
        Thread t = new Thread(() -> System.out.println("Hello from " + Thread.currentThread().getName()));
        t.start();
        t.join();                                              // wait for it to finish

        AtomicInteger counter = new AtomicInteger();           // thread-safe counter
        ExecutorService pool = Executors.newFixedThreadPool(4);
        for (int i = 0; i < 1000; i++) {
            pool.submit(counter::incrementAndGet);
        }
        pool.shutdown();
        pool.awaitTermination(5, TimeUnit.SECONDS);
        System.out.println(counter.get());                     // 1000

        // Java 8: CompletableFuture chains async steps
        CompletableFuture<String> future = CompletableFuture
            .supplyAsync(() -> "marks=92")
            .thenApply(s -> s.toUpperCase());
        System.out.println(future.get());

        // Java 21: virtual threads, cheap threads for waiting tasks
        try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
            for (int i = 0; i < 10_000; i++) {
                executor.submit(() -> {
                    Thread.sleep(100);                         // pretend to wait for a network call
                    return null;
                });
            }
        }                                                      // close() waits for all tasks
        System.out.println("10,000 virtual threads done");
        Thread.ofVirtual().start(() -> System.out.println("one more virtual thread")).join();
    }
}`,

    // Java 16: record. Constructor, getters, equals, hashCode and toString are generated

    sealed interface Shape permits Circle, Square {}
    record Circle(double r) implements Shape {}
    record Square(double side) implements Shape {}

    static double area(Shape s) {                       // switch needs no default: the compiler knows all cases
        return switch (s) {
            case Circle c -> Math.PI * c.r() * c.r();
            case Square q -> q.side() * q.side();
        };
    }

    static String describe(Object o) {

            case String s -> "text of length " + s.length();

import java.io.IOException;
import java.io.UncheckedIOException;
import java.nio.file.Files;
import java.nio.file.Path;
import java.util.ArrayList;
import java.util.List;
import java.util.Optional;

public class StudentRepository {
    private final Path file;
    private final List<Student> students = new ArrayList<>();
    private int nextId = 1;

    public StudentRepository(Path file) {
        this.file = file;
        load();
    }

    private void load() {
        if (!Files.exists(file)) return;
        try {
            for (String line : Files.readAllLines(file)) {
                if (line.isBlank()) continue;
                String[] p = line.split(",");
                Student s = new Student(Integer.parseInt(p[0]), p[1], Integer.parseInt(p[2]),
                                        p[3], Double.parseDouble(p[4]));
                students.add(s);
                nextId = Math.max(nextId, s.id() + 1);
            }
        } catch (IOException e) {
            throw new UncheckedIOException("Could not read " + file, e);
        }
    }

    private void save() {
        List<String> lines = students.stream()
            .map(s -> s.id() + "," + s.name() + "," + s.age() + "," + s.email() + "," + s.marks())
            .toList();
        try {
            Files.write(file, lines);
        } catch (IOException e) {
            throw new UncheckedIOException("Could not save " + file, e);
        }
    }

    public Student add(String name, int age, String email, double marks) {
        Student s = new Student(nextId++, name, age, email, marks);
        students.add(s);
        save();
        return s;
    }

    public List<Student> findAll() {
        return List.copyOf(students);                         // a safe read-only copy
    }

    public Optional<Student> findById(int id) {
        return students.stream().filter(s -> s.id() == id).findFirst();
    }

    public void replace(Student updated) {
        for (int i = 0; i < students.size(); i++) {
            if (students.get(i).id() == updated.id()) {
                students.set(i, updated);
                break;
            }
        }
        save();
    }

    public boolean delete(int id) {
        boolean removed = students.removeIf(s -> s.id() == id);
        if (removed) save();
        return removed;
    }
}`,

import java.util.DoubleSummaryStatistics;
import java.util.List;
import java.util.Map;
import java.util.NoSuchElementException;
import java.util.TreeMap;
import java.util.stream.Collectors;

public class StudentService {
    public record Stats(long count, double average, double highest) {}

    private final StudentRepository repo;

    public StudentService(StudentRepository repo) {
        this.repo = repo;
    }

    public Student add(String name, int age, String email, double marks) {
        String wanted = email.strip().toLowerCase();
        if (repo.findAll().stream().anyMatch(s -> s.email().equals(wanted))) {
            throw new IllegalStateException("A student with this email already exists");
        }
        return repo.add(name, age, email, marks);
    }

    public List<Student> findAll() {
        return repo.findAll();
    }

    public List<Student> search(String text) {
        String t = text.strip().toLowerCase();
        return repo.findAll().stream()
            .filter(s -> s.name().toLowerCase().contains(t))
            .toList();
    }

    public Student update(int id, String name, Integer age, String email, Double marks) {
        Student old = repo.findById(id)
            .orElseThrow(() -> new NoSuchElementException("Student not found"));
        Student updated = new Student(id,
            name != null ? name : old.name(),
            age != null ? age : old.age(),
            email != null ? email : old.email(),
            marks != null ? marks : old.marks());
        repo.replace(updated);
        return updated;
    }

    public boolean delete(int id) {
        return repo.delete(id);
    }

    public Stats stats() {
        DoubleSummaryStatistics st = repo.findAll().stream()
            .mapToDouble(Student::marks).summaryStatistics();
        if (st.getCount() == 0) return new Stats(0, 0, 0);
        return new Stats(st.getCount(), st.getAverage(), st.getMax());
    }

    public Map<String, Long> gradeCounts() {
        return repo.findAll().stream().collect(
            Collectors.groupingBy(Student::grade, TreeMap::new, Collectors.counting()));
    }
}

import java.nio.file.Path;
import java.util.List;
import java.util.NoSuchElementException;
import java.util.Scanner;

public class Main {
    private static final Scanner in = new Scanner(System.in);
    private static final StudentService service =
        new StudentService(new StudentRepository(Path.of("students.csv")));

    private static final String MENU = """

            ===== Student Manager =====
            1. Add student
            2. View all students
            3. Search by name
            4. Update student
            5. Delete student
            6. Class statistics
            0. Exit
            """;

    public static void main(String[] args) {
        while (true) {
            System.out.print(MENU + "Choose: ");
            String choice = in.nextLine().strip();
            if (choice.equals("0")) {
                System.out.println("Bye!");
                return;
            }
            try {
                switch (choice) {
                    case "1" -> add();
                    case "2" -> show(service.findAll());
                    case "3" -> show(service.search(ask("Search name: ")));
                    case "4" -> update();
                    case "5" -> delete();
                    case "6" -> stats();
                    default -> System.out.println("  x Invalid choice");
                }
            } catch (IllegalArgumentException | IllegalStateException | NoSuchElementException e) {
                System.out.println("  x " + e.getMessage());
            }
        }
    }

    private static String ask(String prompt) {
        System.out.print(prompt);
        return in.nextLine();
    }

    private static int askInt(String prompt) {
        try {
            return Integer.parseInt(ask(prompt).strip());
        } catch (NumberFormatException e) {
            throw new IllegalArgumentException("Please enter a whole number");
        }
    }

    private static double askDouble(String prompt) {
        try {
            String text = ask(prompt).strip();
            return text.isEmpty() ? 0 : Double.parseDouble(text);
        } catch (NumberFormatException e) {
            throw new IllegalArgumentException("Please enter a number");
        }
    }

    private static void add() {
        Student s = service.add(ask("Name: "), askInt("Age: "), ask("Email: "),
                                askDouble("Marks 0-100 (Enter for 0): "));
        System.out.println("Added with ID " + s.id());
    }

    private static void show(List<Student> students) {
        if (students.isEmpty()) {
            System.out.println("No students found.");
            return;
        }

import java.util.List;
import java.util.Map;
import java.util.Optional;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.atomic.AtomicLong;
import org.springframework.http.HttpStatus;
import org.springframework.http.ResponseEntity;
import org.springframework.web.bind.annotation.*;

record Pupil(long id, String name, int age) {}
record PupilRequest(String name, int age) {}

@RestController
@RequestMapping("/demo/pupils")
class PupilController {
    private final Map<Long, Pupil> db = new ConcurrentHashMap<>();   // a fake in-memory database
    private final AtomicLong ids = new AtomicLong();

    @PostMapping
    @ResponseStatus(HttpStatus.CREATED)                              // 201
    Pupil create(@RequestBody PupilRequest req) {
        Pupil p = new Pupil(ids.incrementAndGet(), req.name(), req.age());
        db.put(p.id(), p);
        return p;
    }

    @GetMapping                                                      // GET /demo/pupils?search=ri
    List<Pupil> list(@RequestParam(defaultValue = "") String search) {
        return db.values().stream()
            .filter(p -> p.name().toLowerCase().contains(search.toLowerCase()))
            .toList();
    }

    @GetMapping("/{id}")
    ResponseEntity<Pupil> one(@PathVariable long id) {
        return Optional.ofNullable(db.get(id))
            .map(ResponseEntity::ok)                                 // 200 with the pupil
            .orElse(ResponseEntity.notFound().build());              // 404
    }

    @PutMapping("/{id}")
    ResponseEntity<Pupil> replace(@PathVariable long id, @RequestBody PupilRequest req) {
        if (!db.containsKey(id)) return ResponseEntity.notFound().build();
        Pupil updated = new Pupil(id, req.name(), req.age());
        db.put(id, updated);
        return ResponseEntity.ok(updated);
    }

    @DeleteMapping("/{id}")
    ResponseEntity<Void> delete(@PathVariable long id) {
        return db.remove(id) == null
            ? ResponseEntity.notFound().build()
            : ResponseEntity.noContent().build();                    // 204
    }
}

record StudentRequest(
    @NotBlank @Size(min = 2, max = 50) String name,
    @Min(5) @Max(100) int age,
    @NotBlank @Email String email) {}

class ApiException extends RuntimeException {                 // our own error with a status
    private final HttpStatus status;
    ApiException(HttpStatus status, String message) {
        super(message);
        this.status = status;
    }
    HttpStatus getStatus() { return status; }
}

@RestControllerAdvice                                         // one place that handles errors for ALL controllers
class ApiExceptionHandler {

    @ExceptionHandler(ApiException.class)
    ResponseEntity<Map<String, Object>> handleApi(ApiException e) {
        return ResponseEntity.status(e.getStatus()).body(Map.of("detail", e.getMessage()));
    }

    @ExceptionHandler(MethodArgumentNotValidException.class)  // thrown when validation fails
    ResponseEntity<Map<String, Object>> handleInvalid(MethodArgumentNotValidException e) {
        List<Map<String, Object>> problems = e.getBindingResult().getFieldErrors().stream()
            .map(f -> Map.<String, Object>of("loc", List.of("body", f.getField()),
                                             "msg", String.valueOf(f.getDefaultMessage())))
            .toList();
        return ResponseEntity.status(422).body(Map.of("detail", problems));
    }
}
