import org.springframework.transaction.annotation.Transactional;
import org.springframework.web.bind.annotation.*;

// DTO: exactly what the client sees (no internal fields)
record StudentDto(Long id, String name, int age, double marks) {
    static StudentDto of(Student s) {
        return new StudentDto(s.getId(), s.getName(), s.getAge(), s.getMarks());
    }
}

@Service
class StudentService {                                        // the RULES live here
    private final StudentRepository repo;
    StudentService(StudentRepository repo) { this.repo = repo; }

    @Transactional                                            // all or nothing
    Student create(String name, int age, String email, double marks) {
        if (repo.existsByEmail(email)) {
            throw new ApiException(HttpStatus.CONFLICT, "Email already exists");
        }
        return repo.save(new Student(name.strip(), age, email.strip().toLowerCase(), marks));
    }

    @Transactional(readOnly = true)                           // only reads
    List<Student> search(String text) {
        return repo.findByNameContainingIgnoreCase(text);
    }

    @Transactional
    Student changeMarks(long id, double marks) {
        Student s = repo.findById(id)
            .orElseThrow(() -> new ApiException(HttpStatus.NOT_FOUND, "Student not found"));
        s.setMarks(marks);                                    // saved automatically when the method ends
        return s;
    }
}

package com.school.studentapi;

import com.nimbusds.jose.jwk.source.ImmutableSecret;
import java.nio.charset.StandardCharsets;
import java.time.Instant;
import java.time.temporal.ChronoUnit;
import javax.crypto.SecretKey;
import javax.crypto.spec.SecretKeySpec;
import org.springframework.beans.factory.annotation.Value;
import org.springframework.context.annotation.Bean;
import org.springframework.context.annotation.Configuration;
import org.springframework.security.config.Customizer;
import org.springframework.security.config.annotation.web.builders.HttpSecurity;
import org.springframework.security.config.http.SessionCreationPolicy;
import org.springframework.security.oauth2.jose.jws.MacAlgorithm;
import org.springframework.security.oauth2.jwt.*;
import org.springframework.security.web.SecurityFilterChain;
import java.util.Map;
import org.springframework.http.HttpStatus;
import org.springframework.security.core.Authentication;
import org.springframework.web.bind.annotation.*;

@Configuration
class JwtDemoConfig {
    @Value("\${app.jwt.secret}")
    private String secret;

    private SecretKey key() {
        return new SecretKeySpec(secret.getBytes(StandardCharsets.UTF_8), "HmacSHA256");
    }

    @Bean
    JwtEncoder jwtEncoder() {                                  // creates tokens
        return new NimbusJwtEncoder(new ImmutableSecret<>(key()));
    }

    @Bean
    JwtDecoder jwtDecoder() {                                  // verifies tokens
        return NimbusJwtDecoder.withSecretKey(key()).macAlgorithm(MacAlgorithm.HS256).build();
    }

    @Bean
    SecurityFilterChain chain(HttpSecurity http) throws Exception {
        http.csrf(csrf -> csrf.disable())
            .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
            .authorizeHttpRequests(a -> a.requestMatchers("/login").permitAll().anyRequest().authenticated())
            .oauth2ResourceServer(o -> o.jwt(Customizer.withDefaults()));   // check Bearer tokens
        return http.build();
    }
}

// ---------- the login endpoint creates a token ----------
@RestController
class JwtDemoController {
    private final JwtEncoder encoder;
    JwtDemoController(JwtEncoder encoder) { this.encoder = encoder; }

    @PostMapping("/login")
    Map<String, String> login(@RequestParam String username,
                                        @RequestParam String password) {
        if (!password.equals("secret123")) {                  // the capstone checks a hashed password in the database
            throw new ApiException(HttpStatus.UNAUTHORIZED, "Wrong username or password");
        }
        Instant now = Instant.now();
        JwtClaimsSet claims = JwtClaimsSet.builder()
            .subject(username)                                 // who the token belongs to
            .issuedAt(now)
            .expiresAt(now.plus(30, ChronoUnit.MINUTES))       // expiry time
            .build();
        JwsHeader header = JwsHeader.with(MacAlgorithm.HS256).build();
        String token = encoder.encode(JwtEncoderParameters.from(header, claims)).getTokenValue();
        return Map.of("access_token", token, "token_type", "bearer");
    }

    @GetMapping("/me")
    String me(Authentication auth) {
        return "Hello " + auth.getName();                      // the subject of the token
    }
}

package com.school.studentapi;

import jakarta.persistence.*;

@Entity
@Table(name = "users")                               // "user" is a reserved word in many databases
public class User {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    @Column(nullable = false, unique = true, length = 50)
    private String username;

    @Column(nullable = false)
    private String passwordHash;                     // only the hash is stored

    protected User() {}
    public User(String username, String passwordHash) {
        this.username = username;
        this.passwordHash = passwordHash;
    }

    public Long getId() { return id; }
    public String getUsername() { return username; }
    public String getPasswordHash() { return passwordHash; }
}


// ---------- Student.java ----------
package com.school.studentapi;

import jakarta.persistence.*;

@Entity
@Table(name = "students")
public class Student {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    @Column(nullable = false, length = 50)
    private String name;

    private int age;

    @Column(nullable = false, unique = true, length = 100)
    private String email;

    private double marks;

    @ManyToOne(fetch = FetchType.LAZY, optional = false)
    @JoinColumn(name = "owner_id")
    private User owner;                              // every student belongs to one user

    protected Student() {}
    public Student(String name, int age, String email, double marks, User owner) {
        this.name = name;
        this.age = age;
        this.email = email;
        this.marks = marks;
        this.owner = owner;
    }

    public Long getId() { return id; }
    public String getName() { return name; }
    public void setName(String name) { this.name = name; }
    public int getAge() { return age; }
    public void setAge(int age) { this.age = age; }
    public String getEmail() { return email; }
    public void setEmail(String email) { this.email = email; }
    public double getMarks() { return marks; }
    public void setMarks(double marks) { this.marks = marks; }
    public User getOwner() { return owner; }
}

        @NotBlank @Email String email,
        @DecimalMin("0") @DecimalMax("100") double marks) {}

    public record StudentUpdate(                                               // used for PATCH: all optional

        @Min(5) @Max(100) Integer age,

    }

    public record StatsResponse(long students, double averageMarks, double highestMarks) {}

package com.school.studentapi;

import java.util.List;
import java.util.Map;
import org.springframework.http.ResponseEntity;
import org.springframework.http.converter.HttpMessageNotReadableException;
import org.springframework.web.bind.MethodArgumentNotValidException;
import org.springframework.web.bind.annotation.ExceptionHandler;
import org.springframework.web.bind.annotation.RestControllerAdvice;

@RestControllerAdvice
public class ApiExceptionHandler {

    @ExceptionHandler(ApiException.class)
    ResponseEntity<Map<String, Object>> handleApi(ApiException e) {
        return ResponseEntity.status(e.getStatus()).body(Map.of("detail", e.getMessage()));
    }

    @ExceptionHandler(MethodArgumentNotValidException.class)       // same shape as FastAPI's 422
    ResponseEntity<Map<String, Object>> handleInvalid(MethodArgumentNotValidException e) {
        List<Map<String, Object>> problems = e.getBindingResult().getFieldErrors().stream()
            .map(f -> Map.<String, Object>of("loc", List.of("body", f.getField()),
                                             "msg", String.valueOf(f.getDefaultMessage())))
            .toList();
        return ResponseEntity.status(422).body(Map.of("detail", problems));
    }

    @ExceptionHandler(HttpMessageNotReadableException.class)       // broken JSON
    ResponseEntity<Map<String, Object>> handleBadJson(HttpMessageNotReadableException e) {
        return ResponseEntity.status(422).body(Map.of("detail", "Invalid JSON body"));
    }
}`,

package com.school.studentapi;

import com.nimbusds.jose.jwk.source.ImmutableSecret;
import java.nio.charset.StandardCharsets;
import java.util.List;
import javax.crypto.SecretKey;
import javax.crypto.spec.SecretKeySpec;
import org.springframework.beans.factory.annotation.Value;
import org.springframework.context.annotation.Bean;
import org.springframework.context.annotation.Configuration;
import org.springframework.http.HttpMethod;
import org.springframework.security.config.Customizer;
import org.springframework.security.config.annotation.web.builders.HttpSecurity;
import org.springframework.security.config.annotation.web.configuration.EnableWebSecurity;
import org.springframework.security.config.http.SessionCreationPolicy;
import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;
import org.springframework.security.crypto.password.PasswordEncoder;
import org.springframework.security.oauth2.jose.jws.MacAlgorithm;
import org.springframework.security.oauth2.jwt.JwtDecoder;
import org.springframework.security.oauth2.jwt.JwtEncoder;
import org.springframework.security.oauth2.jwt.NimbusJwtDecoder;
import org.springframework.security.oauth2.jwt.NimbusJwtEncoder;
import org.springframework.security.web.SecurityFilterChain;
import org.springframework.web.cors.CorsConfiguration;
import org.springframework.web.cors.CorsConfigurationSource;
import org.springframework.web.cors.UrlBasedCorsConfigurationSource;

@Configuration
@EnableWebSecurity
public class SecurityConfig {

    @Value("\${app.jwt.secret}")
    private String secret;                                       // at least 32 bytes for HS256

    private SecretKey key() {
        return new SecretKeySpec(secret.getBytes(StandardCharsets.UTF_8), "HmacSHA256");
    }

    @Bean
    SecurityFilterChain filterChain(HttpSecurity http) throws Exception {
        http
            .csrf(csrf -> csrf.disable())                        // token API, no browser session
            .cors(Customizer.withDefaults())                     // uses the CorsConfigurationSource below
            .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
            .authorizeHttpRequests(auth -> auth
                .requestMatchers(HttpMethod.POST, "/register", "/login").permitAll()
                .anyRequest().authenticated())
            .oauth2ResourceServer(oauth2 -> oauth2.jwt(Customizer.withDefaults()));
        return http.build();
    }

    @Bean
    JwtEncoder jwtEncoder() {
        return new NimbusJwtEncoder(new ImmutableSecret<>(key()));
    }

    @Bean
    JwtDecoder jwtDecoder() {
        return NimbusJwtDecoder.withSecretKey(key()).macAlgorithm(MacAlgorithm.HS256).build();
    }

    @Bean
    PasswordEncoder passwordEncoder() {
        return new BCryptPasswordEncoder();
    }

    @Bean
    CorsConfigurationSource corsConfigurationSource() {
        CorsConfiguration config = new CorsConfiguration();
        config.setAllowedOrigins(List.of(
            "http://localhost:5173", "http://127.0.0.1:5173",    // React and Vue (Vite)
            "http://localhost:4200", "http://127.0.0.1:4200"));  // Angular
        config.setAllowedMethods(List.of("GET", "POST", "PATCH", "PUT", "DELETE", "OPTIONS"));
        config.setAllowedHeaders(List.of("*"));
        UrlBasedCorsConfigurationSource source = new UrlBasedCorsConfigurationSource();
        source.registerCorsConfiguration("/**", config);
        return source;
    }
}

package com.school.studentapi;

import java.time.Instant;
import java.time.temporal.ChronoUnit;
import org.springframework.beans.factory.annotation.Value;
import org.springframework.security.oauth2.jose.jws.MacAlgorithm;
import org.springframework.security.oauth2.jwt.JwsHeader;
import org.springframework.security.oauth2.jwt.JwtClaimsSet;
import org.springframework.security.oauth2.jwt.JwtEncoder;
import org.springframework.security.oauth2.jwt.JwtEncoderParameters;
import org.springframework.stereotype.Service;

@Service
public class JwtService {
    private final JwtEncoder encoder;
    private final long minutes;

    public JwtService(JwtEncoder encoder, @Value("\${app.jwt.minutes:30}") long minutes) {
        this.encoder = encoder;
        this.minutes = minutes;
    }

    public String createToken(String username) {
        Instant now = Instant.now();
        JwtClaimsSet claims = JwtClaimsSet.builder()
            .subject(username)                                   // who the token belongs to
            .issuedAt(now)
            .expiresAt(now.plus(minutes, ChronoUnit.MINUTES))    // when it expires
            .build();
        JwsHeader header = JwsHeader.with(MacAlgorithm.HS256).build();
        return encoder.encode(JwtEncoderParameters.from(header, claims)).getTokenValue();
    }
}`,

package com.school.studentapi;

import com.school.studentapi.Dtos.StatsResponse;
import com.school.studentapi.Dtos.StudentRequest;
import com.school.studentapi.Dtos.StudentUpdate;
import java.util.DoubleSummaryStatistics;
import java.util.List;
import org.springframework.http.HttpStatus;
import org.springframework.stereotype.Service;
import org.springframework.transaction.annotation.Transactional;

@Service
public class StudentService {
    private final StudentRepository students;
    private final UserRepository users;

    public StudentService(StudentRepository students, UserRepository users) {
        this.students = students;
        this.users = users;
    }

    private User owner(String username) {
        return users.findByUsername(username)
            .orElseThrow(() -> new ApiException(HttpStatus.UNAUTHORIZED, "Unknown user"));
    }

    private static String tidyName(String name) {                // "  riya sharma " -> "Riya Sharma"
        String[] words = name.strip().split(" +");
        StringBuilder sb = new StringBuilder();
        for (String w : words) {
            if (sb.length() > 0) sb.append(' ');
            sb.append(Character.toUpperCase(w.charAt(0))).append(w.substring(1).toLowerCase());
        }
        return sb.toString();
    }

    @Transactional
    public Student create(String username, StudentRequest r) {
        String email = r.email().strip().toLowerCase();
        if (students.existsByEmail(email)) {
            throw new ApiException(HttpStatus.CONFLICT, "Email already exists");
        }
        return students.save(new Student(tidyName(r.name()), r.age(), email, r.marks(), owner(username)));
    }

    @Transactional(readOnly = true)
    public List<Student> list(String username, String search, int skip, int limit) {
        Long ownerId = owner(username).getId();
        return students.findByOwnerIdAndNameContainingIgnoreCaseOrderById(ownerId, search.strip())
            .stream().skip(skip).limit(limit).toList();
    }

    @Transactional(readOnly = true)
    public Student get(String username, long id) {
        return students.findByIdAndOwnerId(id, owner(username).getId())
            .orElseThrow(() -> new ApiException(HttpStatus.NOT_FOUND, "Student not found"));   // 404 hides other users' data
    }

    @Transactional
    public Student update(String username, long id, StudentUpdate r) {
        Student s = get(username, id);
        if (r.name() != null) s.setName(tidyName(r.name()));
        if (r.age() != null) s.setAge(r.age());
        if (r.marks() != null) s.setMarks(r.marks());
        if (r.email() != null) {
            String email = r.email().strip().toLowerCase();
            if (!email.equals(s.getEmail()) && students.existsByEmail(email)) {
                throw new ApiException(HttpStatus.CONFLICT, "Email already exists");
            }
            s.setEmail(email);
        }
        return s;                                                // saved automatically at the end of the transaction
    }

    @Transactional
    public void delete(String username, long id) {
        students.delete(get(username, id));
    }

    @Transactional(readOnly = true)
    public StatsResponse stats(String username) {
        DoubleSummaryStatistics st = students.findByOwnerId(owner(username).getId())
            .stream().mapToDouble(Student::getMarks).summaryStatistics();
        if (st.getCount() == 0) return new StatsResponse(0, 0, 0);
        return new StatsResponse(st.getCount(), Math.round(st.getAverage() * 10) / 10.0, st.getMax());
    }
}


// ---------- AuthController.java ----------
package com.school.studentapi;

import com.school.studentapi.Dtos.RegisterRequest;
import com.school.studentapi.Dtos.TokenResponse;
import com.school.studentapi.Dtos.UserResponse;
import jakarta.validation.Valid;
import org.springframework.http.HttpStatus;
import org.springframework.http.MediaType;
import org.springframework.security.core.Authentication;
import org.springframework.security.crypto.password.PasswordEncoder;
import org.springframework.web.bind.annotation.*;

@RestController
public class AuthController {
    private final UserRepository users;
    private final PasswordEncoder encoder;
    private final JwtService jwt;

    public AuthController(UserRepository users, PasswordEncoder encoder, JwtService jwt) {
        this.users = users;
        this.encoder = encoder;
        this.jwt = jwt;
    }

    @PostMapping("/register")
    @ResponseStatus(HttpStatus.CREATED)
    public UserResponse register(@Valid @RequestBody RegisterRequest req) {
        if (users.existsByUsername(req.username())) {
            throw new ApiException(HttpStatus.BAD_REQUEST, "Username already taken");
        }
        User saved = users.save(new User(req.username(), encoder.encode(req.password())));
        return UserResponse.of(saved);
    }

    @PostMapping(value = "/login", consumes = MediaType.APPLICATION_FORM_URLENCODED_VALUE)
    public TokenResponse login(@RequestParam String username, @RequestParam String password) {
        User user = users.findByUsername(username)
            .filter(u -> encoder.matches(password, u.getPasswordHash()))
            .orElseThrow(() -> new ApiException(HttpStatus.UNAUTHORIZED, "Wrong username or password"));
        return new TokenResponse(jwt.createToken(user.getUsername()), "bearer");
    }

    @GetMapping("/me")
    public UserResponse me(Authentication auth) {
        return users.findByUsername(auth.getName())
            .map(UserResponse::of)
            .orElseThrow(() -> new ApiException(HttpStatus.UNAUTHORIZED, "Unknown user"));
    }
}

package com.school.studentapi;

import com.school.studentapi.Dtos.StatsResponse;
import com.school.studentapi.Dtos.StudentRequest;
import com.school.studentapi.Dtos.StudentResponse;
import com.school.studentapi.Dtos.StudentUpdate;
import jakarta.validation.Valid;
import java.util.List;
import org.springframework.http.HttpStatus;
import org.springframework.security.core.Authentication;
import org.springframework.web.bind.annotation.*;

@RestController
public class StudentController {
    private final StudentService service;

    public StudentController(StudentService service) {
        this.service = service;
    }

    @PostMapping("/students")
    @ResponseStatus(HttpStatus.CREATED)
    public StudentResponse create(Authentication auth, @Valid @RequestBody StudentRequest request) {
        return StudentResponse.of(service.create(auth.getName(), request));
    }

    @GetMapping("/students")
    public List<StudentResponse> list(Authentication auth,
                                      @RequestParam(defaultValue = "") String search,
                                      @RequestParam(defaultValue = "0") int skip,
                                      @RequestParam(defaultValue = "10") int limit) {
        int safeLimit = Math.max(1, Math.min(limit, 100));
        return service.list(auth.getName(), search, Math.max(skip, 0), safeLimit)
            .stream().map(StudentResponse::of).toList();
    }

    @GetMapping("/students/{id}")
    public StudentResponse one(Authentication auth, @PathVariable long id) {
        return StudentResponse.of(service.get(auth.getName(), id));
    }

    @PatchMapping("/students/{id}")
    public StudentResponse update(Authentication auth, @PathVariable long id,
                                  @Valid @RequestBody StudentUpdate request) {
        return StudentResponse.of(service.update(auth.getName(), id, request));
    }

    @DeleteMapping("/students/{id}")
    @ResponseStatus(HttpStatus.NO_CONTENT)
    public void delete(Authentication auth, @PathVariable long id) {
        service.delete(auth.getName(), id);
    }

    @GetMapping("/stats")
    public StatsResponse stats(Authentication auth) {
        return service.stats(auth.getName());
    }
}`,

<!DOCTYPE html>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 8px; }
    li { display: flex; gap: 8px; align-items: center; padding: 6px 0; }
    li.done span { text-decoration: line-through; color: #888; }
    li span { flex: 1; }
    .filters button.active { font-weight: bold; }
  </style>
</head>
<body>
  <h1>My Todos</h1>
  <form id="form">
    <input id="text" type="text" placeholder="What needs doing?" required />
    <button>Add</button>
  </form>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="open">Open</button>
    <button data-filter="done">Done</button>
  </div>
  <ul id="list"></ul>
  <p id="count"></p>

  <script>
    const KEY = "todos";
    let todos = JSON.parse(localStorage.getItem(KEY) ?? "[]");
    let filter = "all";

    const save = () => localStorage.setItem(KEY, JSON.stringify(todos));

    function render() {
      const list = document.querySelector("#list");
      list.replaceChildren();                                  // clear
      const visible = todos.filter((t) =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done);
      for (const t of visible) {
        const li = document.createElement("li");
        li.dataset.id = t.id;
        li.className = t.done ? "done" : "";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.done;
        box.dataset.action = "toggle";
        const span = document.createElement("span");
        span.textContent = t.text;                             // safe: no HTML injection
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.dataset.action = "delete";
        li.append(box, span, del);
        list.append(li);
      }
      document.querySelector("#count").textContent =
        todos.filter((t) => !t.done).length + " open of " + todos.length;
      document.querySelectorAll(".filters button").forEach((b) =>
        b.classList.toggle("active", b.dataset.filter === filter));
    }

    document.querySelector("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.querySelector("#text");
      todos.push({ id: Date.now(), text: input.value.trim(), done: false });
      input.value = "";
      save();
      render();
    });

    document.querySelector("#list").addEventListener("click", (e) => {     // event delegation
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const id = Number(el.closest("li").dataset.id);
      if (el.dataset.action === "toggle") {
        todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
      } else if (el.dataset.action === "delete") {
        todos = todos.filter((t) => t.id !== id);
      }
      save();
      render();
    });

    document.querySelector(".filters").addEventListener("click", (e) => {
      const f = e.target.dataset.filter;
      if (f) { filter = f; render(); }
    });

    render();
  <\/script>
</body>
</html>`,

async function get<T>(url: string): Promise<T> {            // a typed fetch helper

// ---------- src/api.ts ----------
const API: string = import.meta.env.VITE_API_URL ?? "http://127.0.0.1:8000";

export class ApiError extends Error {
  status: number;
  constructor(message: string, status: number) {
    super(message);
    this.name = "ApiError";
    this.status = status;
  }
}

interface RequestOptions {
  method?: string;
  body?: unknown;
  token?: string | null;
  form?: Record<string, string>;
}

function errorMessage(data: unknown): string {
  const detail = (data as { detail?: unknown } | null)?.detail;
  if (Array.isArray(detail)) {                    // 422: a list of problems
    return detail
      .map((d: { loc: (string | number)[]; msg: string }) => \`\${d.loc[d.loc.length - 1]}: \${d.msg}\`)
      .join(", ");
  }
  return typeof detail === "string" ? detail : "Something went wrong";
}

export async function request<T>(path: string, options: RequestOptions = {}): Promise<T> {
  const { method = "GET", body, token, form } = options;
  const headers: Record<string, string> = {};
  if (token) headers.Authorization = \`Bearer \${token}\`;

  let payload: BodyInit | undefined;
  if (form) {
    payload = new URLSearchParams(form);          // login needs form data, not JSON
  } else if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    payload = JSON.stringify(body);
  }

  let res: Response;
  try {
    res = await fetch(API + path, { method, headers, body: payload });
  } catch {
    throw new ApiError("Cannot reach the server. Is the API running?", 0);
  }
  if (res.status === 204) return undefined as T;  // delete returns no content
  const data: unknown = await res.json().catch(() => null);
  if (!res.ok) throw new ApiError(errorMessage(data), res.status);
  return data as T;
}

import type { Token } from "./types";

const KEY = "token";

export const getToken = (): string | null => localStorage.getItem(KEY);

export async function login(username: string, password: string): Promise<void> {
  const data = await request<Token>("/login", { method: "POST", form: { username, password } });
  localStorage.setItem(KEY, data.access_token);
}

export async function register(username: string, password: string): Promise<void> {
  await request("/register", { method: "POST", body: { username, password } });
}

export function logout(): void {

      <p class="link" data-action="toggle-mode">
        \${isLogin ? "New here? Create an account" : "Have an account? Log in"}
      </p>
    </form>\`;
}

export function statsView(stats: Stats | null): string {
  if (!stats) return "";
  return \`<span>Students: \${stats.students}</span>
          <span>Average: \${stats.average_marks}</span>
          <span>Highest: \${stats.highest_marks}</span>\`;
}

export function rowsView(students: Student[]): string {
  if (students.length === 0) return \`<tr><td colspan="6">No students found.</td></tr>\`;
  return students
    .map(
      (s) => \`
      <tr>
        <td>\${s.id}</td>
        <td>\${escapeHtml(s.name)}</td>

export function dashboardView(state: ViewState): string {

307:`// ---------- src/main.ts ----------
import "./styles/main.scss";
import { ApiError } from "./api";
import { getToken, login, logout, register } from "./auth";
import { deleteStudent, getStats, listStudents, saveStudent } from "./students";
import { dashboardView, loginView, rowsView, statsView, type ViewState } from "./ui";

const state: ViewState = {
  mode: "login",
  error: "",
  busy: false,
  students: [],
  stats: null,
  search: "",
  editing: null,
};

const app = document.querySelector<HTMLDivElement>("#app")!;

function render(): void {
  app.innerHTML = getToken() ? dashboardView(state) : loginView(state);
}

function showError(err: unknown): void {
  if (err instanceof ApiError && err.status === 401 && getToken()) {
    logout();                                      // the token expired
  }
  state.error = err instanceof Error ? err.message : "Something went wrong";
  render();
}

async function loadData(): Promise<void> {
  const token = getToken();
  if (!token) return render();
  try {
    state.students = await listStudents(token, state.search);
    state.stats = await getStats(token);
    state.error = "";
    render();
  } catch (err) {
    showError(err);
  }
}

// Search only updates the table and the stats, so the search box keeps focus
async function refreshTable(): Promise<void> {
  const token = getToken();
  if (!token) return;
  try {
    state.students = await listStudents(token, state.search);
    state.stats = await getStats(token);
    document.querySelector("#rows")!.innerHTML = rowsView(state.students);
    document.querySelector("#stats")!.innerHTML = statsView(state.stats);
  } catch (err) {
    showError(err);
  }
}

// ----- clicks: ONE listener for every button (event delegation) -----
app.addEventListener("click", async (e) => {
  const el = (e.target as HTMLElement).closest<HTMLElement>("[data-action]");
  if (!el) return;
  const id = Number(el.dataset.id);

  switch (el.dataset.action) {
    case "toggle-mode":
      state.mode = state.mode === "login" ? "register" : "login";
      state.error = "";
      return render();
    case "logout":
      logout();
      state.error = "";
      state.editing = null;
      return render();
    case "edit":
      state.editing = state.students.find((s) => s.id === id) ?? null;
      return render();
    case "cancel":
      state.editing = null;
      return render();
    case "delete": {
      if (!window.confirm("Delete this student?")) return;
      try {
        await deleteStudent(getToken()!, id);
        await loadData();
      } catch (err) {
        showError(err);
      }
    }
  }
});

// ----- forms -----
app.addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target as HTMLFormElement;
  const data = Object.fromEntries(new FormData(form)) as Record<string, string>;

  if (form.id === "auth-form") {
    state.busy = true;
    state.error = "";
    render();
    try {
      if (state.mode === "register") await register(data.username, data.password);
      await login(data.username, data.password);
      state.busy = false;
      await loadData();
    } catch (err) {
      state.busy = false;
      showError(err);
    }
  } else if (form.id === "student-form") {
    const input = {
      name: data.name,
      age: Number(data.age),
      email: data.email,
      marks: Number(data.marks || 0),
    };
    try {
      await saveStudent(getToken()!, input, state.editing?.id);
      state.editing = null;
      await loadData();
    } catch (err) {
      showError(err);
    }
  }
});

// ----- search with a 300 ms debounce -----
let timer: number | undefined;
app.addEventListener("input", (e) => {
  const target = e.target as HTMLInputElement;
  if (target.id !== "search") return;
  state.search = target.value;
  window.clearTimeout(timer);
  timer = window.setTimeout(refreshTable, 300);
});

// ----- start -----
if (getToken()) {
  loadData();
} else {
  render();
}`,

312:`import express from "express";

const app = express();
app.use(express.json());                        // read JSON bodies

const students = new Map();                     // a simple in-memory "database"
let nextId = 1;

app.post("/students", (req, res) => {
  const { name, age } = req.body ?? {};
  const student = { id: nextId++, name, age };
  students.set(student.id, student);
  res.status(201).json(student);
});

app.get("/students", (req, res) => {
  const search = String(req.query.search ?? "").toLowerCase();       // ?search=ri
  const list = [...students.values()].filter((s) => s.name?.toLowerCase().includes(search));
  res.json(list);
});

app.get("/students/:id", (req, res) => {
  const student = students.get(Number(req.params.id));               // params are text
  if (!student) return res.status(404).json({ detail: "Student not found" });
  res.json(student);
});

app.put("/students/:id", (req, res) => {
  const id = Number(req.params.id);
  if (!students.has(id)) return res.status(404).json({ detail: "Student not found" });
  const updated = { id, ...req.body };
  students.set(id, updated);
  res.json(updated);
});

app.delete("/students/:id", (req, res) => {
  const existed = students.delete(Number(req.params.id));
  res.sendStatus(existed ? 204 : 404);
});

app.listen(3000, () => console.log("http://localhost:3000"));

console.log(good.success, good.data);
// { name: "Riya Sharma", age: 15, email: "riya@example.com", marks: 0 }

const bad = studentSchema.safeParse({ name: "R", age: 200, email: "x" });
console.log(bad.success);
for (const issue of bad.error.issues) {
  console.log(issue.path.join("."), "->", issue.message);
}

// A reusable middleware: validate the request body with any schema
export const validate = (schema) => (req, res, next) => {
  const result = schema.safeParse(req.body ?? {});
  if (!result.success) {
    return res.status(422).json({
      detail: result.error.issues.map((i) => ({ loc: ["body", ...i.path], msg: i.message })),
    });
  }
  req.body = result.data;                                // cleaned data
  next();
};

const SECRET = "dev-only-secret";

// Passwords: store only the hash
const hash = await bcrypt.hash("secret123", 10);
console.log(hash);                                        // never store the real password

console.log(await bcrypt.compare("wrong", hash));         // false

// JWT: a signed token with an expiry
const token = jwt.sign({ sub: "riya" }, SECRET, { algorithm: "HS256", expiresIn: 30 * 60 });   // 30 minutes
console.log(token);                                       // three parts separated by dots

try {
  jwt.verify(token, "wrong-secret", { algorithms: ["HS256"] });
} catch (err) {
  console.log("Invalid token:", err.message);
}

// Middleware that protects a route
export function requireAuth(req, res, next) {
  const [scheme, value] = (req.get("authorization") ?? "").split(" ");
  if (scheme?.toLowerCase() !== "bearer" || !value) {
    return res.status(401).json({ detail: "Not authenticated" });
  }
  try {
    req.user = jwt.verify(value, SECRET, { algorithms: ["HS256"] });   // { sub: "riya" }
    next();
  } catch {
    res.status(401).json({ detail: "Invalid or expired token" });
  }
}

export class HttpError extends Error {
  constructor(status, detail) {
    super(typeof detail === "string" ? detail : "Request error");
    this.status = status;
    this.detail = detail;                       // a text, or a list for 422
  }
}

// Express recognises an error handler by its FOUR arguments
export function errorHandler(err, req, res, next) {
  if (err instanceof HttpError) {
    return res.status(err.status).json({ detail: err.detail });
  }
  if (err.type === "entity.parse.failed") {     // broken JSON from express.json()

  }

}


// ---------- src/validation.js ----------
import { z } from "zod";
import { HttpError } from "./errors.js";

const titleCase = (text) =>
  text.split(/\\s+/).map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");

// Field rules shared by "create" and "update"
const name = z.string().trim().min(2, "Name must have 2 or more letters").max(50, "Name is too long").transform(titleCase);
const age = z.number().int().min(5, "Age must be 5 or more").max(100, "Age must be 100 or less");
const email = z.string().trim().toLowerCase().email("Enter a valid email like riya@example.com");
const marks = z.number().min(0, "Marks must be 0 or more").max(100, "Marks must be 100 or less");

export const registerSchema = z.object({
  username: z.string().trim().min(3, "Username needs 3 or more characters").max(50),
  password: z.string().min(8, "Password needs 8 or more characters").max(100),
});

export const loginSchema = z.object({
  username: z.string().min(1, "Username is required"),
  password: z.string().min(1, "Password is required"),
});

import { db } from "./db.js";

// ----- users -----
const insertUser = db.prepare("INSERT INTO users (username, password_hash) VALUES (?, ?)");
const userByName = db.prepare("SELECT * FROM users WHERE username = ?");

export const users = {
  create(username, passwordHash) {
    const info = insertUser.run(username, passwordHash);
    return { id: Number(info.lastInsertRowid), username };
  },
  findByUsername: (username) => userByName.get(username),
};

// ----- students -----
const COLUMNS = ["name", "age", "email", "marks"];     // the ONLY fields PATCH may change

const insertStudent = db.prepare(
  "INSERT INTO students (name, age, email, marks, owner_id) VALUES (?, ?, ?, ?, ?)"
);
const selectOne = db.prepare("SELECT * FROM students WHERE id = ? AND owner_id = ?");
const selectList = db.prepare(
  "SELECT * FROM students WHERE owner_id = ? AND name LIKE ? ORDER BY id LIMIT ? OFFSET ?"
);
const deleteOne = db.prepare("DELETE FROM students WHERE id = ? AND owner_id = ?");
const emailOwner = db.prepare("SELECT id FROM students WHERE email = ?");
const statsQuery = db.prepare(\`
  SELECT COUNT(*) AS students,
         COALESCE(AVG(marks), 0) AS average,
         COALESCE(MAX(marks), 0) AS highest
  FROM students WHERE owner_id = ?
\`);

export function emailExists(email, exceptId = null) {
  const row = emailOwner.get(email);
  return Boolean(row) && row.id !== exceptId;
}

export function getStudent(id, ownerId) {
  return selectOne.get(id, ownerId);
}

export function createStudent({ name, age, email, marks }, ownerId) {
  const info = insertStudent.run(name, age, email, marks, ownerId);
  return getStudent(Number(info.lastInsertRowid), ownerId);
}

export function listStudents(ownerId, search, skip, limit) {
  return selectList.all(ownerId, "%" + search + "%", limit, skip);
}

export function updateStudent(id, ownerId, fields) {
  const keys = Object.keys(fields).filter((k) => COLUMNS.includes(k) && fields[k] !== undefined);
  if (keys.length > 0) {
    const setClause = keys.map((k) => k + " = ?").join(", ");    // column names come from our own list
    db.prepare("UPDATE students SET " + setClause + " WHERE id = ? AND owner_id = ?")
      .run(...keys.map((k) => fields[k]), id, ownerId);          // values go through ? placeholders
  }
  return getStudent(id, ownerId);
}

export function deleteStudent(id, ownerId) {
  return deleteOne.run(id, ownerId).changes > 0;
}

export function studentStats(ownerId) {
  const row = statsQuery.get(ownerId);
  return {
    students: row.students,
    average_marks: Math.round(row.average * 10) / 10,
    highest_marks: row.highest,
  };
}

import bcrypt from "bcryptjs";
import jwt from "jsonwebtoken";
import { config } from "./config.js";
import { HttpError } from "./errors.js";
import { users } from "./repo.js";

export const hashPassword = (password) => bcrypt.hash(password, 10);
export const verifyPassword = (password, hash) => bcrypt.compare(password, hash);

export function createToken(username) {
  return jwt.sign({ sub: username }, config.jwtSecret, {
    algorithm: "HS256",
    expiresIn: config.jwtMinutes * 60,             // seconds
  });
}

// Middleware: like FastAPI's get_current_user dependency
export function requireAuth(req, res, next) {
  const [scheme, token] = (req.get("authorization") ?? "").split(" ");
  if (scheme?.toLowerCase() !== "bearer" || !token) {
    throw new HttpError(401, "Not authenticated");
  }
  let payload;
  try {
    payload = jwt.verify(token, config.jwtSecret, { algorithms: ["HS256"] });
  } catch {
    throw new HttpError(401, "Invalid or expired token");   // bad signature or expired
  }
  const user = users.findByUsername(payload.sub);
  if (!user) throw new HttpError(401, "Invalid or expired token");
  req.user = user;                                           // routes can now use req.user
  next();
}

});

} from "../repo.js";

// ----- /students -----
export const studentsRouter = Router();
studentsRouter.use(requireAuth);                         // every route below needs a token

function ownStudent(req) {
  const id = Number(req.params.id);
  const student = Number.isInteger(id) ? getStudent(id, req.user.id) : undefined;
  if (!student) throw new HttpError(404, "Student not found");    // 404 hides other users' data
  return student;
}

studentsRouter.post("/", validate(studentCreateSchema), (req, res) => {
  if (emailExists(req.body.email)) throw new HttpError(409, "Email already exists");
  res.status(201).json(createStudent(req.body, req.user.id));
});

studentsRouter.get("/", (req, res) => {
  const search = String(req.query.search ?? "").trim();
  const skip = Math.max(Number.parseInt(req.query.skip ?? "0", 10) || 0, 0);
  const limit = Math.min(Math.max(Number.parseInt(req.query.limit ?? "10", 10) || 10, 1), 100);
  res.json(listStudents(req.user.id, search, skip, limit));
});

studentsRouter.get("/:id", (req, res) => {
  res.json(ownStudent(req));
});

studentsRouter.patch("/:id", validate(studentUpdateSchema), (req, res) => {
  const student = ownStudent(req);
  if (req.body.email !== undefined && emailExists(req.body.email, student.id)) {
    throw new HttpError(409, "Email already exists");
  }
  res.json(updateStudent(student.id, req.user.id, req.body));
});

studentsRouter.delete("/:id", (req, res) => {
  const student = ownStudent(req);
  deleteStudent(student.id, req.user.id);
  res.sendStatus(204);
});

346:`import java.util.*;
import java.util.function.Supplier;

// Patterns already hide inside the JDK. Learn to recognise them.
public class JdkPatterns {
    public static void main(String[] args) {
        // Singleton: one Runtime object
        System.out.println(Runtime.getRuntime().availableProcessors());

        // Factory Method: the class chooses what to create
        List<Integer> list = List.of(3, 1, 2);
        Calendar calendar = Calendar.getInstance();

        // Builder: a StringBuilder builds step by step
        String text = new StringBuilder().append("Hi ").append("Riya").toString();

        // Strategy: Comparator is a swappable algorithm
        List<String> names = new ArrayList<>(List.of("Ravi", "Anu", "Riya"));
        names.sort(Comparator.comparing(String::length));

        // Decorator: wrap a list so it cannot be changed
        List<Integer> readOnly = Collections.unmodifiableList(new ArrayList<>(list));

        // Adapter: a fixed-size List view of an array
        List<String> adapted = Arrays.asList("a", "b");

        // Iterator: walk without knowing how it is stored
        Iterator<Integer> it = list.iterator();
        while (it.hasNext()) it.next();

        // Template Method / Observer / Command / Proxy also live in the JDK:
        //   AbstractList (template), PropertyChangeListener (observer),
        //   Runnable (command), java.lang.reflect.Proxy (proxy)
        System.out.println(text + " " + names + " " + readOnly + " " + adapted);
    }
}`,

361:`import itertools
import zlib

class RoundRobin:                                   # take turns
    def __init__(self, servers):
        self._cycle = itertools.cycle(servers)
    def pick(self, client_ip=None):
        return next(self._cycle)

class LeastConnections:                             # send to the least busy server
    def __init__(self, servers):
        self.active = {s: 0 for s in servers}
    def pick(self, client_ip=None):
        server = min(self.active, key=self.active.get)
        self.active[server] += 1
        return server
    def done(self, server):
        self.active[server] -= 1

class IpHash:                                       # sticky: the same client goes to the same server
    def __init__(self, servers):
        self.servers = servers
    def pick(self, client_ip):
        return self.servers[zlib.crc32(client_ip.encode()) % len(self.servers)]

print([rr.pick() for _ in range(5)])                # app-1 app-2 app-3 app-1 app-2

import time
from collections import OrderedDict

# ---------- LRU: remove the Least Recently Used item when full ----------
class LRUCache:
    def __init__(self, capacity):
        self.capacity = capacity
        self.data = OrderedDict()

    def get(self, key):
        if key not in self.data:
            return None
        self.data.move_to_end(key)                  # mark as recently used
        return self.data[key]

    def put(self, key, value):
        self.data[key] = value
        self.data.move_to_end(key)
        if len(self.data) > self.capacity:
            self.data.popitem(last=False)           # remove the oldest

lru = LRUCache(2)
lru.put("a", 1); lru.put("b", 2); lru.get("a"); lru.put("c", 3)   # "b" is evicted
print(lru.get("b"), lru.get("a"))                   # None 1

# ---------- Cache-aside with TTL and stampede protection ----------
class TTLCache:
    def __init__(self, ttl_seconds):
        self.ttl = ttl_seconds
        self.store = {}
        self.locks = {}
        self.guard = threading.Lock()

    def _lock_for(self, key):
        with self.guard:
            return self.locks.setdefault(key, threading.Lock())

    def get_or_load(self, key, loader):
        entry = self.store.get(key)
        if entry and entry[1] > time.time():
            return entry[0]                         # cache HIT
        with self._lock_for(key):                   # only ONE caller loads, the others wait
            entry = self.store.get(key)
            if entry and entry[1] > time.time():
                return entry[0]
            value = loader()                        # cache MISS: ask the database
            self.store[key] = (value, time.time() + self.ttl)
            return value

    def invalidate(self, key):                      # call this when the data changes
        self.store.pop(key, None)

    return {"students": 42}

print(cache.get_or_load("stats:1", slow_stats))     # from the cache`,

# ---------- Consistent hashing: adding a server moves only a few keys ----------
class HashRing:
    def __init__(self, nodes=(), replicas=100):
        self.replicas = replicas                     # virtual nodes spread the load evenly
        self.ring = []                               # sorted hash positions
        self.owner = {}
        for node in nodes:
            self.add(node)

    @staticmethod
    def _hash(key):
        return int(hashlib.md5(key.encode()).hexdigest(), 16)

    def add(self, node):
        for i in range(self.replicas):
            h = self._hash(f"{node}#{i}")
            bisect.insort(self.ring, h)
            self.owner[h] = node

    def get(self, key):
        h = self._hash(key)
        i = bisect.bisect(self.ring, h) % len(self.ring)    # next position on the ring
        return self.owner[self.ring[i]]

        self.tokens = min(self.capacity, self.tokens + (now - self.last) * self.rate)
        self.last = now
        if self.tokens >= 1:
            self.tokens -= 1
            return True

import time

# ---------- Retry with exponential backoff and jitter ----------
def retry(func, attempts=4, base=0.1, cap=2.0):
    for attempt in range(attempts):
        try:
            return func()
        except Exception as error:
            if attempt == attempts - 1:
                raise                                          # out of attempts
            delay = min(cap, base * 2 ** attempt)              # 0.1, 0.2, 0.4 ...
            time.sleep(random.uniform(0, delay))               # jitter: random wait
            print(f"retry {attempt + 1} after error: {error}")

# ---------- Circuit breaker ----------
class CircuitOpenError(Exception):
    pass

class CircuitBreaker:
    def __init__(self, failure_threshold=3, reset_after=5.0):
        self.threshold = failure_threshold
        self.reset_after = reset_after
        self.failures = 0
        self.opened_at = None

    def call(self, func):
        if self.opened_at is not None:
            if time.monotonic() - self.opened_at < self.reset_after:
                raise CircuitOpenError("circuit is OPEN: failing fast")
            # time is up: HALF-OPEN, let one trial call through
        try:
            result = func()
        except Exception:
            self.failures += 1
            if self.failures >= self.threshold:
                self.opened_at = time.monotonic()              # OPEN
            raise
        self.failures = 0                                      # success: CLOSED again
        self.opened_at = None
        return result

correlation_id = contextvars.ContextVar("correlation_id", default="-")

class JsonFormatter(logging.Formatter):              # structured logs: easy to search
    def format(self, record):
        return json.dumps({
            "time": self.formatTime(record),
            "level": record.levelname,
            "message": record.getMessage(),

        })

handler = logging.StreamHandler()

REQUESTS = Counter("http_requests_total", "Requests", ["method", "path", "status"])
LATENCY = Histogram("http_request_seconds", "Request time", ["path"])

app = FastAPI()

@app.middleware("http")
async def observe(request: Request, call_next):
    cid = request.headers.get("x-correlation-id", str(uuid.uuid4()))   # reuse the caller's id
    correlation_id.set(cid)
    start = time.perf_counter()
    response = await call_next(request)
    LATENCY.labels(request.url.path).observe(time.perf_counter() - start)
    REQUESTS.labels(request.method, request.url.path, response.status_code).inc()
    response.headers["x-correlation-id"] = cid                         # hand it back
    log.info(f"{request.method} {request.url.path} -> {response.status_code}")
    return response

368:`import string

ALPHABET = string.digits + string.ascii_lowercase + string.ascii_uppercase    # 62 characters

def encode(number: int) -> str:
    if number == 0:
        return ALPHABET[0]
    chars = []
    while number:
        number, rest = divmod(number, 62)
        chars.append(ALPHABET[rest])
    return "".join(reversed(chars))

def decode(code: str) -> int:
    number = 0
    for ch in code:
        number = number * 62 + ALPHABET.index(ch)
    return number

from fastapi import FastAPI, WebSocket, WebSocketDisconnect

app = FastAPI()

class Room:
    def __init__(self):
        self.connections: set[WebSocket] = set()

    async def join(self, ws: WebSocket):
        await ws.accept()
        self.connections.add(ws)

    def leave(self, ws: WebSocket):
        self.connections.discard(ws)

    async def broadcast(self, message: str):

            await ws.send_text(message)

373:`# ---------- SAGA (orchestration): enrol a student in a course ----------
# Steps: reserve a seat -> charge the fee -> send confirmation.
# If a step fails, undo the earlier ones with COMPENSATING actions.

class SagaFailed(Exception):
    pass

def reserve_seat(ctx):  print("seat reserved");  ctx["seat"] = True
def release_seat(ctx):  print("seat released (compensation)")
def charge_fee(ctx):
    if ctx.get("card_declined"):
        raise RuntimeError("card declined")
    print("fee charged")
def refund_fee(ctx):    print("fee refunded (compensation)")
def send_confirmation(ctx): print("confirmation sent")

STEPS = [                                            # (action, compensation)
    (reserve_seat, release_seat),
    (charge_fee, refund_fee),
    (send_confirmation, None),
]

def run_saga(ctx):
    completed = []
    for action, compensation in STEPS:
        try:
            action(ctx)
            completed.append(compensation)
        except Exception as error:
            print("step failed:", error)
            for undo in reversed(completed):         # undo in reverse order
                if undo:
                    undo(ctx)
            raise SagaFailed(str(error))

run_saga({})                                         # all steps succeed
try:
    run_saga({"card_declined": True})                # seat reserved, charge fails, seat released
except SagaFailed:
    print("enrolment cancelled")

import sqlite3
db = sqlite3.connect(":memory:")
db.execute("CREATE TABLE students (id INTEGER PRIMARY KEY, name TEXT)")
db.execute("CREATE TABLE outbox (id INTEGER PRIMARY KEY, event TEXT, payload TEXT, sent INTEGER DEFAULT 0)")

def create_student(name):
    with db:                                         # ONE transaction: data and event together
        cur = db.execute("INSERT INTO students (name) VALUES (?)", (name,))
        db.execute("INSERT INTO outbox (event, payload) VALUES (?, ?)",
                   ("student.created", f'{{"id": {cur.lastrowid}, "name": "{name}"}}'))

def relay_outbox(publish):                           # a background loop sends and marks the rows
    for row_id, event, payload in db.execute("SELECT id, event, payload FROM outbox WHERE sent = 0").fetchall():
        publish(event, payload)
        with db:
            db.execute("UPDATE outbox SET sent = 1 WHERE id = ?", (row_id,))

import os
import sqlite3
from contextlib import closing
from datetime import datetime, timedelta, timezone

import jwt
from fastapi import Depends, FastAPI, HTTPException
from fastapi.security import OAuth2PasswordBearer, OAuth2PasswordRequestForm
from pwdlib import PasswordHash
from pydantic import BaseModel, Field

SECRET = os.environ["JWT_SECRET"]                      # no secret, no start
DB_PATH = os.getenv("DB_PATH", "/data/auth.db")
os.makedirs(os.path.dirname(DB_PATH), exist_ok=True)

password_hash = PasswordHash.recommended()
oauth2 = OAuth2PasswordBearer(tokenUrl="login")
app = FastAPI(title="Auth service")


def connect() -> sqlite3.Connection:
    conn = sqlite3.connect(DB_PATH)
    conn.row_factory = sqlite3.Row
    return conn


with closing(connect()) as conn:
    conn.execute(
        "CREATE TABLE IF NOT EXISTS users ("
        "id INTEGER PRIMARY KEY AUTOINCREMENT, "
        "username TEXT UNIQUE NOT NULL, "
        "password_hash TEXT NOT NULL)"
    )
    conn.commit()


class UserCreate(BaseModel):
    username: str = Field(min_length=3, max_length=50)
    password: str = Field(min_length=8, max_length=100)


class UserRead(BaseModel):
    id: int
    username: str


@app.get("/health")
def health():
    return {"status": "ok"}


@app.post("/register", response_model=UserRead, status_code=201)
def register(data: UserCreate):
    with closing(connect()) as conn:
        if conn.execute("SELECT 1 FROM users WHERE username = ?", (data.username,)).fetchone():
            raise HTTPException(400, "Username already taken")
        cur = conn.execute(
            "INSERT INTO users (username, password_hash) VALUES (?, ?)",
            (data.username, password_hash.hash(data.password)),
        )
        conn.commit()
        return {"id": cur.lastrowid, "username": data.username}


@app.post("/login")
def login(form: OAuth2PasswordRequestForm = Depends()):
    with closing(connect()) as conn:
        row = conn.execute("SELECT * FROM users WHERE username = ?", (form.username,)).fetchone()
    if row is None or not password_hash.verify(form.password, row["password_hash"]):
        raise HTTPException(401, "Wrong username or password", headers={"WWW-Authenticate": "Bearer"})
    expires = datetime.now(timezone.utc) + timedelta(minutes=30)
    token = jwt.encode(
        {"sub": row["username"], "uid": row["id"], "exp": expires},   # uid lets other services know the user
        SECRET,
        algorithm="HS256",
    )
    return {"access_token": token, "token_type": "bearer"}


@app.get("/me", response_model=UserRead)
def me(token: str = Depends(oauth2)):
    try:
        payload = jwt.decode(token, SECRET, algorithms=["HS256"])
    except jwt.InvalidTokenError:
        raise HTTPException(401, "Invalid or expired token", headers={"WWW-Authenticate": "Bearer"})
    return {"id": payload["uid"], "username": payload["sub"]}

# ---------- student-service/main.py ----------
import json
import logging
import os
import sqlite3
from contextlib import closing

import jwt
import redis
from fastapi import Depends, FastAPI, HTTPException, Query
from fastapi.security import OAuth2PasswordBearer
from pydantic import BaseModel, Field, field_validator

SECRET = os.environ["JWT_SECRET"]
DB_PATH = os.getenv("DB_PATH", "/data/students.db")
REDIS_URL = os.getenv("REDIS_URL", "redis://redis:6379/0")
STREAM = "student-events"
os.makedirs(os.path.dirname(DB_PATH), exist_ok=True)

log = logging.getLogger("students")
logging.basicConfig(level=logging.INFO)
oauth2 = OAuth2PasswordBearer(tokenUrl="login")
broker = redis.Redis.from_url(REDIS_URL, socket_connect_timeout=1, socket_timeout=1, decode_responses=True)
app = FastAPI(title="Student service")


def connect() -> sqlite3.Connection:
    conn = sqlite3.connect(DB_PATH)
    conn.row_factory = sqlite3.Row
    return conn


with closing(connect()) as conn:
    conn.execute(
        "CREATE TABLE IF NOT EXISTS students ("
        "id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, age INTEGER NOT NULL, "
        "email TEXT UNIQUE NOT NULL, marks REAL NOT NULL DEFAULT 0, owner_id INTEGER NOT NULL)"
    )
    conn.commit()


# ----- events: best effort. A broker outage must NOT break the API -----
def publish(event_type: str, payload: dict) -> None:
    try:
        broker.xadd(STREAM, {"type": event_type, "data": json.dumps(payload)}, maxlen=10000)
    except redis.RedisError:
        log.warning("Could not publish %s (broker down). The request still succeeds.", event_type)


# ----- security: the token is checked here, with the shared secret. No call to the auth service -----
def current_user(token: str = Depends(oauth2)) -> dict:
    try:
        payload = jwt.decode(token, SECRET, algorithms=["HS256"])
    except jwt.InvalidTokenError:
        raise HTTPException(401, "Invalid or expired token", headers={"WWW-Authenticate": "Bearer"})
    return {"id": payload["uid"], "username": payload["sub"]}


# ----- schemas -----
def clean_email(v):
    if v is None:
        return v
    v = v.strip().lower()
    if "@" not in v or "." not in v.split("@")[-1]:
        raise ValueError("Enter a valid email like riya@example.com")
    return v


class StudentCreate(BaseModel):
    name: str = Field(min_length=2, max_length=50)
    age: int = Field(ge=5, le=100)
    email: str
    marks: float = Field(default=0, ge=0, le=100)

    @field_validator("name")
    @classmethod
    def tidy_name(cls, v):
        return v.strip().title()

    @field_validator("email")
    @classmethod
    def check_email(cls, v):
        return clean_email(v)


class StudentUpdate(BaseModel):
    name: str | None = Field(default=None, min_length=2, max_length=50)
    age: int | None = Field(default=None, ge=5, le=100)
    email: str | None = None
    marks: float | None = Field(default=None, ge=0, le=100)

    @field_validator("name")
    @classmethod
    def tidy_name(cls, v):
        return v.strip().title() if v else v

    @field_validator("email")
    @classmethod
    def check_email(cls, v):
        return clean_email(v)


class StudentRead(StudentCreate):
    id: int
    owner_id: int


def one(conn, student_id: int, owner_id: int):
    row = conn.execute("SELECT * FROM students WHERE id = ? AND owner_id = ?", (student_id, owner_id)).fetchone()
    if row is None:
        raise HTTPException(404, "Student not found")        # 404 hides other users' data
    return row


# ----- routes -----
@app.get("/health")
def health():
    return {"status": "ok"}


@app.post("/students", response_model=StudentRead, status_code=201)
def create(data: StudentCreate, user: dict = Depends(current_user)):
    with closing(connect()) as conn:
        try:
            cur = conn.execute(
                "INSERT INTO students (name, age, email, marks, owner_id) VALUES (?, ?, ?, ?, ?)",
                (data.name, data.age, data.email, data.marks, user["id"]),
            )
            conn.commit()
        except sqlite3.IntegrityError:
            raise HTTPException(409, "Email already exists")
        row = one(conn, cur.lastrowid, user["id"])
    publish("student.created", {"id": row["id"], "name": row["name"], "email": row["email"], "owner": user["username"]})
    return dict(row)


@app.get("/students", response_model=list[StudentRead])
def list_students(search: str = "", skip: int = Query(0, ge=0), limit: int = Query(10, ge=1, le=100),
                  user: dict = Depends(current_user)):
    with closing(connect()) as conn:
        rows = conn.execute(
            "SELECT * FROM students WHERE owner_id = ? AND name LIKE ? ORDER BY id LIMIT ? OFFSET ?",
            (user["id"], f"%{search}%", limit, skip),
        ).fetchall()
    return [dict(r) for r in rows]


@app.get("/stats")
def stats(user: dict = Depends(current_user)):
    with closing(connect()) as conn:
        row = conn.execute(
            "SELECT COUNT(*) AS n, COALESCE(AVG(marks), 0) AS avg, COALESCE(MAX(marks), 0) AS top "
            "FROM students WHERE owner_id = ?",
            (user["id"],),
        ).fetchone()
    return {"students": row["n"], "average_marks": round(row["avg"], 1), "highest_marks": row["top"]}


@app.get("/students/{student_id}", response_model=StudentRead)
def read(student_id: int, user: dict = Depends(current_user)):
    with closing(connect()) as conn:
        return dict(one(conn, student_id, user["id"]))


@app.patch("/students/{student_id}", response_model=StudentRead)
def update(student_id: int, data: StudentUpdate, user: dict = Depends(current_user)):
    changes = data.model_dump(exclude_unset=True)
    allowed = {"name", "age", "email", "marks"}
    with closing(connect()) as conn:
        one(conn, student_id, user["id"])
        fields = [k for k in changes if k in allowed]
        if fields:
            sets = ", ".join(f"{k} = ?" for k in fields)               # names come from OUR list
            try:
                conn.execute(f"UPDATE students SET {sets} WHERE id = ?", [changes[k] for k in fields] + [student_id])
                conn.commit()
            except sqlite3.IntegrityError:
                raise HTTPException(409, "Email already exists")
        return dict(one(conn, student_id, user["id"]))


@app.delete("/students/{student_id}", status_code=204)
def delete(student_id: int, user: dict = Depends(current_user)):
    with closing(connect()) as conn:
        row = one(conn, student_id, user["id"])
        conn.execute("DELETE FROM students WHERE id = ?", (student_id,))
        conn.commit()
    publish("student.deleted", {"id": row["id"], "email": row["email"], "owner": user["username"]})

# ---------- notification-service/worker.py ----------
import json
import logging
import os
import socket
import time

import redis

logging.basicConfig(level=logging.INFO, format="%(asctime)s %(message)s")
log = logging.getLogger("notifications")

REDIS_URL = os.getenv("REDIS_URL", "redis://redis:6379/0")
STREAM = "student-events"
GROUP = "notifications"
CONSUMER = socket.gethostname()                       # every worker copy has its own name

broker = redis.Redis.from_url(REDIS_URL, decode_responses=True)
seen = set()                                          # ids already handled (use Redis or a DB in real life)


def ensure_group():
    try:
        broker.xgroup_create(STREAM, GROUP, id="0", mkstream=True)
    except redis.ResponseError as error:
        if "BUSYGROUP" not in str(error):             # the group already exists: fine
            raise


def handle(message_id: str, event_type: str, data: dict) -> None:
    if message_id in seen:                            # at-least-once delivery: skip duplicates
        return
    if event_type == "student.created":
        log.info("Sending WELCOME e-mail to %s (student %s)", data["email"], data["name"])
    elif event_type == "student.deleted":
        log.info("Sending GOODBYE e-mail to %s", data["email"])
    seen.add(message_id)


def main():
    log.info("Notification worker %s started", CONSUMER)
    while True:
        try:
            ensure_group()
            batches = broker.xreadgroup(GROUP, CONSUMER, {STREAM: ">"}, count=10, block=5000)
            for _stream, messages in batches or []:
                for message_id, fields in messages:
                    handle(message_id, fields["type"], json.loads(fields["data"]))
                    broker.xack(STREAM, GROUP, message_id)      # acknowledge AFTER handling
        except redis.RedisError as error:
            log.warning("Broker problem (%s). Retrying in 3 seconds...", error)
            time.sleep(3)


if __name__ == "__main__":
    main()

events {}

http {
  # Which browser origins may call us (the frontends in development)
  map $http_origin $cors_origin {
    default "";
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
    "http://localhost:4200" $http_origin;
    "http://127.0.0.1:4200" $http_origin;
  }

  server {
    listen 80;

    # CORS for every response, and an instant answer to browser pre-flight requests
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # Accounts -> auth service
    location ~ ^/(register|login|me)$ {
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth:8001;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }

    # Students -> student service
    location ~ ^/(students|stats) {
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://students:8002;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }

    # Optional: serve a built frontend (mount its dist folder at /usr/share/nginx/html)
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
