149:{l:"J6",t:"Capstone Step 5: Run, Test and Level Up",s:"Start the server, try it in /docs, test with curl, and write an automatic test.",k:["Run: <code>fastapi dev main.py</code>, open <code>/docs</code>, click <b>Authorize</b>, and log in.","Try on purpose: no token (401), wrong password (401), age 200 (422), duplicate email (409), someone else's student (404).","<b>Level up:</b> refresh tokens, admin role, PostgreSQL, Docker, deploy on Render or Railway, and a React frontend.","Put the project on GitHub (without the .db file and without secrets) as a portfolio project."],q:"Name two things to improve before using this in production.",a:"Examples: a strong secret key in an environment variable, HTTPS, PostgreSQL, rate limiting."}
,
150:{l:"R1",t:"JavaScript Essentials for React",s:"React is written in JavaScript, so you need a few JavaScript tools first. These are the ones you will use every day in React.",e:"Before driving a car you learn the clutch, brake and gear. These are the clutch, brake and gear of React.",k:["<b>const</b> for values that don't change, <b>let</b> for values that do. Avoid <code>var</code>.","<b>Arrow functions:</b> <code>(a, b) =&gt; a + b</code>.","<b>Destructuring</b> <code>const {name} = student</code> and <b>spread</b> <code>{...student, marks: 95}</code> copy and change objects without editing the original.","<b>map, filter, reduce</b> work on arrays. React uses <code>map</code> to show lists.","<b>async/await</b> waits for slow things like network calls. <b>Template strings</b> use backticks: <code>`Hi ${name}`</code>.","<b>Modules:</b> <code>export</code> in one file and <code>import</code> in another."],q:"What does [1,2,3].map(n =&gt; n * 2) give?",a:"[2, 4, 6]"},
151:{l:"R2",t:"What is React? Setting Up with Vite",s:"React is a JavaScript library for building user interfaces from small reusable pieces called components. When data changes, React updates only the part of the page that needs it, so apps feel fast.",e:"A page built with LEGO. A button, a card and a menu are separate bricks. You build each brick once and use it many times.",f:["Install Node.js","npm create vite","npm install","npm run dev","Open localhost:5173"],k:["Install <b>Node.js</b> from nodejs.org. It comes with <code>npm</code>.","<b>Vite</b> is a fast tool that creates the project and runs a live-reload server.","Key files: <code>index.html</code> (one empty page), <code>src/main.jsx</code> (starts React), <code>src/App.jsx</code> (your first component).","<b>Single Page App:</b> the browser loads one page and React changes what you see, without reloading."],q:"What command starts the Vite dev server?",a:"npm run dev"},
152:{l:"R3",t:"JSX and Components",s:"JSX lets you write HTML-like code inside JavaScript. A component is a function that returns JSX, and its name starts with a capital letter.",e:"A component is a rubber stamp. Design it once, then stamp it as many times as you like.",k:["Put JavaScript inside JSX with curly braces: <code>{2 + 3}</code>.","Use <code>className</code> instead of <code>class</code>.","A component must return <b>one</b> parent element (use a <code>div</code> or an empty <code>&lt;&gt;...&lt;/&gt;</code>).","Close every tag, like <code>&lt;img /&gt;</code> and <code>&lt;Welcome /&gt;</code>."],q:"Why must component names start with a capital letter?",a:"React uses it to tell your components apart from normal HTML tags."},
153:{l:"R4",t:"Props and Lists",s:"Props are the inputs of a component, like the arguments of a function. To show many items, use map() and give each one a unique key.",e:"A ID-card printing machine: you give it a name and photo (props) and it prints a card. Different input, different card.",k:["Props flow <b>down</b> from parent to child and are <b>read-only</b>.","<code>{ name, marks }</code> in the parameters pulls props out directly.","<code>key</code> helps React track each list item. Use a unique id, not the index.","Conditional rendering: <code>{ok ? 'Yes' : 'No'}</code> or <code>{show &amp;&amp; &lt;p&gt;Hi&lt;/p&gt;}</code>."],q:"Why does every list item need a key?",a:"So React can tell which item changed, moved or was removed."},
154:{l:"R5",t:"State with useState",s:"State is a component's memory. When state changes, React draws the component again with the new value.",e:"A scoreboard. When the score changes, the board updates itself. You don't repaint the whole stadium.",k:["<code>const [count, setCount] = useState(0)</code> gives the value and a function to change it.","<b>Never</b> change state directly (<code>count = 5</code> won't work). Always use the setter.","For arrays and objects, make a new copy: <code>setList([...list, item])</code>.","Props come from outside. State lives inside."],q:"Why not write count = count + 1 directly?",a:"React wouldn't know the value changed, so the screen would not update. Use setCount."},
155:{l:"R6",t:"Events and Forms",s:"Events like clicks and typing call your functions. In a controlled form, React state is the single source of truth for what is in each input.",e:"A teacher who writes down every word you say. The input box always shows exactly what React remembers.",k:["<code>onClick</code>, <code>onChange</code>, <code>onSubmit</code> are the common events.","Controlled input: <code>value={x}</code> plus <code>onChange={(e) =&gt; setX(e.target.value)}</code>.","<code>e.preventDefault()</code> stops the browser from reloading the page on submit.","Show errors from state so the user knows what to fix."],q:"What does e.preventDefault() do in a form submit?",a:"It stops the page from reloading, so React can handle the form itself."},
156:{l:"R7",t:"useEffect: Doing Things After Render",s:"useEffect runs code after the component appears or when some value changes. It is used for timers, titles and loading data.",e:"After you set the table, you ring the bell for dinner. The bell is the effect, and it happens after the setup.",k:["<code>useEffect(() =&gt; {...}, [])</code> with an empty list runs <b>once</b>.","<code>[search]</code> runs again whenever <code>search</code> changes.","Return a function to clean up (stop a timer, remove a listener).","Don't put an <code>async</code> directly on the effect. Create an async function inside and call it."],q:"When does useEffect(fn, []) run?",a:"Once, when the component first appears."},
157:{l:"R8",t:"Fetching Data from an API",s:"Now React talks to a server. We fetch data in useEffect, and keep three pieces of state: the data, loading and error.",f:["Component appears","fetch() the API","Show 'Loading...'","Show data or error"],k:["<code>fetch</code> returns a promise. Use <code>await res.json()</code> to read the answer.","Always check <code>res.ok</code>, because fetch does not throw on 404 or 500.","Send JSON with <code>method</code>, <code>headers</code> and <code>JSON.stringify(body)</code>.","For your FastAPI, add <b>CORS</b> on the server, otherwise the browser blocks the call."],q:"Does fetch throw an error on a 404?",a:"No. You must check res.ok yourself."},
158:{l:"R9",t:"More Hooks: useRef, useMemo and Custom Hooks",s:"A few extra hooks make your apps smoother, and you can package your own logic into custom hooks.",k:["<b>useRef:</b> a box that keeps a value or an HTML element without redrawing (for example to focus an input).","<b>useMemo:</b> remembers a calculated result until its inputs change.","<b>Custom hook:</b> a function whose name starts with <code>use</code> and which uses other hooks. It lets you reuse logic.","Hooks rules: call them at the top of a component, never inside if or loops."],q:"What makes a function a custom hook?",a:"Its name starts with 'use' and it calls other hooks inside."},
159:{l:"R10",t:"React Router: Many Pages",s:"React Router gives your single-page app several 'pages' with their own URLs, without reloading.",e:"A mall directory: one building, many shops. The URL decides which shop (component) you see.",k:["Install: <code>npm install react-router-dom</code>.","<code>Routes</code> and <code>Route</code> match the URL to a component. <code>Link</code> moves without a page reload.","<code>useNavigate()</code> changes the page from code. <code>Navigate</code> redirects.","<b>Protected route:</b> a wrapper that redirects to /login when there is no token.","<b>HashRouter</b> keeps the route after a # (like /#/login). It is easy to host inside FastAPI."],q:"Which component moves between pages without reloading?",a:"Link (or useNavigate in code)."},
160:{l:"R11",t:"Context: Sharing Data Everywhere",s:"Context lets many components use the same data (like the logged-in user) without passing props through every level.",e:"The school PA system. One announcement reaches every classroom, and you don't carry the message from room to room.",k:["<code>createContext()</code>, a <code>Provider</code> that holds the data, and <code>useContext()</code> to read it.","Perfect for login state, theme and language.","Wrap your app in the provider, at the top."],q:"What problem does Context solve?",a:"Passing the same data through many levels of components (prop drilling)."},
161:{l:"RC1",t:"Capstone: React Frontend for the Student API (Plan)",s:"The final project joins everything: a React app that logs in to your FastAPI Student API with a JWT and then adds, searches, edits and deletes students. In the end, FastAPI serves the React app too, so it all runs from one server.",e:"The terminal menu became a website, and the FastAPI you built is its brain.",f:["React (browser)","fetch + Bearer token","FastAPI","SQLite"],x:tb([["File","Job"],["src/api.js","One helper for all server calls and errors"],["src/AuthContext.jsx","Keeps the token and has login and logout"],["src/pages/Login.jsx","Login and register form"],["src/pages/Dashboard.jsx","Table, search, stats, delete"],["src/components/StudentForm.jsx","Add and edit form"],["src/App.jsx and main.jsx","Routes and the protected route"]]),k:["<b>Step 0:</b> add CORS to your FastAPI so the browser lets React call it.","Keep your Student API from the FastAPI capstone running on port 8000.","React routes avoid /students, /me and /stats, so they never clash with the API paths."],q:"Why do we add CORS to FastAPI?",a:"React runs on port 5173 and the API on 8000. The browser blocks this unless the API allows it."},
162:{l:"RC2",t:"Capstone Step 1: api.js and AuthContext.jsx",s:"Two small files do the heavy lifting: one helper for every server call, and one context that keeps the login token.",k:["<code>request()</code> adds the token, converts JSON and turns server errors into readable messages. FastAPI's 422 errors come as a list, so we join them.","Login must be sent as <b>form data</b> (<code>URLSearchParams</code>) because OAuth2PasswordRequestForm expects it.","The token is saved in <code>localStorage</code> so a refresh does not log you out. For high security apps, httpOnly cookies are safer."],q:"Why is the login sent as form data and not JSON?",a:"FastAPI's OAuth2PasswordRequestForm reads form fields."},
163:{l:"RC3",t:"Capstone Step 2: The Login and Register Page",s:"One form that switches between Log in and Register. After a successful login, it goes to the dashboard.",k:["<code>mode</code> state switches the form between login and register.","<code>busy</code> disables the button while waiting.","Server errors (wrong password, taken username) show on the screen."],q:"What does the busy state prevent?",a:"Pressing the button again while the request is still running."},
164:{l:"RC4",t:"Capstone Step 3: The Dashboard",s:"The main screen: statistics, a search box and a table of the logged-in user's students with Edit and Delete buttons.",k:["<code>useEffect</code> with <code>[search]</code> reloads the list when the search text changes.","On a <b>401</b> response, we log out, because the token has expired.","Delete asks for confirmation first.","Clicking Edit puts that student into the form."],q:"What happens if the API answers 401?",a:"The app logs the user out and shows the login page."},
165:{l:"RC5",t:"Capstone Step 4: The Student Form (Add and Edit)",s:"One form that works for both adding a new student (POST) and editing an existing one (PATCH).",k:["If <code>editing</code> has a student, we call PATCH, otherwise POST.","The form fills itself when you click Edit, using <code>useEffect</code>.","Number fields are converted with <code>Number()</code> before sending.","Pydantic errors from FastAPI (like age 200) show right under the form."],q:"How does one form do both add and edit?",a:"It checks whether a student is being edited and chooses PATCH or POST."},
166:{l:"RC6",t:"Capstone Step 5: Routes, Protected Page and Run",s:"Connect the pieces: wrap the app in the router and AuthProvider, protect the dashboard, add a little CSS and run both servers.",f:["Terminal 1: fastapi dev main.py","Terminal 2: npm run dev","Open localhost:5173","Register, log in, add students"],k:["<b>Protected</b> redirects to /login when there is no token.","Test on purpose: wrong password, short password, age 200, duplicate email, and log in as a second user to see that students are separate."],q:"Which two servers must run during development?",a:"FastAPI (port 8000) and the Vite dev server (port 5173)."},
167:{l:"RC7",t:"Capstone Step 6: Build and Serve React from FastAPI",s:"For the final version, build React into plain files and let FastAPI serve them. Now one server runs the whole application, and no CORS is needed because both are on the same address.",f:["npm run build","dist/ folder","FastAPI mounts dist","One server on port 8000"],k:["Mount the files <b>after</b> all API routes, otherwise they would hide the routes.","This is why we used <b>HashRouter</b>: refreshing /#/dashboard still works with simple static hosting.","<b>Level up:</b> deploy on Render or Railway, use PostgreSQL, add refresh tokens, Docker, or TypeScript.","Put both folders on GitHub without .env files, .db files and node_modules."],q:"Why do we mount the React build at the end of main.py?",a:"FastAPI checks routes in order. Mounting last keeps the API routes working."}
,
170:{l:"V1",t:"What is Vue.js? Setting Up with Vite",s:"Vue is a friendly JavaScript framework for building user interfaces. You write each piece of the page as a component in one file with three parts: template (HTML), script (logic) and style (CSS). When your data changes, Vue updates the page automatically.",e:"A Vue component is a single labelled box that holds everything about one part of the page: how it looks, how it works and how it is styled.",x:tb([["","React","Vue"],["Markup","JSX (HTML inside JavaScript)","Template (normal HTML with special attributes)"],["Update data","setCount(count + 1)","count++ (Vue notices by itself)"],["File","Usually a .jsx function","One .vue file with template, script and style"],["Learning curve","Needs more JavaScript knowledge","Often easier for beginners"]]),f:["Install Node.js","npm create vite (vue)","npm install","npm run dev","Open localhost:5173"],k:["Vue 3 with <code>&lt;script setup&gt;</code> is the modern, short way to write components.","Key files: <code>index.html</code>, <code>src/main.js</code> (starts Vue) and <code>src/App.vue</code> (your first component).","Revise the JavaScript essentials lesson (R1) first. It is the same for Vue."],q:"What are the three parts of a .vue file?",a:"template, script and style."},
171:{l:"V2",t:"Templates: Interpolation, Binding, v-if and v-for",s:"The template is HTML with a few special powers. Double curly braces show values, a colon binds an attribute, and v-if and v-for decide what to show.",e:"A mail-merge letter: 'Dear {{ name }}' is replaced with each person's real name.",k:["<code>{{ value }}</code> shows a variable or small expression.","<code>:src='url'</code> (short for <code>v-bind:src</code>) sets an attribute from a variable.","<code>v-if / v-else-if / v-else</code> add or remove elements. <code>v-show</code> only hides them with CSS.","<code>v-for='s in students' :key='s.id'</code> repeats an element. Always give a unique <code>key</code>.","<code>:class='{ fail: s.marks &lt; 35 }'</code> adds a class only when the condition is true."],q:"What does the colon in :src='url' mean?",a:"It binds the attribute to a JavaScript value instead of plain text."},
172:{l:"V3",t:"Reactivity: ref, reactive and computed",s:"Reactive data is data that Vue watches. Change it, and every place that uses it updates on its own.",e:"An Excel sheet. Change one cell and the total updates by itself. A computed value is the total cell.",k:["<code>ref(0)</code> holds one value. In JavaScript use <code>count.value</code>, in the template just <code>count</code>.","<code>reactive({...})</code> makes a whole object reactive, with no <code>.value</code> needed.","<code>computed(() =&gt; ...)</code> is a value calculated from other values. It is cached and recalculated only when its inputs change.","Compare React: there you must call setCount. In Vue you just change the value."],q:"How do you read a ref's value inside script?",a:"With .value, for example count.value."},
173:{l:"V4",t:"Events and Forms (v-on and v-model)",s:"@ listens for events like clicks. v-model links an input and a variable in both directions, which makes forms very short.",e:"A walkie-talkie: what you type in the input is instantly known by the variable, and if the variable changes, the input shows it.",k:["<code>@click='save'</code> is short for <code>v-on:click</code>.","<code>@submit.prevent</code> stops the page reload on submit.","<code>v-model='name'</code> is the two-way link. <code>v-model.number</code> converts the text to a number.","Other modifiers: <code>.trim</code>, <code>.enter</code> (like <code>@keyup.enter</code>)."],q:"What does @submit.prevent do?",a:"It handles the submit event and stops the browser from reloading the page."},
174:{l:"V5",t:"Components, Props and Emits",s:"Break the page into small components. Props send data down to a child, and emits let the child tell the parent that something happened.",e:"A manager gives a worker a task sheet (props). When the work is done, the worker rings a bell (emit).",k:["<code>defineProps({...})</code> declares what a component accepts.","<code>defineEmits(['remove'])</code> declares the events it can send.","Parent listens with <code>@remove='...'</code>.","Props go <b>down</b>, events go <b>up</b>. A child must not change its props directly."],q:"How does a child tell its parent that a button was clicked?",a:"By emitting an event, which the parent listens for with @."},
175:{l:"V6",t:"Watchers and Lifecycle Hooks",s:"A watcher runs code when a value changes. Lifecycle hooks run code at special moments, like when a component appears or disappears.",e:"A watcher is a security guard who reacts whenever a door opens. onMounted is the opening ceremony of a shop.",k:["<code>onMounted</code> runs when the component has appeared. It is the usual place to load data.","<code>onUnmounted</code> runs when it is removed. Use it to clean up timers.","<code>watch(name, (newValue) =&gt; {...})</code> reacts to one value changing.","<code>watchEffect</code> reruns automatically for every reactive value it uses."],q:"Where do you usually load data for a component?",a:"In onMounted."},
176:{l:"V7",t:"Fetching Data from an API",s:"We load data in onMounted and keep three pieces of state: the data, loading and error. The template then shows the right one using v-if.",f:["Component mounted","fetch() the API","Show Loading...","Show data or error"],k:["Always check <code>res.ok</code>, since <code>fetch</code> does not throw on 404 or 500.","Send JSON using <code>method</code>, <code>headers</code> and <code>JSON.stringify</code>.","With your FastAPI, the server must allow your site through <b>CORS</b>.","Chain <code>v-if</code>, <code>v-else-if</code> and <code>v-else</code> for the three states."],q:"What are the three states of a data-loading screen?",a:"Loading, error, and data."},
177:{l:"V8",t:"Composables and Slots",s:"A composable is a function that packages reactive logic so you can reuse it in many components. Slots let a parent put its own content inside a child component.",e:"A composable is a spare kit you can plug into any machine. A slot is the empty frame on a photo frame component where you put your own picture.",k:["Name composables starting with <b>use</b>: <code>useLocalStorage</code>.","Inside, use <code>ref</code>, <code>watch</code> and other Vue tools, then return what you need.","<code>&lt;slot /&gt;</code> marks the place for content. <b>Named slots</b> use <code>&lt;template #title&gt;</code>."],q:"What is a composable?",a:"A reusable function that holds reactive logic, usually named useSomething."},
178:{l:"V9",t:"Vue Router: Many Pages",s:"Vue Router gives your single-page app several pages with their own URLs, without reloading.",e:"A mall directory. One building, many shops. The URL says which shop you enter.",k:["Install: <code>npm install vue-router</code>.","<code>router-link</code> moves between pages. <code>router-view</code> is where the page shows.","<code>useRouter().push('/login')</code> changes the page from code.","<b>Navigation guard:</b> <code>router.beforeEach</code> can redirect to /login when there is no token.","<code>createWebHashHistory()</code> keeps routes after a #, which is easy to host inside FastAPI."],q:"Which function runs before every page change and can block it?",a:"router.beforeEach, a navigation guard."},
179:{l:"V10",t:"Pinia: Shared State",s:"Pinia is Vue's official store. It keeps data (like the logged-in user's token) in one place, so any component can use it.",e:"The school notice board. Every class can read it, and the office updates it in one place.",k:["Install: <code>npm install pinia</code> and add it with <code>app.use(createPinia())</code>.","<code>defineStore('name', () =&gt; {...})</code> returns state (<code>ref</code>), getters (<code>computed</code>) and actions (functions).","Use it in any component with <code>const cart = useCartStore()</code>.","Perfect for login state, a shopping cart and settings."],q:"What problem does Pinia solve?",a:"Sharing the same data between many components without passing props through every level."},
180:{l:"VC1",t:"Capstone: Vue Frontend for the Student API (Plan)",s:"The same Student API, now with a Vue frontend. It logs in with a JWT and lets you add, search, edit and delete students. At the end FastAPI serves the Vue app too, so one server runs everything.",e:"Same brain (FastAPI), a different face (Vue). You can build either face, or both, for the same API.",f:["Vue (browser)","fetch + Bearer token","FastAPI","SQLite"],x:tb([["File","Job"],["src/api.js","One helper for all server calls and errors"],["src/stores/auth.js","Pinia store with the token, login and logout"],["src/router.js","Pages and the login guard"],["src/views/LoginView.vue","Login and register"],["src/views/DashboardView.vue","Table, search, stats, delete"],["src/components/StudentForm.vue","Add and edit form"],["src/main.js and App.vue","Start the app"]]),k:["The backend needs the <b>CORS</b> change from the React capstone (same code, Vite uses port 5173 too). If you already added it, skip that step.","Keep the Student API from the FastAPI capstone running on port 8000.","Page names avoid /students, /me and /stats, so they never clash with the API."],q:"Does the backend have to change for Vue instead of React?",a:"No. The API is the same. Only the CORS setting is needed once for any browser app."},
181:{l:"VC2",t:"Capstone Step 1: api.js and the Auth Store",s:"A single helper does every server call. A Pinia store keeps the token and offers login and logout.",k:["<code>api.js</code> is plain JavaScript and works exactly like the React version, because it does not depend on the framework.","Login is sent as <b>form data</b>, because FastAPI's OAuth2PasswordRequestForm reads form fields.","The token is saved in <code>localStorage</code> so a refresh does not log you out. httpOnly cookies are safer for production apps."],q:"Why can the same api.js work for both React and Vue?",a:"It is plain JavaScript with no framework code inside."},
182:{l:"VC3",t:"Capstone Step 2: Router, main.js and App.vue",s:"Set up the pages and a guard that sends people to the login page if they have no token.",k:["<code>meta: { requiresAuth: true }</code> marks protected pages.","The guard runs before every navigation and returns <code>'/login'</code> if the token is missing.","<b>Pinia must be installed before the router</b>, because the guard uses the store."],q:"Why use createWebHashHistory here?",a:"Page addresses like /#/dashboard work with simple static hosting inside FastAPI, even after a refresh."},
183:{l:"VC4",t:"Capstone Step 3: LoginView.vue",s:"One form that switches between Log in and Register, then moves to the dashboard.",k:["<code>mode</code> switches between login and register.","<code>busy</code> disables the button while the request is running.","Server errors, like a wrong password, appear on screen."],q:"What does the busy flag prevent?",a:"Clicking the button again while the request is still running."},
184:{l:"VC5",t:"Capstone Step 4: DashboardView.vue",s:"The main screen: stats, search, and a table of the logged-in user's students with Edit and Delete.",k:["<code>onMounted(load)</code> loads data on arrival. <code>watch(search, load)</code> reloads when the search text changes.","On a <b>401</b> reply, the user is logged out and sent to the login page.","Edit sets <code>editing</code>, which the form receives as a prop."],q:"What reloads the list when the search text changes?",a:"watch(search, load)"},
185:{l:"VC6",t:"Capstone Step 5: StudentForm.vue and Styling",s:"One form handles both adding (POST) and editing (PATCH). A short stylesheet makes the app look neat.",k:["The form receives <code>editing</code> as a prop and tells the parent with <code>emit('saved')</code>.","<code>watch(() =&gt; props.editing, ..., { immediate: true })</code> fills the form when Edit is clicked.","FastAPI's validation errors (like age 200) are shown under the form."],q:"How does the form know whether to add or edit?",a:"If the editing prop has a student, it sends PATCH, otherwise POST."},
186:{l:"VC7",t:"Capstone Step 6: Run, Build and Serve from FastAPI",s:"Run Vue and FastAPI together while developing. For the final version, build Vue and let FastAPI serve it from the same address.",f:["Terminal 1: fastapi dev main.py","Terminal 2: npm run dev","Test in localhost:5173","npm run build","FastAPI mounts dist"],k:["Test on purpose: wrong password, short password, age 200, duplicate email, and a second user to see separate data.","Mount the files <b>after</b> all API routes in <code>main.py</code>.","Only one app can be mounted at <code>/</code>. Choose either the React dist or the Vue dist, or mount them at <code>/react</code> and <code>/vue</code>.","<b>Level up:</b> TypeScript, Docker, deploy on Render or Railway, PostgreSQL, refresh tokens."],q:"Why must the mount line be at the end of main.py?",a:"FastAPI checks routes in order, and mounting last keeps the API routes working."}
,
190:{l:"A1",t:"What is Angular? Setting Up with the Angular CLI",s:"Angular is a complete framework from Google for building big, well-organised web apps. It uses TypeScript (JavaScript with types) and comes with routing, forms and HTTP calls built in, so you don't need to pick many extra libraries.",e:"React and Vue are like a toolbox where you choose your own tools. Angular is a fully equipped workshop: everything is already there and arranged in a standard way.",x:tb([["","React","Vue","Angular"],["Type","Library","Framework","Complete framework"],["Language","JavaScript / JSX","JavaScript (templates)","TypeScript (templates)"],["Routing, forms, HTTP","Add libraries","Add libraries","Built in"],["Best for","Flexible apps","Beginners, small to mid apps","Large team and company apps"]]),f:["Install Node.js","npm install -g @angular/cli","ng new","ng serve","Open localhost:4200"],k:["This course uses modern Angular (version 19 and newer): <b>standalone components</b>, <b>signals</b> and the new <code>@if</code> / <code>@for</code> syntax.","In Angular 20 and newer the CLI names files like <code>app.ts</code> and the class <code>App</code>. Older versions use <code>app.component.ts</code> and <code>AppComponent</code>. The code works the same.","<code>ng new</code> asks a few questions. Choose CSS for styles and say <b>No</b> to server-side rendering."],q:"Which command starts the Angular dev server?",a:"ng serve"},
191:{l:"A2",t:"TypeScript Essentials for Angular",s:"TypeScript is JavaScript plus types. You say what kind of value each variable holds, and the editor catches mistakes before you even run the code.",e:"A form with boxes labelled 'number only' and 'text only'. You cannot write your name in the age box.",k:["Basic types: <code>string</code>, <code>number</code>, <code>boolean</code>, and arrays like <code>number[]</code>.","An <b>interface</b> describes the shape of an object. <code>email?: string</code> means optional.","<b>Union types</b> like <code>'login' | 'register'</code> allow only the listed values.","<b>Classes</b> hold data and methods. <code>private</code> hides things from outside.","<b>Decorators</b> like <code>@Component</code> are labels that tell Angular what a class is.","Revise the JavaScript essentials lesson (R1). Everything there works in TypeScript."],q:"What does the ? in email?: string mean?",a:"The email property is optional."},
192:{l:"A3",t:"Components and Templates",s:"A component is a class (the logic) with an HTML template (the look). Angular connects them with three kinds of binding.",e:"A remote control: the screen shows what is happening (interpolation), you press buttons (event binding), and settings are sent to the TV (property binding).",x:tb([["Syntax","Name","Use"],["{{ title }}","Interpolation","Show a value"],["[src]='url'","Property binding","Set an element property from a variable"],["(click)='save()'","Event binding","Run a method on an event"],["[(ngModel)]='x'","Two-way binding","Input and variable stay in sync"]]),k:["<code>selector</code> is the tag name, like <code>&lt;app-root&gt;</code>.","<code>templateUrl</code> points to an HTML file. <code>template</code> holds HTML inside the class.","Generate with <code>ng generate component name</code> (or <code>ng g c name</code>)."],q:"Which brackets are used for property binding?",a:"Square brackets, like [src]='imageUrl'."},
193:{l:"A4",t:"Signals: Reactive State",s:"A signal is a box that holds a value and tells Angular when it changes, so only the parts of the page that use it are updated.",e:"An Excel cell. Change the number and every formula that depends on it recalculates.",k:["<code>count = signal(0)</code> creates it. Read it by <b>calling it</b>: <code>count()</code>.","<code>set(5)</code> replaces the value. <code>update(c =&gt; c + 1)</code> changes it using the old value.","<code>computed(() =&gt; ...)</code> is a value calculated from other signals.","<code>effect(() =&gt; ...)</code> runs code whenever the signals it reads change.","For lists, always make a new array: <code>update(l =&gt; [...l, item])</code>.","Use signals for any state that changes after waiting (like data from a server)."],q:"How do you read a signal's value in a template?",a:"Call it with brackets, like {{ count() }}."},
194:{l:"A5",t:"Control Flow and Pipes",s:"@if, @for and @switch decide what appears on the page. Pipes change how a value is displayed, for example upper case or a formatted date.",e:"@for is a printing machine that makes one card for every student. A pipe is a filter on a camera that changes the look of the photo but not the photo itself.",k:["<code>&#64;if (x) {...} &#64;else {...}</code> shows or hides content.","<code>&#64;for (s of students(); track s.id) {...} &#64;empty {...}</code> repeats. <b>track</b> is required: use a unique id.","<code>&#64;switch</code> picks one of many cases.","Pipes: <code>{{ name | uppercase }}</code>, <code>{{ today | date:'dd MMM yyyy' }}</code>, <code>{{ fee | currency:'INR' }}</code>.","Import each pipe you use in the component's <code>imports</code> list."],q:"Why does @for need track?",a:"So Angular can tell which item is which and update only the ones that changed."},
195:{l:"A6",t:"Components Talking: input() and output()",s:"A parent sends data down with input(). A child sends news up with output().",e:"A manager gives a worker a task sheet (input). When the work is done, the worker rings a bell (output).",k:["<code>name = input.required&lt;string&gt;()</code> must be given by the parent. <code>marks = input(0)</code> has a default.","Read inputs like signals: <code>name()</code>.","<code>remove = output&lt;void&gt;()</code> and <code>remove.emit()</code> send an event.","Parent: <code>[name]='s.name'</code> and <code>(remove)='removeStudent(s.id)'</code>."],q:"How does a child tell the parent that a button was clicked?",a:"It emits an output event, and the parent listens with (eventName)."},
196:{l:"A7",t:"Forms: Template-Driven and Reactive",s:"Angular has two ways to build forms. Template-driven forms are quick and use ngModel. Reactive forms are code-based and suit big, complex forms.",e:"Template-driven is filling a form by hand. Reactive is a form that is built and checked by a machine.",k:["Import <code>FormsModule</code>. Use <code>[(ngModel)]='nameSignal'</code> with a <code>name</code> attribute.","Built-in checks: <code>required</code>, <code>minlength</code>, <code>min</code>, <code>max</code>.","<code>#f='ngForm'</code> gives you <code>f.valid</code>. <code>(ngSubmit)</code> handles the submit.","Reactive forms use <code>FormBuilder</code>, <code>Validators</code> and <code>formControlName</code>.","Newer Angular also has experimental Signal Forms."],q:"Which module do you import for ngModel?",a:"FormsModule from @angular/forms."},
197:{l:"A8",t:"Services and Dependency Injection",s:"A service is a class that holds shared logic or data. Angular creates it once and hands it to any component that asks for it. This is dependency injection.",e:"A school library. There is one library and every class borrows from it. No class builds its own.",k:["<code>&#64;Injectable({ providedIn: 'root' })</code> makes one shared copy for the whole app.","Ask for it with <code>cart = inject(CartService)</code>.","Put API calls and shared state in services, and keep components thin.","Services can use other services."],q:"What does providedIn: 'root' do?",a:"It creates one shared instance of the service for the whole app."},
198:{l:"A9",t:"HttpClient: Talking to an API",s:"HttpClient is Angular's tool for calling servers. Add it once with provideHttpClient(), then use it inside services.",f:["Component","Service","HttpClient","Interceptor adds the token","FastAPI"],k:["<code>provideHttpClient(withInterceptors([...]))</code> goes in <code>app.config.ts</code>.","<code>http.get&lt;Post[]&gt;(url)</code> returns an <b>Observable</b>. Use <code>.subscribe(...)</code> or <code>await firstValueFrom(...)</code>.","An <b>interceptor</b> is a function that sees every request. It is the perfect place to add the JWT token.","Errors come as <code>HttpErrorResponse</code>. FastAPI's message is in <code>err.error.detail</code>.","Your FastAPI must allow <code>http://localhost:4200</code> in CORS."],q:"Where do you add the JWT token to every request?",a:"In an HTTP interceptor."},
199:{l:"A10",t:"RxJS Basics: Observables",s:"An Observable is a stream of values over time. RxJS gives you operators to change, combine and control these streams. Angular's HttpClient uses them.",e:"A water pipe. Water (data) keeps flowing, and operators are filters and valves on the pipe.",k:["A name ending with <b>$</b> usually means an Observable, like <code>posts$</code>.","<code>pipe(map(...), filter(...))</code> chains operators.","<b>Live search:</b> <code>debounceTime(400)</code> waits until the user stops typing. <code>switchMap</code> cancels the older request when a new one starts.","<code>toSignal()</code> and <code>toObservable()</code> convert between Signals and Observables."],q:"Which operator waits until the user stops typing?",a:"debounceTime."},
200:{l:"A11",t:"Routing, Guards and Lazy Loading",s:"The Angular Router shows different components for different URLs, without reloading the page. Guards decide who may enter a page.",e:"A mall directory with a security guard at one shop door. Only people with the right pass can enter.",k:["Routes are a list: <code>{ path: 'about', component: About }</code>.","<code>routerLink</code> moves between pages and <code>&lt;router-outlet /&gt;</code> shows the page.","Read a URL value with <code>route.snapshot.paramMap.get('id')</code>. Change page in code with <code>router.navigate(['/about'])</code>.","<b>Guard:</b> a function (<code>CanActivateFn</code>) that returns true or a redirect.","<b>Lazy loading:</b> <code>loadComponent: () =&gt; import(...)</code> loads a page only when it is visited.","<code>withHashLocation()</code> keeps routes after a # and is easy to host inside FastAPI."],q:"What does a route guard return to allow entry?",a:"true. To block, it returns false or a redirect to another page."},
201:{l:"AC1",t:"Capstone: Angular Frontend for the Student API (Plan)",s:"The same Student API with an Angular frontend: log in with a JWT, then add, search, edit and delete students. At the end, FastAPI serves the Angular app too.",e:"Same brain (FastAPI), a third face (Angular). The API doesn't change.",f:["Angular (browser)","HttpClient + interceptor","FastAPI","SQLite"],x:tb([["File","Job"],["api.ts and models.ts","API address, error text, data types"],["auth.service.ts","Token (signal), login, register, logout"],["auth.interceptor.ts","Adds the token, logs out on 401"],["auth.guard.ts","Blocks the dashboard without a token"],["student.service.ts","All student API calls"],["app.config.ts, app.routes.ts, app.ts","Settings, pages, root component"],["pages/login, pages/dashboard","The two screens"],["student-form","Add and edit form"]]),k:["<b>Step 0:</b> the backend CORS must also allow <code>http://localhost:4200</code> (Angular's port).","Keep your Student API running on port 8000.","The capstone uses signals for all state, so it works in zoneless Angular too."],q:"Which new origin must CORS allow for Angular?",a:"http://localhost:4200"},
202:{l:"AC2",t:"Capstone Step 1: Models, API Helper and Auth Service",s:"The foundation: data types, the API address, a helper that turns server errors into readable text, and the AuthService that keeps the token in a signal.",k:["<code>isDevMode()</code> is true during <code>ng serve</code>, so we call the API on port 8000. In a production build the address is empty, meaning the same server.","Login is sent as <b>form data</b> with <code>HttpParams</code>, as FastAPI's OAuth2PasswordRequestForm expects.","The token is saved in <code>localStorage</code>. httpOnly cookies are safer for production."],q:"Why is login sent with HttpParams and not as JSON?",a:"FastAPI's login route reads form fields, not JSON."},
203:{l:"AC3",t:"Capstone Step 2: Interceptor, Guard, Routes and Config",s:"The interceptor adds the token to every request. The guard protects the dashboard. The routes and config tie it all together.",k:["On a <b>401</b> reply (when a token was sent), the interceptor logs out. This handles expired tokens.","The guard returns <code>router.createUrlTree(['/login'])</code> when there is no token.","<code>loadComponent</code> lazy-loads each page.","Add the new lines to the existing providers. Keep what the CLI already generated."],q:"What does the interceptor do when the server answers 401?",a:"It logs the user out, which sends them back to the login page."},
204:{l:"AC4",t:"Capstone Step 3: The Login Page",s:"One form that switches between Log in and Register, then goes to the dashboard.",k:["Every field is a <b>signal</b> with <code>[(ngModel)]</code>.","<code>busy</code> disables the button while waiting.","Server errors show on the screen."],q:"Why is every field a signal?",a:"Signals update the screen correctly after async work, in both normal and zoneless Angular."},
205:{l:"AC5",t:"Capstone Step 4: Student Service and Dashboard",s:"The StudentService holds all API calls. The dashboard shows stats, search, a table, and Edit and Delete buttons.",k:["<code>&#64;for ... &#64;empty</code> shows a 'No students found' row automatically.","<code>&#64;if (stats(); as s)</code> shows the stats only once they are loaded.","Search reloads the list at every key press. You could add <code>debounceTime</code> from the RxJS lesson.","Clicking Edit puts the student into the form through an input."],q:"Where are all the student API calls kept?",a:"In StudentService, so components stay thin."},
206:{l:"AC6",t:"Capstone Step 5: Student Form and Styling",s:"One form handles both adding (POST) and editing (PATCH), and a short stylesheet makes it neat.",k:["<code>editing = input&lt;Student | null&gt;(null)</code> receives the student from the dashboard.","An <code>effect()</code> fills the form whenever the input changes (writing signals inside effects works in Angular 19 and newer).","<code>saved</code> and <code>cancelled</code> are outputs that tell the dashboard what happened.","FastAPI's validation messages (like age 200) are shown under the form."],q:"How does the form tell the dashboard that saving finished?",a:"It emits the saved output."},
207:{l:"AC7",t:"Capstone Step 6: Run, Build and Serve from FastAPI",s:"Run Angular and FastAPI together while developing. For the final version, build Angular and let FastAPI serve it from the same address.",f:["Terminal 1: fastapi dev main.py","Terminal 2: ng serve","Test in localhost:4200","ng build","FastAPI mounts the browser folder"],k:["Test on purpose: wrong password, short password, age 200, duplicate email, and a second user to see separate data.","The build output is in <code>dist/student-angular/browser</code>.","Mount it <b>after</b> all API routes in main.py. Only one frontend can sit at <code>/</code>, or use <code>/react</code>, <code>/vue</code>, <code>/angular</code>.","<b>Level up:</b> Docker, deploy on Render or Railway, PostgreSQL, refresh tokens, unit tests."],q:"Where does ng build put the files?",a:"In dist/<project-name>/browser."}
,
210:{l:"JV1",t:"What is Java? JDK, JVM and Hello World",s:"Java is a popular, strongly typed programming language used for Android apps, banking systems, big back-ends and more. You write code once, and it runs on any computer that has a Java Virtual Machine (JVM).",e:"Java is like a document written in PDF. The PDF reader (JVM) on each computer shows it correctly, so you don't rewrite the document for Windows, Mac or Linux.",f:["Write Hello.java","javac compiles to bytecode","Hello.class","JVM runs it anywhere"],x:tb([["Name","What it is"],["JDK","Java Development Kit: tools to write and compile (javac) and run (java)"],["JRE","Runtime to run Java programs"],["JVM","The virtual machine that runs bytecode"]]),k:["Install a JDK (Java 21 is a good long-term-support choice) from adoptium.net, then check with <code>java -version</code>.","Every program starts at <code>public static void main(String[] args)</code>.","The file name must match the public class name: <code>Hello.java</code> holds <code>class Hello</code>.","<b>Java 11+:</b> <code>java Hello.java</code> compiles and runs a single file. <b>Java 9+:</b> <code>jshell</code> lets you try code line by line."],q:"What does javac produce?",a:"Bytecode, in a .class file, which the JVM runs."},
211:{l:"JV2",t:"Variables, Data Types and var",s:"A variable is a named box for a value, and in Java every box has a fixed type.",e:"Boxes with labels: a box marked 'whole numbers only' cannot hold your name.",x:tb([["Type","Holds","Example"],["byte, short, int, long","Whole numbers","int age = 15;"],["float, double","Decimals","double price = 99.5;"],["char","One character","char grade = 'A';"],["boolean","true or false","boolean ok = true;"],["String","Text (a class)","String name = &quot;Riya&quot;;"]]),k:["<code>final</code> makes a constant.","<b>Casting:</b> <code>(int) 9.8</code> gives 9. Small to big types convert automatically.","<b>Java 10+:</b> <code>var city = &quot;Delhi&quot;;</code> lets Java guess the type. It works only for local variables.","<code>long</code> numbers end with L, <code>float</code> numbers end with f."],q:"What does (int) 9.8 give?",a:"9. The decimal part is cut off."},
212:{l:"JV3",t:"Operators, Input and Output",s:"Operators calculate and compare. Scanner reads what the user types, and printf prints neatly formatted text.",k:["<b>Arithmetic:</b> <code>+ - * / %</code>. Dividing two ints gives an int: <code>10 / 3</code> is 3.","<b>Comparison:</b> <code>== != &gt; &lt;</code>. <b>Logic:</b> <code>&amp;&amp; || !</code>.","<b>Ternary:</b> <code>a &gt; b ? a : b</code>.","<code>printf</code> codes: <code>%s</code> text, <code>%d</code> whole number, <code>%.1f</code> one decimal, <code>%n</code> new line."],e:"A calculator with a screen: the keys are operators and the screen is System.out.",q:"What is 7 / 2 in Java when both are int?",a:"3. Integer division drops the decimal part."},
213:{l:"JV4",t:"Conditions: if and switch",s:"Conditions let your program make decisions. Use if for ranges and switch for matching exact values.",k:["<code>if / else if / else</code> checks conditions from the top and runs the first true one.","Classic <code>switch</code> needs <code>break</code>, or it falls through to the next case.","<b>Java 14+ switch expression:</b> <code>case 1, 7 -&gt; &quot;Weekend&quot;;</code> needs no break and can return a value.","<code>yield</code> returns a value from a multi-line switch branch."],e:"A traffic signal: red means stop, green means go, and anything else means wait.",q:"What is the big advantage of the arrow (->) switch?",a:"No break is needed, there is no fall-through, and it can return a value."},
214:{l:"JV5",t:"Loops",s:"Loops repeat code. Use for when you know how many times, while when you don't, and for-each to walk through a collection.",k:["<code>for (int i = 0; i &lt; 5; i++)</code>, <code>while (cond)</code>, <code>do { } while (cond)</code> (runs at least once).","<b>Enhanced for:</b> <code>for (int m : marks)</code>.","<code>break</code> leaves the loop. <code>continue</code> skips to the next round.","A <b>labeled break</b> can leave nested loops."],e:"Writing lines as punishment: 'write this 10 times' is a for loop.",q:"Which loop always runs at least once?",a:"do-while."},
215:{l:"JV6",t:"Arrays",s:"An array stores several values of the same type with a fixed size, and you reach each by its index starting at 0.",k:["<code>int[] marks = new int[5];</code> or <code>{80, 90, 70}</code>.","<code>marks.length</code> is the size (no brackets). Going beyond gives <code>ArrayIndexOutOfBoundsException</code>.","2D arrays: <code>int[][] grid = new int[3][3];</code>.","Use the <code>Arrays</code> class: <code>sort</code>, <code>toString</code>, <code>fill</code>, <code>copyOf</code>, <code>asList</code>."],e:"Lockers in a school corridor, numbered from 0, all the same size.",q:"What is the index of the first element?",a:"0."},
216:{l:"JV7",t:"Strings, StringBuilder and Text Blocks",s:"Strings are text, and in Java they never change once created. To build text efficiently, use StringBuilder.",k:["Compare text with <code>equals()</code>, <b>not</b> <code>==</code>.","Common methods: <code>length, charAt, substring, indexOf, replace, split, toUpperCase, trim</code>.","<b>Java 11:</b> <code>isBlank(), strip(), lines(), repeat(3)</code>.","<b>Java 15:</b> text blocks <code>&quot;&quot;&quot; ... &quot;&quot;&quot;</code> for multi-line text.","<code>StringBuilder</code> is fast for many appends in a loop."],e:"A string is a printed sticker. You can't edit it, you print a new one. StringBuilder is a whiteboard you can keep editing.",q:"Why use equals() and not == for Strings?",a:"== checks if they are the same object. equals() checks if the text is the same."},
217:{l:"JV8",t:"Methods: Parameters, Overloading, Varargs, Recursion",s:"A method is a named block of code you can call again and again, optionally with inputs and a returned result.",k:["Syntax: <code>static int add(int a, int b) { return a + b; }</code>. <code>void</code> means nothing is returned.","<b>Overloading:</b> same name, different parameters.","<b>Varargs:</b> <code>int... nums</code> accepts any number of values.","Java is <b>pass-by-value</b>: a method gets a copy of the value (for objects, a copy of the reference).","<b>Recursion:</b> a method that calls itself, with a base case to stop."],e:"A mixer-grinder: put in ingredients, press the button, get the output.",q:"What is method overloading?",a:"Several methods with the same name but different parameter lists."},
218:{l:"JV9",t:"OOP 1: Classes, Objects and Encapsulation",s:"A class is a blueprint and an object is a real thing made from it. Encapsulation means hiding the data (private) and giving controlled access (getters and setters).",e:"A blueprint of a house is the class, and each house built from it is an object with its own colour and owner.",k:["<code>new Student(...)</code> creates an object. The <b>constructor</b> sets it up.","<code>this</code> means the current object.","<code>private</code> fields plus public getters and setters protect the data.","<code>static</code> belongs to the class, not to one object (like a counter of all students).","Override <code>toString()</code> to print nicely."],q:"Why make fields private?",a:"So no one can set invalid values directly. Changes go through methods that can check them."},
219:{l:"JV10",t:"OOP 2: Inheritance, Polymorphism, Abstract Classes, Interfaces",s:"Inheritance lets a class reuse another class. Polymorphism means one call behaves differently for different objects. An interface is a promise of methods a class must provide.",e:"A child inherits the family name. A 'Shape' can be a circle or a rectangle, and calling area() works correctly for each.",k:["<code>class Dog extends Animal</code>, with <code>super(...)</code> for the parent. <code>&#64;Override</code> replaces a method.","<b>Abstract class:</b> partly built, can't be created directly.","<b>Interface:</b> <code>implements</code>. A class can implement many.","<b>Java 8:</b> <code>default</code> and <code>static</code> methods in interfaces. <b>Java 9:</b> <code>private</code> interface methods.","Polymorphism: <code>Shape s = new Circle(2); s.area();</code> runs Circle's version."],q:"Can a class extend two classes?",a:"No, but it can implement many interfaces."},
220:{l:"JV11",t:"Enums, Nested Classes, Object Methods and Packages",s:"Enums are fixed sets of named values. Nested classes live inside others. Every class inherits equals, hashCode and toString from Object.",k:["<code>enum Grade { A, B, C }</code> can have fields and methods too.","<b>Inner, static nested and anonymous classes</b> keep helper code close to where it is used.","Override <code>equals()</code> and <code>hashCode()</code> together, so objects work in sets and maps.","<b>Packages</b> organise classes. <b>Access:</b> private, (default), protected, public.","<b>Records</b> (Java 16) generate equals, hashCode and toString for you."],x:tb([["Modifier","Same class","Same package","Subclass","Everywhere"],["private","Yes","No","No","No"],["(default)","Yes","Yes","No","No"],["protected","Yes","Yes","Yes","No"],["public","Yes","Yes","Yes","Yes"]]),q:"Why override equals and hashCode together?",a:"HashSet and HashMap use both, and they must agree."},
221:{l:"JV12",t:"Exceptions and Error Handling",s:"An exception is a problem that happens while the program runs. try/catch lets you handle it instead of crashing.",e:"A spare tyre in the car: if a tyre bursts, the journey continues.",k:["<b>Checked</b> exceptions (like IOException) must be handled or declared with <code>throws</code>. <b>Unchecked</b> (RuntimeException) need not.","<code>try { } catch (A | B e) { } finally { }</code>. Finally always runs.","<b>try-with-resources</b> closes files and connections automatically (Java 7, improved in Java 9).","Make your own: <code>class MyException extends RuntimeException</code>.","<b>Java 14:</b> helpful NullPointerException messages tell exactly which variable was null."],q:"What does finally do?",a:"It runs whether or not an exception happened, usually to clean up."},
222:{l:"JV13",t:"Collections: List, Set, Map, Queue",s:"Collections are flexible containers that grow and shrink, unlike arrays. Pick the one that fits your need.",x:tb([["Type","Feature","Common class"],["List","Ordered, allows duplicates","ArrayList, LinkedList"],["Set","No duplicates","HashSet, TreeSet (sorted), LinkedHashSet"],["Map","Key to value pairs","HashMap, TreeMap, LinkedHashMap"],["Queue / Deque","First-in-first-out, or both ends","ArrayDeque, PriorityQueue"]]),k:["<b>Java 9:</b> <code>List.of(...)</code>, <code>Set.of</code>, <code>Map.of</code> make small immutable collections. <b>Java 10:</b> <code>List.copyOf</code>.","Sort with <code>Collections.sort</code> or <code>list.sort(Comparator...)</code>.","<b>Java 21 Sequenced Collections:</b> <code>getFirst()</code>, <code>getLast()</code>, <code>reversed()</code> on lists, deques and more.","Never remove from a list inside a for-each. Use an Iterator or <code>removeIf</code>."],q:"Which collection removes duplicates automatically?",a:"A Set."},
223:{l:"JV14",t:"Generics",s:"Generics let a class or method work with any type while still being type-safe, so the compiler catches mistakes.",e:"A box labelled 'Box of apples'. You can't accidentally put a shoe in it, and you don't need to check what you take out.",k:["<code>List&lt;String&gt;</code> only accepts Strings, with no casting needed.","Your own: <code>class Box&lt;T&gt; { T value; }</code>. Generic method: <code>&lt;T&gt; void print(T x)</code>.","<b>Bounded:</b> <code>&lt;T extends Number&gt;</code>.","<b>Wildcards:</b> <code>List&lt;? extends Number&gt;</code> (read) and <code>List&lt;? super Integer&gt;</code> (write).","<b>Diamond:</b> <code>new ArrayList&lt;&gt;()</code> infers the type."],q:"What problem do generics solve?",a:"They catch wrong-type errors at compile time and remove the need for casting."},
224:{l:"JV15",t:"Java 8: Lambdas, Functional Interfaces and Method References",s:"A lambda is a short, nameless function you can pass around. It was the biggest change in Java 8 and makes code shorter.",e:"Instead of writing a full letter, you hand over a sticky note with just the instruction.",x:tb([["Interface","Method","Meaning"],["Predicate&lt;T&gt;","test(t)","Yes or no question"],["Function&lt;T,R&gt;","apply(t)","Turn T into R"],["Consumer&lt;T&gt;","accept(t)","Do something, return nothing"],["Supplier&lt;T&gt;","get()","Give a value"],["BiFunction&lt;T,U,R&gt;","apply(t,u)","Two inputs, one output"]]),k:["Syntax: <code>(a, b) -&gt; a + b</code>.","A <b>functional interface</b> has exactly one abstract method, and <code>&#64;FunctionalInterface</code> checks it.","<b>Method reference:</b> <code>String::toUpperCase</code>, <code>System.out::println</code>.","<code>Comparator.comparing(Student::name)</code> sorts neatly."],q:"What is a functional interface?",a:"An interface with exactly one abstract method, which a lambda can implement."},
225:{l:"JV16",t:"Java 8: The Streams API",s:"A stream processes a collection step by step in a pipeline: filter, change, then collect the result. It reads like a description of what you want.",e:"A factory conveyor belt: items pass through stations (filter, map, sort), and at the end you pack the result.",f:["Source (list)","filter","map","sorted","collect or reduce"],k:["<b>Intermediate</b> steps (<code>filter, map, sorted, distinct, limit</code>) are lazy. A <b>terminal</b> step (<code>collect, forEach, count, sum, reduce</code>) starts the work.","<code>Collectors.groupingBy</code> and <code>counting</code> group like SQL.","<b>Java 9:</b> <code>takeWhile</code>, <code>dropWhile</code>. <b>Java 16:</b> <code>stream.toList()</code>.","<code>parallelStream()</code> uses many cores (use it carefully).","<b>Java 22 preview:</b> custom steps with Stream Gatherers (final in Java 24)."],q:"When does a stream pipeline actually run?",a:"Only when a terminal operation like collect or forEach is called."},
226:{l:"JV17",t:"Java 8: Optional and the Date-Time API",s:"Optional is a container that may or may not hold a value, which helps avoid NullPointerException. java.time replaces the old, confusing Date class.",e:"Optional is a gift box that might be empty, so you check before opening. LocalDate is a clean calendar page, and Duration is a stopwatch.",k:["<code>Optional.of(x)</code>, <code>Optional.empty()</code>, <code>orElse</code>, <code>orElseThrow()</code> (Java 10), <code>ifPresentOrElse</code> (Java 9), <code>map</code>.","Don't use Optional for fields or parameters. Use it for return values.","<code>LocalDate</code>, <code>LocalTime</code>, <code>LocalDateTime</code>, <code>ZonedDateTime</code>, <code>Period</code>, <code>Duration</code>.","They are <b>immutable</b>, so <code>plusDays(5)</code> returns a new object.","Format with <code>DateTimeFormatter.ofPattern(&quot;dd MMM yyyy&quot;)</code>."],q:"What does plusDays(5) do to a LocalDate?",a:"It returns a new date. The original does not change."},
227:{l:"JV18",t:"File I/O with java.nio.file",s:"Java reads and writes files with the Files and Path classes. Java 11 made reading a whole text file one line.",k:["<code>Path.of(&quot;notes.txt&quot;)</code>, <code>Files.exists</code>, <code>Files.createDirectories</code>.","<b>Java 11:</b> <code>Files.readString(path)</code> and <code>Files.writeString(path, text)</code>.","<code>Files.readAllLines</code> and <code>Files.lines</code> (a stream, close it with try-with-resources).","<code>BufferedReader</code> and <code>BufferedWriter</code> for big files.","<b>Java 18:</b> UTF-8 is the default text encoding everywhere."],e:"Files is a librarian: you tell the path of the shelf, and it reads or writes the book.",q:"Which Java 11 method reads a whole file into a String?",a:"Files.readString(path)"},
228:{l:"JV19",t:"Concurrency: Threads, Executors, CompletableFuture, Virtual Threads",s:"Concurrency means doing several things at once. Java offers threads, thread pools, and since Java 21 super-light virtual threads.",e:"A restaurant kitchen with many cooks working at the same time. Virtual threads are like having thousands of cheap helpers.",k:["<code>Thread</code> and <code>Runnable</code> are the basics. <code>synchronized</code> and <code>AtomicInteger</code> protect shared data.","<b>ExecutorService</b> manages a pool of threads. Always shut it down.","<b>Java 8 CompletableFuture:</b> chain async steps with <code>supplyAsync</code> and <code>thenApply</code>.","<b>Java 21 virtual threads:</b> <code>Executors.newVirtualThreadPerTaskExecutor()</code> can run huge numbers of blocking tasks cheaply.","Prefer immutable data and thread-safe collections like <code>ConcurrentHashMap</code>."],q:"When are virtual threads most useful?",a:"For many tasks that mostly wait, such as network or database calls."},
229:{l:"JV20",t:"Java and Databases: JDBC",s:"JDBC is Java's standard way to talk to a database. You open a connection, run SQL, and read the results.",f:["Connection","PreparedStatement","ResultSet","Close (try-with-resources)"],k:["Add a driver. For SQLite: Maven dependency <code>org.xerial:sqlite-jdbc</code>.","<b>PreparedStatement</b> with <code>?</code> placeholders prevents SQL injection.","Wrap Connection, Statement and ResultSet in try-with-resources so they close.","Big apps use JPA/Hibernate or Spring Data on top of JDBC."],q:"Why use PreparedStatement and not joining strings into SQL?",a:"It prevents SQL injection."},
230:{l:"JV21",t:"Java 9, 10 and 11 Features",s:"These three releases made Java friendlier. Java 11 is a long-term-support (LTS) release.",x:tb([["Version","Highlights"],["Java 9 (2017)","Modules (JPMS), jshell, List.of / Set.of / Map.of, private interface methods, Optional.ifPresentOrElse, Stream takeWhile and dropWhile"],["Java 10 (2018)","var for local variables, List.copyOf, Optional.orElseThrow()"],["Java 11 (2018, LTS)","String isBlank / strip / lines / repeat, Files.readString, standard HttpClient, run a single file with java File.java, var in lambda parameters, Predicate.not"]]),k:["<b>Modules:</b> a <code>module-info.java</code> file declares what a module needs and what it shows to others.","The new <b>HttpClient</b> replaces the awkward HttpURLConnection and supports HTTP/2 and async calls."],q:"Which version introduced var?",a:"Java 10."},
231:{l:"JV22",t:"Java 12 to 17: Switch Expressions, Text Blocks, Records, Pattern Matching, Sealed Classes",s:"These releases brought Java's modern, shorter style. Java 17 is an LTS release.",x:tb([["Feature","Preview","Final"],["Switch expressions","12, 13","14"],["Text blocks","13, 14","15"],["Records","14, 15","16"],["Pattern matching for instanceof","14, 15","16"],["Sealed classes","15, 16","17"]]),k:["<b>Records:</b> <code>record Point(int x, int y) {}</code> is a tiny immutable data class.","<b>Pattern matching:</b> <code>if (obj instanceof String s)</code> checks and casts in one step.","<b>Sealed classes</b> list exactly which classes may extend them, so a switch can be checked for completeness.","<b>Java 12:</b> <code>Collectors.teeing</code>. <b>Java 14:</b> helpful NullPointerException messages."],q:"What does a record generate for you?",a:"The constructor, getters, equals, hashCode and toString."},
232:{l:"JV23",t:"Java 18 to 21: Virtual Threads, Record Patterns, Switch Patterns, Sequenced Collections",s:"Java 21 (LTS) delivered several big features that had been in preview.",x:tb([["Version","Highlights"],["Java 18","UTF-8 by default, simple web server (jwebserver)"],["Java 19, 20","Previews of virtual threads, record patterns, scoped values"],["Java 21 (LTS)","Virtual threads (final), record patterns (final), pattern matching for switch (final), sequenced collections"]]),k:["<b>Pattern matching for switch:</b> <code>case Circle c -&gt; ...</code> with guards: <code>case Circle c when c.r() &gt; 10 -&gt; ...</code>.","<b>Record patterns</b> take a record apart: <code>case Point(int x, int y) -&gt; ...</code>.","<b>Sequenced collections:</b> <code>list.getFirst()</code>, <code>getLast()</code>, <code>reversed()</code>.","<code>jwebserver</code> starts a small file-serving web server for testing."],q:"What does case Point(int x, int y) do?",a:"It matches a Point record and gives you its parts as x and y."},
233:{l:"JV24",t:"Java 22 and the Version Cheat Sheet",s:"Java 22 (March 2024) made more preview features final. A newer LTS, Java 25, exists too, but the table below is your map from Java 8 to 22.",x:tb([["Java","Year","LTS","Headline features"],["8","2014","Yes","Lambdas, streams, Optional, java.time, default methods"],["9","2017","","Modules, jshell, List.of"],["10","2018","","var"],["11","2018","Yes","HttpClient, String methods, single-file run"],["12-13","2019","","Switch expressions and text blocks (preview)"],["14","2020","","Switch expressions final, helpful NPE"],["15","2020","","Text blocks final"],["16","2021","","Records, instanceof patterns, Stream.toList"],["17","2021","Yes","Sealed classes"],["18","2022","","UTF-8 default, jwebserver"],["19-20","2022-23","","Previews: virtual threads, record patterns"],["21","2023","Yes","Virtual threads, switch patterns, record patterns, sequenced collections"],["22","2024","","Unnamed variables _, FFM API, multi-file source launch"]]),k:["<b>Unnamed variables and patterns:</b> use <code>_</code> for values you don't need, like <code>catch (Exception _)</code>.","<b>Launch multi-file programs:</b> <code>java Main.java</code> compiles and runs a program split across several .java files in the same folder.","<b>Foreign Function and Memory API</b> (final): call native code safely without JNI.","<b>Previews in 22:</b> Stream Gatherers, statements before super(), and string templates (second preview, later removed).","Preview features need <code>--enable-preview</code>."],q:"What does _ mean in Java 22 patterns and catch blocks?",a:"An unnamed variable: a value you must declare but don't plan to use."},
234:{l:"JV25",t:"Maven, Gradle and JUnit 5 Testing",s:"Real projects use a build tool to download libraries and compile, and unit tests to check that the code works.",k:["<b>Maven</b> uses <code>pom.xml</code>. <b>Gradle</b> uses <code>build.gradle</code>. Both download libraries (dependencies) for you.","Standard layout: <code>src/main/java</code> for code and <code>src/test/java</code> for tests.","<b>JUnit 5:</b> mark tests with <code>&#64;Test</code> and check with <code>assertEquals</code>, <code>assertThrows</code>.","Run all tests with <code>mvn test</code>.","Write tests for the usual case, the edge case and the error case."],e:"A test is a teacher marking your homework automatically every time you change the code.",q:"Where do test files go in a Maven project?",a:"In src/test/java."},
235:{l:"JV26",t:"Annotations, Reflection and How the JVM Manages Memory",s:"Annotations are labels attached to code. Reflection lets a program look at its own classes at runtime. The JVM also manages memory for you with garbage collection.",k:["Built-in: <code>&#64;Override</code>, <code>&#64;Deprecated</code>, <code>&#64;FunctionalInterface</code>. You can create your own with <code>&#64;interface</code>.","<b>Reflection</b> is how frameworks like Spring and JUnit find your classes and methods.","<b>Stack:</b> method calls and local variables. <b>Heap:</b> all objects. Objects with no references left are cleaned up by the <b>garbage collector</b>.","Common collectors: G1 (default), ZGC (very low pauses), Shenandoah.","<code>OutOfMemoryError</code> means the heap is full. <code>StackOverflowError</code> usually means endless recursion."],e:"The JVM is a hotel housekeeper: you leave a room (stop using an object) and it cleans it for the next guest.",q:"Where do objects live in memory?",a:"On the heap."},
236:{l:"JC1",t:"Capstone: Student Manager in Java (Plan)",s:"A menu-driven console app that stores students in a CSV file. It uses records, collections, streams, Optional, exceptions, text blocks, switch expressions and file I/O, all in one project.",e:"The same Student Manager idea as the Python and FastAPI capstones, now written in modern Java.",f:["Main (menu)","StudentService (rules)","StudentRepository (CSV file)","Student (record)"],x:tb([["File","Job","Java feature"],["Student.java","Data plus validation","Record with compact constructor"],["StudentRepository.java","Load and save students.csv","NIO Files, streams, Optional"],["StudentService.java","Business rules, search, statistics","Streams, collectors, records"],["Main.java","The menu the user sees","Text block, switch expression"]]),k:["Needs Java 17 or newer (the code is tested against Java 21 features).","Create a folder <code>student-manager</code> and put the four files in it.","Compile with <code>javac -d out *.java</code> and run with <code>java -cp out Main</code>. In <b>Java 22</b> you can also run <code>java Main.java</code>."],q:"Why is Student a record?",a:"A student is just data. A record gives constructor, getters, equals and toString automatically."},
237:{l:"JC2",t:"Capstone Step 1: Student record and Repository",s:"The record validates its own data, and the repository saves and loads students from a CSV file.",k:["The <b>compact constructor</b> runs for every new record, so a Student can never be invalid.","<code>Optional&lt;Student&gt;</code> from <code>findById</code> forces the caller to handle 'not found'.","<code>List.copyOf</code> returns a safe, read-only copy.","I/O problems are wrapped in <code>UncheckedIOException</code>."],q:"Why does findAll return List.copyOf(students)?",a:"So outside code cannot change the repository's internal list."},
238:{l:"JC3",t:"Capstone Step 2: StudentService and Main Menu",s:"The service holds the rules (no duplicate emails, search, statistics). Main shows the menu and calls the service.",k:["<code>anyMatch</code> checks for a duplicate email with a stream.","<code>DoubleSummaryStatistics</code> gives count, average and maximum in one pass.","<code>groupingBy</code> with <code>counting</code> counts how many students got each grade.","One <code>catch (A | B | C e)</code> shows friendly messages for all expected errors."],q:"Which stream operation checks whether any student has a given email?",a:"anyMatch."},
239:{l:"JC4",t:"Capstone Step 3: Tests, Run and Level Up",s:"Compile and run the app, write JUnit tests, then grow the project.",k:["Test the rules: a duplicate email must fail, an age of 200 must fail.","<code>&#64;TempDir</code> gives each test its own temporary folder, so tests never touch real data.","<b>Level up:</b> store data in SQLite using JDBC (lesson JV20), build a REST API with Spring Boot, and connect the React, Vue or Angular frontends from earlier.","Put the project on GitHub with a README and a .gitignore (ignore the out folder and students.csv)."],q:"Why use @TempDir in tests?",a:"Each test gets a fresh temporary folder, so tests don't affect each other or your real data."}
,
240:{l:"SB1",t:"What is Spring Boot? Setup with Spring Initializr",s:"Spring Boot is the most popular way to build Java back-ends. It sets up everything for you (a web server, a database connection, security) so you can focus on your own code instead of configuration.",e:"Spring is a big box of Lego bricks. Spring Boot is the ready-made kit with the bricks already sorted and the instructions printed.",f:["start.spring.io","Pick dependencies","Download and open in IDE","Run main()","Server on port 8080"],x:tb([["Term","Meaning"],["Spring Framework","The core: dependency injection, web, data, security"],["Spring Boot","Auto-configuration, starters and an embedded Tomcat server"],["Starter","One dependency that brings a whole set of libraries"],["Spring Initializr","The website start.spring.io that builds your project skeleton"]]),k:["You need a JDK. Spring Boot 4 needs <b>Java 17 or newer</b> (Java 21 is a good choice).","On start.spring.io choose Maven, Java, the latest <b>4.x</b> version, and add Spring Web, Spring Data JPA, Validation, Spring Security, OAuth2 Resource Server and H2 Database.","Run with <code>./mvnw spring-boot:run</code> or the Run button in your IDE.","The app is a normal Java program with an embedded server. You ship one <code>.jar</code> file."],q:"What is a starter in Spring Boot?",a:"A single dependency that brings in a whole group of libraries that work together."},
241:{l:"SB2",t:"Spring Boot 4: What's New and Moving from Boot 3",s:"Spring Boot 4 (built on Spring Framework 7) was a big clean-up. The jar was split into smaller modules, many starters were renamed, and JSON moved to Jackson 3.",x:tb([["Spring Boot 3","Spring Boot 4"],["spring-boot-starter-web","spring-boot-starter-webmvc"],["spring-boot-starter-oauth2-resource-server","spring-boot-starter-security-oauth2-resource-server"],["One big spring-boot-starter-test","Test starters for each technology, like spring-boot-starter-webmvc-test"],["H2 console came with H2","Add the spring-boot-h2console module"],["Jackson 2 (com.fasterxml.jackson.databind)","Jackson 3 (tools.jackson.databind)"],["Spring Security 6, Hibernate 6","Spring Security 7, Hibernate 7"]]),k:["Jackson 3 changed the Java packages and some class names. The annotations like <code>&#64;JsonProperty</code> kept their old package.","<b>Quick migration:</b> the deprecated <code>spring-boot-starter-classic</code> brings back the Boot 3 style, so you can migrate step by step.","Spring Framework 7 adds features such as API versioning, built-in retry (<code>&#64;Retryable</code>) and null-safety annotations from JSpecify. Check the release notes for the details of the version you use.","In this course every code sample uses the Boot 4 starter names."],e:"Moving house: the same furniture, but the boxes are now labelled by room instead of one big box.",q:"What replaced spring-boot-starter-web in Spring Boot 4?",a:"spring-boot-starter-webmvc"},
242:{l:"SB3",t:"Your First Spring Boot App",s:"A Spring Boot app starts from one class with &#64;SpringBootApplication. Add a controller and you have a working web service.",k:["<code>&#64;SpringBootApplication</code> turns on auto-configuration and scans for your classes in the same package and below.","<code>&#64;RestController</code> and <code>&#64;GetMapping</code> connect a URL to a method.","Settings live in <code>src/main/resources/application.properties</code>. For example <code>server.port=8000</code>.","Standard layout: <code>src/main/java</code> (code), <code>src/main/resources</code> (settings, static files), <code>src/test/java</code> (tests)."],e:"Switching on a shop: the main() method opens the door, and controllers are the counters that answer customers.",q:"Which annotation marks the main class of a Spring Boot app?",a:"&#64;SpringBootApplication"},
243:{l:"SB4",t:"Core Spring: Beans, Dependency Injection, Configuration and Profiles",s:"Spring creates objects (beans) for you and hands them to the classes that need them. This is dependency injection, and it is the heart of Spring.",e:"A school office: the principal doesn't make chalk or print timetables. The office supplies what each teacher needs.",k:["<code>&#64;Component</code>, <code>&#64;Service</code>, <code>&#64;Repository</code> and <code>&#64;RestController</code> all mark classes that Spring manages.","<b>Constructor injection:</b> list what you need in the constructor, and Spring provides it. No <code>&#64;Autowired</code> is needed for one constructor.","<code>&#64;Configuration</code> with <code>&#64;Bean</code> methods creates beans by hand.","<code>&#64;Value(&quot;${school.name}&quot;)</code> reads one setting. <code>&#64;ConfigurationProperties</code> binds a group of settings into a record.","<b>Profiles:</b> <code>application-dev.properties</code> is used when you run with <code>--spring.profiles.active=dev</code>."],q:"What is the recommended way to inject a dependency?",a:"Through the constructor."},
244:{l:"SB5",t:"REST Controllers: Mappings, Parameters and Request Bodies",s:"A REST controller turns Java methods into API endpoints. Each CRUD action has its own HTTP method.",x:tb([["Action","Annotation","Typical status"],["Create","&#64;PostMapping","201 Created"],["Read","&#64;GetMapping","200 OK"],["Update","&#64;PutMapping / &#64;PatchMapping","200 OK"],["Delete","&#64;DeleteMapping","204 No Content"]]),k:["<code>&#64;PathVariable</code> reads <code>/students/7</code>. <code>&#64;RequestParam</code> reads <code>?search=ri</code>. <code>&#64;RequestBody</code> reads the JSON body.","Return a record and Spring turns it into JSON using Jackson.","<code>ResponseEntity</code> lets you choose the status code and headers.","<code>&#64;ResponseStatus(HttpStatus.CREATED)</code> sets a fixed status."],q:"Which annotation reads the JSON sent in a POST request?",a:"&#64;RequestBody"},
245:{l:"SB6",t:"Validation and Exception Handling",s:"Bean Validation checks incoming data with annotations. A central exception handler turns errors into clean JSON, so every error looks the same.",e:"A security gate that checks every visitor's ID card, with one help desk that explains the problem politely.",k:["Add <code>spring-boot-starter-validation</code>. Annotate fields with <code>&#64;NotBlank</code>, <code>&#64;Size</code>, <code>&#64;Min</code>, <code>&#64;Max</code>, <code>&#64;Email</code>.","Put <code>&#64;Valid</code> before <code>&#64;RequestBody</code> to switch the checks on.","<code>&#64;RestControllerAdvice</code> with <code>&#64;ExceptionHandler</code> methods handles errors for all controllers.","Bad data should give <b>422</b> (or 400), a missing item <b>404</b>, a duplicate <b>409</b>."],q:"Which annotation activates validation on a request body?",a:"&#64;Valid"},
246:{l:"SB7",t:"Spring Data JPA and the H2 Database",s:"JPA maps Java classes to database tables. Spring Data JPA writes the queries for you from method names. H2 is a small database written in Java, perfect for learning and tests.",e:"JPA is a translator between your Java objects and the database tables. You never write the SQL by hand.",x:tb([["Annotation","Meaning"],["&#64;Entity, &#64;Table","This class is a table"],["&#64;Id, &#64;GeneratedValue","Primary key, filled by the database"],["&#64;Column","Column settings (unique, length)"],["&#64;ManyToOne, &#64;OneToMany","Relationships between tables"]]),k:["A repository is just an interface: <code>interface StudentRepository extends JpaRepository&lt;Student, Long&gt;</code>. You get save, findById, findAll, deleteById for free.","<b>Derived queries:</b> <code>findByNameContainingIgnoreCase(String text)</code> becomes SQL automatically.","<b>H2:</b> <code>jdbc:h2:mem:testdb</code> keeps data in memory. <code>jdbc:h2:file:./data/db</code> saves to a file.","<b>H2 console</b> (a web page to look at your tables) needs the <code>spring-boot-h2console</code> module in Boot 4.","<code>spring.jpa.hibernate.ddl-auto=update</code> creates and updates tables automatically (fine for learning, use migrations in production)."],q:"What is the difference between jdbc:h2:mem and jdbc:h2:file?",a:"mem keeps data only while the app runs. file saves the data on disk."},
247:{l:"SB8",t:"Layered Design: Controller, Service, Repository, DTOs and Transactions",s:"Good Spring apps are split into layers. The controller handles HTTP, the service holds the rules, and the repository talks to the database. DTOs (data transfer objects) are the shapes that go in and out of the API.",f:["Controller","Service (rules, &#64;Transactional)","Repository","H2 database"],k:["Never return your entity straight to the client. Return a <b>DTO record</b>, so secrets (like password hashes) never leak.","<code>&#64;Transactional</code> makes a method all-or-nothing. If it fails halfway, the changes are rolled back.","<code>&#64;Transactional(readOnly = true)</code> for methods that only read.","Changes to an entity inside a transaction are saved automatically when it ends."],e:"A restaurant: the waiter (controller) takes orders, the chef (service) follows the recipe, and the store room (repository) keeps the ingredients.",q:"Why return DTOs and not entities?",a:"To control exactly what the client sees and never leak private fields like password hashes."},
248:{l:"SB9",t:"Spring Security 7 Basics",s:"Spring Security protects your app with a chain of filters. Authentication proves who you are, and authorization decides what you may do.",e:"A building with a guard at the gate (authentication) and a locked door to the manager's room (authorization).",k:["Adding <code>spring-boot-starter-security</code> locks every endpoint by default.","You describe the rules in a <code>SecurityFilterChain</code> bean using the lambda style: <code>authorizeHttpRequests</code>, <code>requestMatchers</code>, <code>permitAll</code>, <code>authenticated</code>, <code>hasRole</code>.","<b>Never store plain passwords.</b> Use <code>BCryptPasswordEncoder</code>.","For a token-based API use <b>stateless</b> sessions and switch CSRF off. CSRF protects browser sessions and cookies.","<b>CORS</b> decides which websites may call your API from a browser."],q:"Which class should you use to hash passwords?",a:"A PasswordEncoder, usually BCryptPasswordEncoder."},
