<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python: Zero to Hero — The Data & AI Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1419;
    --bg-soft:#141b24;
    --sidebar:#111720;
    --card:#19212c;
    --card-hi:#1e2733;
    --line:#2a3444;
    --text:#e9edf3;
    --text-dim:#94a3b8;
    --text-faint:#64748b;
    --amber:#ffb84d;
    --mint:#6ee7b7;
    --mint-soft:#153228;
    --coral:#ff8a80;
    --coral-soft:#3a1f1e;
    --sky:#7dd3fc;
    --radius:14px;
    --sidebar-w:296px;
    --topbar-h:56px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
  code,pre,.mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--sky);}
  img,svg{max-width:100%;display:block;}
  button{font-family:inherit;}

  .topbar{
    display:none;position:sticky;top:0;z-index:60;height:var(--topbar-h);
    background:rgba(15,20,25,0.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;padding:0 14px;
  }
  .topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none;}
  .menu-btn{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .menu-btn svg{width:18px;height:18px;}

  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:var(--sidebar-w);flex:none;background:var(--sidebar);border-right:1px solid var(--line);
    height:100vh;position:sticky;top:0;overflow-y:auto;padding:22px 16px 32px;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-weight:700;font-size:15px;}
  .sidebar-progress{margin:0 10px 20px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;}
  .sidebar-progress .label{font-size:12px;color:var(--text-faint);margin-bottom:8px;display:flex;justify-content:space-between;}
  .sidebar-progress .label b{color:var(--amber);font-weight:600;}
  .bar-track{height:5px;border-radius:999px;background:var(--line);overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--mint));width:0%;transition:width .3s ease;}

  .nav-group-label{font-size:11px;letter-spacing:.02em;color:var(--text-faint);padding:14px 12px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text-dim);text-decoration:none;font-size:13.5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;}
  .nav-item:hover{background:var(--card);color:var(--text);}
  .nav-item.active{background:var(--card-hi);color:var(--text);border-color:var(--line);}
  .nav-icon{width:26px;height:26px;flex:none;border-radius:7px;background:var(--bg-soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .nav-item.active .nav-icon{border-color:var(--amber);}
  .nav-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-check{width:14px;height:14px;flex:none;color:var(--mint);opacity:0;}
  .nav-check.on{opacity:1;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;}

  .main{flex:1;min-width:0;}
  .content-wrap{max-width:800px;margin:0 auto;padding:56px 40px 100px;}
  @media (max-width:900px){.content-wrap{padding:40px 24px 80px;}}

  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mint);margin-bottom:18px;}
  .hero h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 20px;font-weight:700;letter-spacing:-0.01em;}
  .hero h1 span{color:var(--amber);}
  .hero p{font-size:clamp(15.5px,2vw,17.5px);color:var(--text-dim);max-width:64ch;margin:0 0 26px;}
  .who-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-top:8px;}
  .who-box p{margin:0;color:var(--text-dim);font-size:14.5px;}
  .who-box strong{color:var(--text);}
  .hero-stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:32px;padding-top:26px;border-top:1px solid var(--line);}
  .hero-stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:24px;color:var(--text);}
  .hero-stat span{font-size:12.5px;color:var(--text-faint);}
  .hero-note{margin-top:30px;font-size:13.5px;color:var(--text-faint);}

  .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px;}
  @media (max-width:560px){.overview-grid{grid-template-columns:1fr;}}
  .overview-card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;background:var(--card);display:flex;align-items:center;gap:10px;}
  .overview-card:hover{border-color:var(--amber);}
  .overview-card .n{font-family:'JetBrains Mono';font-size:11px;color:var(--text-faint);}
  .overview-card .t{font-size:13.5px;color:var(--text);}

  /* stage header */
  .stage-kicker{font-size:12.5px;color:var(--text-faint);margin-bottom:8px;}
  .stage-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px;}
  .stage-h .icon{width:46px;height:46px;flex:none;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:21px;}
  .stage-h h2{font-size:clamp(22px,3.2vw,28px);margin:0 0 6px;}
  .stage-h .sub{color:var(--text-dim);font-size:14.5px;margin:0;}

  .section-label{
    display:flex;align-items:center;gap:8px;margin:34px 0 12px;
    font-size:12.5px;letter-spacing:.03em;color:var(--text-faint);text-transform:uppercase;
  }
  .section-label .num{
    width:20px;height:20px;border-radius:5px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--amber);font-family:'JetBrains Mono';
  }

  .intro-block{font-size:16px;color:var(--text);margin:6px 0 0;}
  .intro-block b{color:var(--amber);}

  .concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){.concept-grid{grid-template-columns:1fr;}}
  .concept-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);}
  .concept-card h4{margin:0 0 6px;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px;}
  .concept-card h4 .dot{width:7px;height:7px;border-radius:50%;background:var(--sky);flex:none;}
  .concept-card p{margin:0;font-size:13.5px;color:var(--text-dim);}

  .example-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .example-row{display:flex;gap:12px;padding:14px 16px;font-size:14px;color:var(--text-dim);}
  .example-row:not(:last-child){border-bottom:1px solid var(--line);}
  .example-row .em{flex:none;font-size:17px;}
  .example-row b{color:var(--text);}

  .pitfall-list{display:flex;flex-direction:column;gap:8px;}
  .pitfall-item{
    display:flex;gap:11px;padding:12px 15px;border-radius:9px;
    background:var(--coral-soft);border:1px solid #4a2624;font-size:13.5px;color:#f4c9c5;
  }
  .pitfall-item .em{flex:none;}
  .pitfall-item b{color:var(--coral);}

  .project-box{background:var(--mint-soft);border:1px solid #23543f;border-radius:12px;padding:20px 22px;}
  .project-box h4{margin:0 0 4px;font-size:15px;color:var(--mint);}
  .project-box>p{margin:0 0 16px;font-size:14.5px;color:#c9ede0;}
  .step-list{list-style:none;margin:0;padding:0;counter-reset:step;}
  .step-list li{
    counter-increment:step;position:relative;padding:0 0 14px 34px;font-size:14px;color:#d7f3e8;
  }
  .step-list li:last-child{padding-bottom:0;}
  .step-list li::before{
    content:counter(step);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;
    background:#1c4d3a;border:1px solid #2f6e54;color:var(--mint);font-size:11.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';
  }
  .stretch-goal{margin-top:16px;padding-top:14px;border-top:1px solid #23543f;font-size:13.5px;color:#a8d9c7;}
  .stretch-goal b{color:var(--mint);}

  .tools-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;}
  .tool-tag{font-size:12px;font-family:'JetBrains Mono',monospace;background:var(--bg-soft);border:1px solid var(--line);color:var(--text-dim);padding:4px 10px;border-radius:6px;}

  .code-tabs{display:flex;gap:6px;margin-bottom:0;}
  .code-tab{
    font-size:12.5px;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;
    background:var(--bg-soft);border:1px solid var(--line);border-bottom:none;color:var(--text-faint);
  }
  .code-tab.active{background:#0c1117;color:var(--amber);}
  .code-panel{display:none;}
  .code-panel.active{display:block;}
  pre{background:#0c1117;border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:17px 18px;overflow-x:auto;font-size:13px;color:#d3dae3;margin:0;}
  pre .c{color:var(--text-faint);}
  pre .s{color:var(--mint);}
  pre .k{color:var(--sky);}
  pre .f{color:var(--amber);}

  .nextup{
    margin-top:36px;padding:16px 18px;border:1px dashed var(--line);border-radius:10px;
    font-size:13.5px;color:var(--text-dim);display:flex;gap:10px;align-items:flex-start;
  }
  .nextup .em{flex:none;}
  .nextup b{color:var(--text);}

  .checkline{display:flex;align-items:center;gap:9px;margin:22px 0 8px;font-size:13.5px;color:var(--text-dim);}
  .checkline input{accent-color:var(--mint);width:16px;height:16px;}
  .checkline label{cursor:pointer;}

  .stage-nav{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding-top:22px;border-top:1px solid var(--line);}
  .stage-nav-btn{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);cursor:pointer;color:var(--text);text-align:left;}
  .stage-nav-btn:hover{border-color:var(--amber);}
  .stage-nav-btn.next{text-align:right;}
  .stage-nav-btn .dir{font-size:11px;color:var(--text-faint);display:block;margin-bottom:3px;}
  .stage-nav-btn .lbl{font-size:13.5px;}

  .capstone-badge{display:inline-block;font-size:12px;color:var(--amber);background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px;margin-bottom:16px;}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:22px 0;}
  .flow-step{background:var(--bg-soft);border:1px solid var(--line);padding:8px 13px;border-radius:8px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;}
  .flow-arrow{color:var(--text-faint);font-size:14px;}
  .capstone-detail{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--card);margin-bottom:14px;}
  .capstone-detail h4{margin:0 0 6px;font-size:14px;color:var(--sky);}
  .capstone-detail p{margin:0;font-size:14px;color:var(--text-dim);}

  ::selection{background:var(--amber);color:#1a1206;}

  @media (max-width:900px){
    .topbar{display:flex;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:65;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.5);}
    .sidebar.open{transform:translateX(0);}
    .overlay.open{display:block;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="brand-dot"></span> Zero to Hero</div>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
</div>

<div class="overlay" id="overlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-dot"></span> Zero to Hero</div>
    <div class="sidebar-progress">
      <div class="label"><span>Progress</span><span><b id="doneCount">0</b> / 12 built</span></div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    </div>
    <nav id="navList"></nav>
  </aside>

  <main class="main">
    <div class="content-wrap" id="content"></div>
  </main>
</div>

<script>
/* ============================= DATA ============================= */
const stages = [
{
  icon:"🔤", kicker:"Stage 1 · Foundations",
  title:"Python basics", sub:"variables, loops, conditionals, and functions — the alphabet everything else is written in",
  intro:`A computer does exactly what you tell it, one exact step at a time, in order. Nothing more, nothing clever, nothing assumed. Python is a language for writing those steps in something close to plain English, so a person can read a program and roughly understand what it does without running it. Before you can build a data pipeline or train a model, you need to be fluent in the small handful of building blocks every single one of those things is made from: storing a value, repeating an action, deciding between two paths, and packaging a set of steps so you can reuse it. This stage is slower than it looks, and it's worth it — almost every bug you'll hit for the next year traces back to a shaky grip on one of these four ideas.`,
  concepts:[
    {name:"Variables", explain:"A labeled box that holds a value — a number, a word, a list. <code>age = 12</code> creates a box named age holding 12. The box's contents can change; that's the whole point."},
    {name:"Conditionals (if/elif/else)", explain:"How your program makes a decision. 'If it's raining, bring an umbrella, otherwise wear sunglasses.' Only one branch runs, based on whether a condition is True or False."},
    {name:"Loops (for/while)", explain:"How you repeat an action without copy-pasting code 100 times. A <code>for</code> loop walks through a known list; a <code>while</code> loop keeps going until a condition becomes false."},
    {name:"Functions", explain:"A named, reusable recipe. You write the steps once with a name like <code>calculate_total()</code>, then 'call' that name anywhere you need those steps again, with different ingredients (arguments) each time."}
  ],
  examples:[
    {em:"🎮", text:"A video game's score counter is a variable that loops every frame, checking conditionals ('did the player hit a coin?') and calling functions ('play_sound()')."},
    {em:"💳", text:"A payroll system loops through every employee, uses conditionals to check overtime rules, and calls a function to calculate each paycheck."},
    {em:"📱", text:"A phone's 'low battery' warning is a loop checking battery percentage, with a conditional that fires a notification function once it drops below 20%."}
  ],
  pitfalls:[
    {b:"Off-by-one errors", t:"Looping one time too many or too few — usually from confusing 'the 5th item' with 'index 5'. Python counts from 0, so the 5th item is index 4."},
    {b:"Confusing = and ==", t:"A single <code>=</code> assigns a value; a double <code>==</code> compares two values. Using the wrong one in a conditional is one of the most common early mistakes."},
    {b:"Indentation errors", t:"Python uses indentation (spaces) to know what's inside a loop, function, or if-block — not curly braces. Inconsistent spacing will crash your program."}
  ],
  project:{
    title:"Grocery budget tracker",
    desc:"A command-line tool that keeps a running total as you add items, and warns you the moment you'd go over budget.",
    steps:[
      "Ask the user to set a budget amount, and store it in a variable.",
      "Loop: repeatedly ask for an item name and price until they type 'done'.",
      "Store each item as a pair in a list, and keep a running total as you go.",
      "Write a function <code>over_budget(total, budget)</code> that returns True or False.",
      "After the loop ends, print the total and call your function to decide whether to print a warning."
    ],
    stretch:"Add a category to each item (produce, snacks, household) and print a per-category subtotal at the end — this is a preview of Stage 2."
  },
  tools:["python3","input()","print()","for / while","def","if / elif / else"],
  code:[
    {label:"basic.py", code:`<span class="k">budget</span> = <span class="f">50</span>
<span class="k">items</span> = []

<span class="k">while</span> <span class="k">True</span>:
    <span class="k">name</span> = <span class="f">input</span>(<span class="s">"Item (or 'done'): "</span>)
    <span class="k">if</span> <span class="k">name</span> == <span class="s">"done"</span>:
        <span class="k">break</span>
    <span class="k">price</span> = <span class="f">float</span>(<span class="f">input</span>(<span class="s">"Price: "</span>))
    <span class="k">items</span>.append((<span class="k">name</span>, <span class="k">price</span>))

<span class="k">total</span> = <span class="f">sum</span>(<span class="k">p</span> <span class="k">for</span> _, <span class="k">p</span> <span class="k">in</span> <span class="k">items</span>)
<span class="f">print</span>(<span class="s">f"Total: \${total:.2f}"</span>)
<span class="k">if</span> <span class="k">total</span> > <span class="k">budget</span>:
    <span class="f">print</span>(<span class="s">"⚠️ Over budget!"</span>)`},
    {label:"with a function", code:`<span class="k">def</span> <span class="f">over_budget</span>(total, budget):
    <span class="s">"""Return True if total exceeds budget."""</span>
    <span class="k">return</span> total > budget

<span class="k">def</span> <span class="f">add_item</span>(items):
    name = <span class="f">input</span>(<span class="s">"Item (or 'done'): "</span>)
    <span class="k">if</span> name == <span class="s">"done"</span>:
        <span class="k">return</span> <span class="k">None</span>
    price = <span class="f">float</span>(<span class="f">input</span>(<span class="s">"Price: "</span>))
    items.append((name, price))
    <span class="k">return</span> name

budget, items = <span class="f">50</span>, []
<span class="k">while</span> add_item(items) <span class="k">is</span> <span class="k">not</span> <span class="k">None</span>:
    <span class="k">pass</span>

total = <span class="f">sum</span>(p <span class="k">for</span> _, p <span class="k">in</span> items)
<span class="f">print</span>(<span class="s">f"Total: \${total:.2f}"</span>)
<span class="k">if</span> over_budget(total, budget):
    <span class="f">print</span>(<span class="s">"⚠️ Over budget!"</span>)`}
  ],
  nextUp:"Once your data has more than one thing to say about each item — a name AND a price AND a category — a loose list of pairs stops being enough. Stage 2 gives you proper containers for that."
},
{
  icon:"🧺", kicker:"Stage 2 · Foundations",
  title:"Data structures & files", sub:"lists, dictionaries, nested structures, and reading/writing CSV & JSON",
  intro:`Once your program needs to remember more than a couple of values, you need a way to organize them that's more structured than separate variables. A <b>list</b> keeps things in order, like a row of labeled boxes on a shelf — you find something by its position. A <b>dictionary</b> keeps things labeled by name instead of position, like a phonebook — you look someone up by who they are, not where they happen to sit. Real data is almost always a mix of both: a list of dictionaries (a list of customers, each one a dictionary of their details) is probably the single most common shape of data you'll touch in your career. And none of this matters if it disappears the moment your program closes — so this stage also covers files, which are how a program remembers things between runs.`,
  concepts:[
    {name:"Lists", explain:"An ordered, changeable collection: <code>fruits = ['apple','pear']</code>. Access by position: <code>fruits[0]</code> is 'apple'. Great for sequences where order matters."},
    {name:"Dictionaries", explain:"Key-value pairs: <code>person = {'name':'Ana','age':30}</code>. Access by key: <code>person['name']</code>. Great for describing 'one thing with many properties'."},
    {name:"Nesting", explain:"Lists and dicts can contain each other — a list of dictionaries, a dictionary whose values are lists. This is exactly the shape of JSON, and of most real-world data."},
    {name:"CSV & JSON", explain:"CSV is a plain-text spreadsheet, rows and commas. JSON is nested key-value data, the native shape of dictionaries. Almost every API and export uses one of these two formats."}
  ],
  examples:[
    {em:"🏦", text:"Your bank statement is a list of dictionaries — each transaction has a date, amount, and merchant, and there's one entry per transaction."},
    {em:"📇", text:"Your phone's contacts app is a list, and each contact is a dictionary of fields (name, number, email) — exactly the list-of-dicts pattern."},
    {em:"🌐", text:"Almost every website you use fetches JSON from a server behind the scenes — weather apps, social feeds, price trackers — all nested dictionaries and lists."}
  ],
  pitfalls:[
    {b:"KeyError surprises", t:"Accessing a dictionary key that doesn't exist crashes your program. Use <code>.get('key', default)</code> when a key might be missing."},
    {b:"Mutating while looping", t:"Adding or removing items from a list while you're looping over it causes items to get skipped or duplicated. Loop over a copy, or build a new list instead."},
    {b:"Assuming CSV columns are typed", t:"Every value read from a CSV file is text, even '42'. You must explicitly convert with <code>int()</code> or <code>float()</code> before doing math with it."}
  ],
  project:{
    title:"Expense categorizer",
    desc:"A script that reads a CSV of your monthly expenses, groups the total spent by category, and writes a clean summary back out as JSON.",
    steps:[
      "Create a sample expenses.csv with columns: date, merchant, category, amount.",
      "Use <code>csv.DictReader</code> to read each row as a dictionary automatically.",
      "Build a dictionary that maps each category to a running total, adding as you go.",
      "Convert the amount from text to a float before adding it — this is the classic CSV gotcha.",
      "Write the final category-totals dictionary out to summary.json with <code>json.dump</code>."
    ],

  intro:`Every dashboard, model, and report you've ever seen was fed by data that had to get from somewhere messy to somewhere clean, automatically, without a human copy-pasting it every day. That movement is called a <b>pipeline</b>, and the three stages it almost always has a name for are <b>Extract</b> (pull raw data from a source — an API, a database, log files), <b>Transform</b> (clean it: fix types, drop duplicates, handle missing values) and <b>Load</b> (write the clean result somewhere useful, like the database you just learned in Stage 3). Data engineering is the plumbing behind every other stage in this whole roadmap — data scientists, ML engineers, and GenAI apps are all, ultimately, consuming data that a pipeline produced.`,

    {name:"Load", explain:"Writing the cleaned result to its destination — usually a database or a data warehouse — so other tools and people can use it without redoing the cleaning."},

{

  title:"Deep learning", sub:"neural networks — machine learning built for messy, unstructured data like images and text",
  intro:`Traditional machine learning models like RandomForest are excellent at tidy, tabular data — rows and columns with clear meaning. They struggle badly with raw, unstructured data like an image (a grid of millions of pixel values) or a sentence (a sequence of words with context that matters). A <b>neural network</b> is built from layers of tiny decision-makers stacked on top of each other, loosely inspired by neurons in a brain. Each layer learns to notice something a bit more abstract than the layer before it — the first layer might notice edges, a middle layer might notice shapes, and a deep layer might notice 'this is a cat.' Deep learning is the toolset you reach for the moment the pattern is too messy, too high-dimensional, or too context-dependent for simple rules or classic ML to capture.`,

    {name:"Backpropagation & gradient descent", explain:"After the network guesses wrong, backpropagation calculates exactly how much each weight contributed to the error, and gradient descent nudges every weight slightly to reduce that error — repeated millions of times."},
    {name:"GPUs", explain:"Neural networks are made of huge numbers of simple, repeated matrix multiplications — exactly what a graphics card (GPU) was built to do fast. Training on a GPU can be 10-100x faster than a regular CPU."}

  intro:`An LLM by itself can only produce text back to you — it can't look anything up, run a calculation, or check a live system. An <b>agent</b> gives it a defined set of tools (a weather lookup, a calculator, a database query) and lets the model itself decide, mid-conversation, 'to answer this properly, I should call this tool first.' The model calls the tool, sees the real result, and decides what to do next — sometimes calling another tool, sometimes answering directly. This loop of think → act → observe → repeat is what separates an agent from a simple chatbot, and it's the foundation almost every 'AI assistant' product actually runs on.`,

{
  icon:"📚", kicker:"Stage 10 · Grounding the model in facts",
  title:"RAG (Retrieval-Augmented Generation)", sub:"letting the model search your own documents and answer from what it finds, not what it remembers",
  intro:`An LLM's knowledge is frozen at training time, and it has never seen your private notes, your company's internal wiki, or documents created after its cutoff. <b>RAG</b> fixes this without retraining the model at all: you split your documents into small chunks, convert each chunk into a numeric representation called an <b>embedding</b> that captures its meaning, and store those in a searchable index. When a question comes in, you embed the question too, find the chunks whose meaning is closest to it, and hand just those chunks to the model as context before it answers — like giving it the exact right page of a textbook instead of asking it to recite the whole library from memory.`,
  concepts:[
    {name:"Chunking", explain:"Splitting a long document into smaller pieces (a paragraph or a few hundred words each) so you can retrieve just the relevant part instead of dumping the entire document into every prompt."},
    {name:"Embeddings", explain:"A list of numbers representing a piece of text's meaning, generated by a specialized model. Texts with similar meaning end up with embeddings that are numerically close to each other."},
    {name:"Vector search / similarity", explain:"Finding the chunks whose embeddings are closest to the question's embedding, usually measured by cosine similarity — this is how you find 'relevant' text without any exact keyword match required."},
    {name:"Grounding the answer", explain:"Instructing the model to answer using only the retrieved chunks (and to say so if the answer isn't in them), which sharply reduces made-up answers compared to relying on the model's memory alone."}
  ],
  examples:[
    {em:"🏢", text:"A company chatbot that correctly answers a specific internal HR policy question — something no public model was ever trained on — is almost always RAG retrieving from the actual policy document."},

  ],
  pitfalls:[

    {b:"Not telling the model to stick to the context", t:"Without an explicit instruction to answer only from retrieved chunks, the model may blend in outside knowledge, undermining the whole point of grounding it."},
    {b:"Ignoring retrieval quality", t:"If your search isn't actually finding the most relevant chunks, no amount of prompt tuning downstream will fix a wrong or incomplete answer — always sanity-check what's being retrieved."}

    {name:"Endpoints", explain:"A specific URL path plus an HTTP method (GET to fetch, POST to submit data) that your app responds to — like /ask accepting a question and returning an answer."},
    {name:"Request & response models (Pydantic)", explain:"A declared shape for the data coming in and going out, which FastAPI validates automatically — if a request is missing a required field or has the wrong type, it's rejected before your code even runs."},
    {name:"Status codes", explain:"A standardized number telling the caller what happened — 200 for success, 404 for not found, 500 for a server error. Getting these right makes your API predictable for whoever calls it."},
    {name:"Automatic docs", explain:"FastAPI generates an interactive, browsable page (usually at /docs) showing every endpoint, its inputs, and its outputs — letting anyone test your API directly in a browser with zero setup."}
  ],
  examples:[
    {em:"🛒", text:"When you check a shipping cost at checkout, your browser is calling a company's API, probably built with something a lot like FastAPI, that returns a price without you ever seeing the backend code."},
    {em:"🧠", text:"A company wrapping their internal ML model behind a FastAPI endpoint so their mobile app team can get predictions with a simple HTTP call, without needing to know any Python or machine learning."},
    {em:"🤝", text:"Two different companies' systems talking to each other automatically — a payment processor calling a merchant's order API to confirm a purchase went through — is APIs at the center of the modern internet."}
  ],
  pitfalls:[
    {b:"No input validation", t:"Trusting whatever comes in without validating types and required fields opens the door to crashes and security issues — Pydantic models handle most of this for you automatically, use them."},
    {b:"Leaking internal errors", t:"Returning a raw Python stack trace to the caller exposes internal details and looks unprofessional — catch exceptions and return a clean, appropriate error message and status code instead."},
    {b:"No rate limiting or auth on real deployments", t:"An API left completely open with no authentication or rate limits, once deployed publicly, can be abused or overwhelmed — this matters the moment your API leaves your laptop."}
  ],
  project:{
    title:"Serve your RAG assistant as an API",
    desc:"Wrap the RAG-notes answerer from Stage 10 in a FastAPI endpoint, so you can ask it questions from your phone's browser, not just a Python script.",
    steps:[
      "Install FastAPI and uvicorn, and create a main.py with a basic FastAPI app instance.",
      "Define a Pydantic model, Question, with a single text: str field for the incoming request.",
      "Create a POST /ask endpoint that takes a Question and calls your Stage 10 answer() function.",
      "Return the result as a JSON response, and run the server locally with uvicorn.",
      "Open the automatic docs page in your browser and test the endpoint directly, then try it from your phone on the same network."
    ],
    stretch:"Add a GET /health endpoint that returns a simple status, and a try/except around your /ask logic that returns a clean error message instead of crashing if something goes wrong — this is the beginning of making an API production-ready."
  },
  tools:["FastAPI","uvicorn","Pydantic","REST endpoints","status codes"],
  code:[
    {label:"main.py", code:`<span class="k">from</span> fastapi <span class="k">import</span> FastAPI
<span class="k">from</span> pydantic <span class="k">import</span> BaseModel

app = FastAPI()

<span class="k">class</span> Question(BaseModel):
    text: <span class="f">str</span>

@app.post(<span class="s">"/ask"</span>)
<span class="k">def</span> <span class="f">ask</span>(q: Question):

<span class="c"># run with: uvicorn main:app --reload</span>`},
    {label:"with health check + error handling", code:`<span class="k">from</span> fastapi <span class="k">import</span> FastAPI, HTTPException
<span class="k">from</span> pydantic <span class="k">import</span> BaseModel

app = FastAPI()

<span class="k">class</span> Question(BaseModel):
    text: <span class="f">str</span>

@app.get(<span class="s">"/health"</span>)
<span class="k">def</span> <span class="f">health</span>():
    <span class="k">return</span> {<span class="s">"status"</span>: <span class="s">"ok"</span>}

@app.post(<span class="s">"/ask"</span>)
<span class="k">def</span> <span class="f">ask</span>(q: Question):

        <span class="k">return</span> {<span class="s">"answer"</span>: answer(q.text)}
    <span class="k">except</span> <span class="f">Exception</span> <span class="k">as</span> e:
        <span class="k">raise</span> HTTPException(status_code=<span class="f">500</span>, detail=<span class="s">"Something went wrong answering that."</span>)

<span class="c"># run with: uvicorn main:app --reload</span>

/* ============================= RENDER ============================= */
let currentView = "overview";
let activeCodeTab = 0;
const doneSet = new Set();

function renderOverview(){
  return `
    <div class="hero-eyebrow">🐍 A hands-on trail, not a textbook</div>
    <h1>Learn Python by <span>building</span>, from your first line of code to a working AI agent.</h1>
    <p>Twelve stages, each one gone into properly: a real explanation of the idea, the specific concepts inside it, several real-world examples, the mistakes people actually make, a project with concrete steps, and two levels of working code. Data engineering, data science, machine learning, deep learning, generative AI, agents, RAG, MCP, and FastAPI — in the order that actually makes sense to learn them.</p>
    <div class="who-box">
      <p><strong>Who this is for:</strong> anyone starting from nothing who wants more than a surface-level tour. Every stage explains the idea properly before showing code, and every project is something you actually build, not just read about. Use the menu to jump to any stage.</p>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><b>12</b><span>in-depth stages</span></div>
      <div class="hero-stat"><b>4</b><span>concepts explained per stage</span></div>
      <div class="hero-stat"><b>1</b><span>capstone that ties it all together</span></div>
    </div>
    <div class="overview-grid">
      ${stages.map((s,i)=>`<div class="overview-card" data-goto="${i}"><span class="n">0${i+1}</span><span class="t">${s.title}</span></div>`).join("")}
      <div class="overview-card" data-goto="capstone"><span class="n">🏁</span><span class="t">Capstone project</span></div>
    </div>
    <p class="hero-note">Tip: each stage ends with a "what's next" note explaining exactly why the next stage exists — the roadmap is designed to be read in order the first time through.</p>
  `;
}

function renderStage(i){
  const s = stages[i];
  const prev = i>0 ? i-1 : null;
  const next = i<stages.length-1 ? i+1 : "capstone";
  activeCodeTab = 0;
  return `
    <div class="stage-kicker">${s.kicker}</div>
    <div class="stage-h">
      <div class="icon">${s.icon}</div>
      <div>
        <h2>${s.title}</h2>
        <p class="sub">${s.sub}</p>
      </div>
    </div>

    <p class="intro-block">${s.intro}</p>

    <div class="section-label"><span class="num">1</span> Key concepts</div>
    <div class="concept-grid">
      ${s.concepts.map(c=>`<div class="concept-card"><h4><span class="dot"></span>${c.name}</h4><p>${c.explain}</p></div>`).join("")}
    </div>

    <div class="section-label"><span class="num">2</span> Where you'd actually see this</div>
    <div class="example-list">
      ${s.examples.map(e=>`<div class="example-row"><span class="em">${e.em}</span><span>${e.text}</span></div>`).join("")}
    </div>

    <div class="section-label"><span class="num">3</span> Common mistakes</div>
    <div class="pitfall-list">
      ${s.pitfalls.map(p=>`<div class="pitfall-item"><span class="em">⚠️</span><span><b>${p.b}:</b> ${p.t}</span></div>`).join("")}
    </div>

    <div class="section-label"><span class="num">4</span> Build this</div>
    <div class="project-box">
      <h4>${s.project.title}</h4>
      <p>${s.project.desc}</p>
      <ol class="step-list">${s.project.steps.map(st=>`<li>${st}</li>`).join("")}</ol>
      <div class="stretch-goal"><b>Stretch goal:</b> ${s.project.stretch}</div>
    </div>
    <div class="tools-row">${s.tools.map(t=>`<span class="tool-tag">${t}</span>`).join("")}</div>

    <div class="section-label"><span class="num">5</span> Starter code</div>
    <div class="code-tabs">
      ${s.code.map((c,ci)=>`<div class="code-tab ${ci===0?'active':''}" data-tab="${ci}">${c.label}</div>`).join("")}
    </div>
    ${s.code.map((c,ci)=>`<div class="code-panel ${ci===0?'active':''}" data-panel="${ci}"><pre>${c.code}</pre></div>`).join("")}

    <div class="nextup"><span class="em">➡️</span><span><b>What's next:</b> ${s.nextUp}</span></div>

    <div class="checkline">
      <input type="checkbox" id="chkStage" ${doneSet.has(i)?"checked":""}>
      <label for="chkStage">I built this one</label>
    </div>
    <div class="stage-nav">
      <button class="stage-nav-btn" data-goto="${prev===null?'overview':prev}">
        <span class="dir">${prev===null?'← Back to':'← Previous'}</span>
        <span class="lbl">${prev===null?'Overview':stages[prev].title}</span>
      </button>
      <button class="stage-nav-btn next" data-goto="${next}">
        <span class="dir">${next==='capstone'?'Finish with →':'Next →'}</span>
        <span class="lbl">${next==='capstone'?'Capstone project':stages[next].title}</span>
      </button>
    </div>
  `;
}

function renderCapstone(){
  return `
    <span class="capstone-badge">🏁 Capstone</span>
    <div class="stage-h">
      <div class="icon">🏁</div>
      <div>
        <h2>Build one thing that uses everything</h2>
        <p class="sub">The project that proves you're not just following tutorials anymore</p>
      </div>
    </div>
    <p class="intro-block">Once you've been through the stages, the real test isn't repeating each project in isolation — it's combining them into one working system. Pick a dataset you actually care about: your own workouts, your expenses, your reading list, your favorite movies. Take it all the way from a raw file to a working assistant someone else could actually use.</p>

    <div class="section-label"><span class="num">1</span> The pipeline</div>
    <div class="flow">
      <div class="flow-step">📄 CSV of real data</div><div class="flow-arrow">→</div>
      <div class="flow-step">🗄️ Load into SQL</div><div class="flow-arrow">→</div>
      <div class="flow-step">🧹 Clean with pandas</div><div class="flow-arrow">→</div>
      <div class="flow-step">🔎 Embed for search</div><div class="flow-arrow">→</div>
      <div class="flow-step">🧠 RAG answers questions</div><div class="flow-arrow">→</div>
      <div class="flow-step">🤖 Agent decides when to query</div><div class="flow-arrow">→</div>
      <div class="flow-step">🔌 FastAPI serves it</div>
    </div>

    <div class="section-label"><span class="num">2</span> What each stage contributes</div>
    <div class="capstone-detail"><h4>Data engineering + SQL (Stages 3–4)</h4><p>Your pipeline pulls the raw data, cleans it, and loads it into a real database — the foundation everything else queries against.</p></div>
    <div class="capstone-detail"><h4>Data science (Stage 5)</h4><p>Before building the assistant, actually explore the data yourself — you'll write better prompts and catch bad data once you understand what's really in there.</p></div>
    <div class="capstone-detail"><h4>RAG (Stage 10)</h4><p>Embed your cleaned records so the assistant can find the specific rows relevant to a question, instead of guessing from general knowledge.</p></div>
    <div class="capstone-detail"><h4>Agents (Stage 9)</h4><p>Let the model decide when it actually needs to query your data versus answering directly — not every question needs a database hit.</p></div>
    <div class="capstone-detail"><h4>FastAPI (Stage 12)</h4><p>Wrap the whole thing behind a real endpoint so you (or a friend) can actually use it from a browser or phone, not just your terminal.</p></div>

    <div class="section-label"><span class="num">3</span> A realistic first version</div>
    <div class="project-box">
      <h4>Personal-data Q&A assistant</h4>
      <p>Something you could genuinely use day to day, built from data you already have.</p>
      <ol class="step-list">
        <li>Export or collect a real dataset about yourself — expenses, workouts, reading, or similar — as a CSV.</li>
        <li>Build a small pipeline (Stage 4) that cleans it and loads it into SQLite (Stage 3).</li>
        <li>Chunk and embed the records (Stage 10) so they're searchable by meaning, not just exact match.</li>
        <li>Give an agent (Stage 9) a tool to query the database directly, and a tool to search the embeddings, letting it choose which one fits a given question.</li>
        <li>Wrap it behind a FastAPI /ask endpoint (Stage 12) and test it with questions you don't already know the answer to.</li>
      </ol>
      <div class="stretch-goal"><b>Stretch goal:</b> package your assistant's data-access tool as an MCP server (Stage 11) so it could be reused by any other MCP-compatible AI app, not just your own code.</div>
    </div>

    <div class="stage-nav">
      <button class="stage-nav-btn" data-goto="${stages.length-1}">
        <span class="dir">← Previous</span>
        <span class="lbl">${stages[stages.length-1].title}</span>
      </button>
      <button class="stage-nav-btn next" data-goto="overview">
        <span class="dir">Start over →</span>
        <span class="lbl">Overview</span>
      </button>
    </div>
  `;
}

function renderNav(){
  const navList = document.getElementById("navList");
  let html = `<div class="nav-item ${currentView==='overview'?'active':''}" data-goto="overview">
      <span class="nav-icon">🏠</span><span class="nav-text">Overview</span>
    </div>
    <div class="nav-group-label">The 12 stages</div>`;
  stages.forEach((s,i)=>{
    const active = currentView === String(i);
    const done = doneSet.has(i);
    html += `<div class="nav-item ${active?'active':''}" data-goto="${i}">
      <span class="nav-icon">${s.icon}</span>
      <span class="nav-text">${s.title}</span>
      <svg class="nav-check ${done?'on':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>`;
  });
  html += `<div class="nav-group-label">Finish</div>
    <div class="nav-item ${currentView==='capstone'?'active':''}" data-goto="capstone">
      <span class="nav-icon">🏁</span><span class="nav-text">Capstone project</span>
    </div>`;
  navList.innerHTML = html;
}

function renderProgress(){
  document.getElementById("doneCount").textContent = doneSet.size;
  document.getElementById("barFill").style.width = (doneSet.size/stages.length*100)+"%";
}

function goto(view){
  currentView = view;
  const content = document.getElementById("content");
  if(view === "overview") content.innerHTML = renderOverview();
  else if(view === "capstone") content.innerHTML = renderCapstone();
  else content.innerHTML = renderStage(parseInt(view,10));
  renderNav();
  attachContentHandlers();
  window.scrollTo({top:0, behavior:"instant"});
  closeSidebar();
}

function attachContentHandlers(){
  document.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click",()=>goto(el.dataset.goto));
  });
  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.addEventListener("click",()=>{
      const tabIdx = el.dataset.tab;
      document.querySelectorAll("[data-tab]").forEach(t=>t.classList.toggle("active", t.dataset.tab===tabIdx));
      document.querySelectorAll("[data-panel]").forEach(p=>p.classList.toggle("active", p.dataset.panel===tabIdx));
    });
  });
  const chk = document.getElementById("chkStage");
  if(chk){
    chk.addEventListener("change", ()=>{
      const idx = parseInt(currentView,10);
      if(chk.checked) doneSet.add(idx); else doneSet.delete(idx);
      renderProgress();
      renderNav();
      attachContentHandlers();
    });
  }
}

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
function openSidebar(){ sidebar.classList.add("open"); overlay.classList.add("open"); }
function closeSidebar(){ sidebar.classList.remove("open"); overlay.classList.remove("open"); }
document.getElementById("menuBtn").addEventListener("click", openSidebar);
overlay.addEventListener("click", closeSidebar);

renderProgress();
goto("overview");
</script>
</body>
</html>
