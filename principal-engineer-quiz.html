<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principal Engineer Interview Prep — Quiz Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0f16;
    --panel: #121924;
    --panel-2: #161f2c;
    --border: #253242;
    --text: #e9eef5;
    --muted: #8ea0b3;
    --muted-2: #62748a;
    --brass: #e3a94a;
    --brass-dim: #7a5f2f;
    --blue: #5aa9e6;
    --good: #46d19a;
    --good-bg: rgba(70,209,154,0.12);
    --bad: #f2686a;
    --bad-bg: rgba(242,104,106,0.12);
    --radius: 10px;
    --sidebar-w: 300px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{ font-family:'Sora', 'IBM Plex Sans', sans-serif; margin:0; }
  code, .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color: var(--blue); }

  /* ---------- layout shell ---------- */
  .shell{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width: var(--sidebar-w);
    flex-shrink:0;
    background: var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    height:100vh;
    position: sticky;
    top:0;
  }
  .brand{
    padding: 22px 20px 16px 20px;
    border-bottom:1px solid var(--border);
  }
  .brand .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    color: var(--brass);
    text-transform: uppercase;
  }
  .brand h1{
    font-size:19px;
    line-height:1.25;
    margin-top:6px;
    font-weight:700;
  }
  .brand p{
    color: var(--muted);
    font-size:12.5px;
    margin:8px 0 0 0;
    line-height:1.5;
  }
  .overall{
    padding: 14px 20px;
    border-bottom:1px solid var(--border);
  }
  .overall-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12px; color:var(--muted); margin-bottom:6px;
  }
  .overall-row strong{ color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .bar{
    height:6px; border-radius:4px; background: var(--panel-2);
    overflow:hidden; border:1px solid var(--border);
  }
  .bar > span{
    display:block; height:100%; background: linear-gradient(90deg, var(--brass), var(--blue));
    width:0%; transition: width .35s ease;
  }
  nav.topics{
    flex:1; overflow-y:auto; padding: 10px 10px 16px 10px;
  }
  .topic-btn{
    width:100%;
    display:flex; align-items:center; gap:10px;
    background: transparent;
    border:1px solid transparent;
    color: var(--muted);
    text-align:left;
    padding:10px 10px;
    border-radius: 8px;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    margin-bottom:2px;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .topic-btn:hover{ background: var(--panel-2); color: var(--text); }
  .topic-btn.active{
    background: var(--panel-2);
    border-color: var(--border);
    color: var(--text);
  }
  .topic-btn.active .dot{ background: var(--brass); box-shadow:0 0 0 3px rgba(227,169,74,0.15); }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--muted-2);
    flex-shrink:0;
  }
  .dot.done{ background: var(--good); }
  .topic-name{ flex:1; line-height:1.3; }
  .topic-score{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--muted-2);
    flex-shrink:0;
  }
  .topic-btn.active .topic-score{ color: var(--brass); }

  .sidebar-footer{
    padding:12px 20px 16px 20px;
    border-top:1px solid var(--border);
    font-size:11px;
    color: var(--muted-2);
    font-family:'IBM Plex Mono', monospace;
  }

  /* ---------- mobile toggle ---------- */
  .menu-toggle{
    display:none;
    position:fixed;
    top:14px; left:14px;
    z-index:50;
    background: var(--panel);
    border:1px solid var(--border);
    color: var(--text);
    width:42px; height:42px;
    border-radius:8px;
    align-items:center; justify-content:center;
    cursor:pointer;
  }
  .menu-toggle span, .menu-toggle span::before, .menu-toggle span::after{
    display:block; width:18px; height:2px; background:var(--text); position:relative; border-radius:2px;
  }
  .menu-toggle span::before, .menu-toggle span::after{ content:""; position:absolute; left:0; }
  .menu-toggle span::before{ top:-6px; }
  .menu-toggle span::after{ top:6px; }

  .scrim{
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;
  }

  /* ---------- main ---------- */
  main{
    flex:1;
    min-width:0;
    padding: 34px 40px 60px 40px;
  }
  .topic-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:20px; flex-wrap:wrap;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .topic-header .kicker{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--blue);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .topic-header h2{ font-size:26px; margin-top:6px; }
  .topic-header .tagline{ color:var(--muted); margin-top:6px; font-size:14px; max-width:60ch; line-height:1.5; }
  .qmeta{
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    color: var(--muted);
    font-size:12.5px;
    flex-shrink:0;
  }
  .qmeta strong{ color:var(--text); font-size:14px; }

  .card{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px;
  }
  .qnum{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--bg);
    background: var(--brass);
    padding:2px 8px;
    border-radius: 5px;
    margin-bottom:14px;
    font-weight:600;
  }
  .qtext{
    font-size:18px;
    line-height:1.5;
    font-weight:600;
    margin-bottom:20px;
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    text-align:left;
    background: var(--panel-2);
    border:1px solid var(--border);
    color: var(--text);
    padding:13px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:14.5px;
    line-height:1.45;
    display:flex; gap:12px; align-items:flex-start;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(.locked){ border-color: var(--blue); }
  .opt .letter{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color: var(--muted);
    border:1px solid var(--border);
    border-radius:5px;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-top:1px;
  }
  .opt.correct{ background: var(--good-bg); border-color: var(--good); }
  .opt.correct .letter{ border-color: var(--good); color: var(--good); }
  .opt.incorrect{ background: var(--bad-bg); border-color: var(--bad); }
  .opt.incorrect .letter{ border-color: var(--bad); color: var(--bad); }
  .opt.dim{ opacity:.55; }
  .opt.locked{ cursor:default; }

  .result-panel{
    margin-top:20px;
    border-radius:8px;
    padding:16px 18px;
    display:none;
  }
  .result-panel.show{ display:block; }
  .result-panel.good{ background: var(--good-bg); border:1px solid var(--good); }
  .result-panel.bad{ background: var(--bad-bg); border:1px solid var(--bad); }
  .result-title{
    font-weight:700; font-size:14.5px; margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
  }
  .result-panel.good .result-title{ color: var(--good); }
  .result-panel.bad .result-title{ color: var(--bad); }
  .result-body{ font-size:14px; line-height:1.6; color: var(--text); }

  .example-box{
    margin-top:14px;
    background: #0d131c;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
  }
  .example-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color: var(--brass);
    text-transform:uppercase; letter-spacing:.06em;
    margin-bottom:8px;
  }
  .example-body{
    font-size:13.5px; line-height:1.6; color: var(--muted);
  }
  .example-body code, .example-body pre{
    font-family:'IBM Plex Mono', monospace;
    color: #cfe3d8;
    font-size:12.8px;
  }
  .example-body pre{
    background:#080c12; border:1px solid var(--border); border-radius:6px;
    padding:10px 12px; overflow-x:auto; margin:8px 0 0 0; line-height:1.55;
  }

  .nav-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:24px; gap:10px; flex-wrap:wrap;
  }
  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px; font-weight:600;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .btn:hover{ border-color: var(--blue); }
  .btn.primary{
    background: var(--brass);
    border-color: var(--brass);
    color: #1a1204;
  }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-group{ display:flex; gap:10px; }

  .section-complete{
    text-align:center;
    padding: 50px 20px;
  }
  .section-complete .big{
    font-family:'Sora', sans-serif; font-size:40px; font-weight:800;
    color: var(--brass);
  }
  .section-complete p{ color:var(--muted); margin-top:8px; font-size:14.5px; }

  @media (max-width: 880px){
    .sidebar{
      position:fixed; z-index:45; left:0; top:0;
      transform: translateX(-100%);
      transition: transform .25s ease;
      width: 82vw; max-width:320px;
    }
    .sidebar.open{ transform: translateX(0); }
    .menu-toggle{ display:flex; }
    .scrim.show{ display:block; }
    main{ padding: 76px 18px 50px 18px; }
    .card{ padding:20px 18px; }
    .topic-header{ flex-direction:column; align-items:flex-start; }
    .qmeta{ text-align:left; }
  }
</style>
</head>
<body>

<div class="menu-toggle" id="menuToggle" aria-label="Open menu"><span></span></div>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="kicker">Interview Prep</div>
      <h1>Principal Engineer Quiz Deck</h1>
      <p>13 tracks covering Java, architecture, data, cloud, security and AI &mdash; pulled from the Zero-to-Hero master course. Pick a track and answer at your own pace.</p>
    </div>
    <div class="overall">
      <div class="overall-row"><span>Overall progress</span><strong id="overallScore">0 / 0</strong></div>
      <div class="bar"><span id="overallBar"></span></div>
    </div>
    <nav class="topics" id="topicList"></nav>
    <div class="sidebar-footer">answer &rarr; see explanation &rarr; next</div>
  </aside>

  <main>
    <div class="topic-header">
      <div>
        <div class="kicker" id="topicKicker">Track</div>
        <h2 id="topicTitle">Loading&hellip;</h2>
        <div class="tagline" id="topicTagline"></div>
      </div>
      <div class="qmeta">
        <div>Question <strong id="qIndex">1</strong> / <span id="qTotal">1</span></div>
        <div id="qScore" style="margin-top:4px;">Score: 0</div>
      </div>
    </div>

    <div class="card" id="quizCard"></div>
  </main>
</div>

<script>
/* =========================================================================
   QUIZ DATA
   Each section: id, title, kicker, tagline, questions[]
   Each question: q, options[4], correct (index), why, example
   ========================================================================= */
const SECTIONS = [
{
  id: "core-java", kicker: "Part A · Module 1", title: "Core Java & Concurrency",
  tagline: "JVM internals, the Java Memory Model, threads, and what changed from Java 8 through 21.",
  questions: [
    {
      q: "What is the real relationship between the JDK, the JRE and the JVM?",
      options: [
        "They are three marketing names for the exact same install",
        "JDK = JRE + developer tools (compiler, debugger); JRE = JVM + standard libraries; JVM executes bytecode",
        "JVM is for developers, JDK is for end users running apps",
        "JRE compiles source code, JDK only runs it"
      ],
      correct: 1,
      why: "The JVM is the execution engine for bytecode. The JRE wraps the JVM with the standard class libraries so applications can run. The JDK adds the compiler and developer tools on top of the JRE so you can also write and build new code.",
      example: "Running <code>javac Hello.java</code> uses the compiler that only ships in the JDK. The resulting <code>Hello.class</code> bytecode can then be run with just a JRE via <code>java Hello</code> — no compiler needed at that point."
    },
    {
      q: "What does the <code>volatile</code> keyword actually guarantee?",
      options: [
        "It makes compound operations like <code>count++</code> atomic",
        "It guarantees visibility of the latest value across threads, but not atomicity",
        "It stores the variable only on the stack instead of the heap",
        "It automatically synchronizes every method that reads the variable"
      ],
      correct: 1,
      why: "volatile is a visibility and ordering guarantee: once one thread writes it, other threads will see the new value. It does nothing to make read-modify-write sequences like increment atomic — two threads can still race on that.",
      example: "<pre>private volatile boolean running = true;\nwhile (running) { process(); }</pre>Setting <code>running = false</code> from another thread is reliably seen by the loop. But <code>private volatile int count; count++;</code> can still lose updates under concurrent access — you'd need <code>AtomicInteger</code> for that."
    },
    {
      q: "Why is a virtual thread (Java 21+) so much cheaper than a platform thread?",
      options: [
        "It uses zero memory and runs instantly with no scheduling",
        "It starts with a tiny, heap-growable stack and automatically unmounts from its carrier OS thread while blocked on I/O",
        "It always runs on a dedicated CPU core",
        "It skips garbage collection entirely for objects it creates"
      ],
      correct: 1,
      why: "A platform thread is backed 1:1 by a ~1MB OS thread. A virtual thread starts with a few KB and is scheduled by the JVM onto a small pool of carrier threads; when it blocks on I/O it 'un-mounts', freeing the carrier thread for other work.",
      example: "<pre>try (var ex = Executors.newVirtualThreadPerTaskExecutor()) {\n  for (int i = 0; i < 100_000; i++)\n    ex.submit(() -> callSlowBankingApi());\n}</pre>100,000 platform threads would exhaust the OS; 100,000 virtual threads doing blocking I/O is fine because only the ones actively running occupy a real carrier thread."
    },
    {
      q: "What is the correct pattern for calling <code>wait()</code> inside a producer-consumer queue?",
      options: [
        "Call it inside an <code>if</code> check on the condition",
        "Call it inside a <code>while</code> loop that re-checks the condition after waking up",
        "Call it without any condition check at all",
        "Call it outside a synchronized block for better performance"
      ],
      correct: 1,
      why: "A thread can wake up spuriously, or wake up to find another thread already consumed the resource. An <code>if</code> only checks once before sleeping; a <code>while</code> re-verifies the condition every time the thread wakes, which is the only version that's actually correct.",
      example: "<pre>public synchronized void put(Order o) throws InterruptedException {\n  while (queue.size() == capacity) {\n    wait();\n  }\n  queue.add(o);\n  notifyAll();\n}</pre>If this used <code>if</code> instead of <code>while</code>, a spurious wakeup could let the queue silently overflow past capacity."
    },
    {
      q: "What happens to a HashMap bucket that becomes heavily collision-prone in modern Java?",
      options: [
        "The JVM throws a fatal exception and the map becomes unusable",
        "The bucket can be treeified into a balanced tree structure to keep lookups efficient",
        "The colliding entries are silently dropped to save memory",
        "The map falls back to a linear array scan across the entire table"
      ],
      correct: 1,
      why: "Since Java 8, a bucket with a sufficiently long collision chain can convert from a linked list to a balanced tree, which changes worst-case lookup from O(n) to roughly O(log n) for that bucket, protecting against pathological hash collisions.",
      example: "If thousands of keys are crafted (accidentally or maliciously) to collide into the same bucket, a linked-list implementation would degrade to a slow linear scan; treeification keeps that bucket's lookups reasonably fast instead."
    },
    {
      q: "What's the real danger of using <code>ThreadLocal</code> inside a pooled-thread web server without cleanup?",
      options: [
        "Nothing — the JVM automatically clears ThreadLocal between requests",
        "Stale data can leak from one request into the next request handled by the same reused thread",
        "It permanently slows down garbage collection for the whole JVM",
        "It causes the thread pool to shrink over time"
      ],
      correct: 1,
      why: "Threads in a pool are reused across many requests. If a ThreadLocal value set for request A isn't removed, request B — handled later by that same physical thread — can silently inherit A's stale value, which is both a bug and a data-bleed risk.",
      example: "<pre>private static final ThreadLocal<String> CORRELATION_ID = ...;\n\n// in a filter, always:\ntry {\n  CORRELATION_ID.set(newId());\n  chain.doFilter(req, res);\n} finally {\n  CORRELATION_ID.remove();\n}</pre>Skipping the <code>finally { remove() }</code> is the classic production leak."
    },
    {
      q: "Which Java LTS release finalized virtual threads?",
      options: ["Java 17", "Java 19 (as a preview only)", "Java 21", "Java 22"],
      correct: 2,
      why: "Virtual threads were introduced as a preview in Java 19–20 and became a final, production-ready feature in Java 21 — the LTS release most companies are migrating to.",
      example: "Java 21 also finalized pattern matching for switch, record patterns and sequenced collections in the same release, which is why it's considered the modern concurrency baseline for enterprise Java."
    },
    {
      q: "What extra capability does <code>ReentrantLock</code> offer over a plain <code>synchronized</code> block?",
      options: [
        "It makes the critical section run on multiple threads at once",
        "tryLock(), timed acquisition and interruptible locking, plus optional fairness",
        "It removes the need for a finally block when releasing",
        "It is always faster than synchronized in every scenario"
      ],
      correct: 0 === 1 ? 0 : 1,
      why: "synchronized is simple and sufficient for most cases, but ReentrantLock adds tryLock() (non-blocking attempt), timed waits, the ability to interrupt a waiting thread, and a fairness policy for lock ordering — features synchronized doesn't expose.",
      example: "<pre>if (lock.tryLock(2, TimeUnit.SECONDS)) {\n  try { process(); } finally { lock.unlock(); }\n} else {\n  // give up instead of waiting forever\n}</pre>"
    }
  ]
},
{
  id: "oop-patterns", kicker: "Part A · Module 1", title: "OOP, SOLID & Design Patterns",
  tagline: "Composition vs inheritance, the five SOLID principles, and the patterns that show up in every banking codebase.",
  questions: [
    {
      q: "A class that validates payments, checks fraud, saves to the database, sends emails and publishes events all in one place is violating which principle?",
      options: [
        "Liskov Substitution Principle",
        "Single Responsibility Principle",
        "Interface Segregation Principle",
        "It's not a violation — cohesive classes should do everything related to a workflow"
      ],
      correct: 1,
      why: "SRP means a class should have one primary reason to change. A class mixing validation, persistence, notification and eventing has at least five separate reasons to change, so a change to email formatting risks breaking payment logic.",
      example: "Split it into <code>PaymentValidator</code>, <code>FraudService</code>, <code>PaymentRepository</code>, <code>EventPublisher</code> and <code>NotificationService</code>, then have <code>PaymentService</code> orchestrate calls to each — each piece now changes only for its own reason."
    },
    {
      q: "You need to support UPI, then Card, then NEFT payments over time. Which principle guides you toward using an interface + Strategy instead of a growing if/else chain?",
      options: [
        "Dependency Inversion only",
        "Open/Closed Principle",
        "Liskov Substitution Principle",
        "None — if/else chains are always preferable for payments"
      ],
      correct: 1,
      why: "Open/Closed means stable code should be open to new behavior through extension, not require repeated edits. A <code>PaymentStrategy</code> interface lets you add a new payment type by adding a new class, without touching the existing, already-tested logic.",
      example: "<pre>interface PaymentStrategy { PaymentResult process(PaymentRequest r); }\nclass UpiPayment implements PaymentStrategy { ... }\nclass CardPayment implements PaymentStrategy { ... }</pre>Adding <code>WalletPayment</code> later means writing one new class — the <code>PaymentService</code> itself never changes."
    },
    {
      q: "A <code>Penguin</code> class extends <code>Bird</code>, which has a <code>fly()</code> method, and Penguin's <code>fly()</code> throws <code>UnsupportedOperationException</code>. What's wrong?",
      options: [
        "Nothing, exceptions are a normal part of Java",
        "This violates the Liskov Substitution Principle — a subtype must honor the behavior callers expect from the parent abstraction",
        "This violates the Single Responsibility Principle",
        "This is a correct use of the Factory pattern"
      ],
      correct: 1,
      why: "Code that receives a Bird reasonably expects fly() to work. A subtype that throws instead of flying breaks that contract. The fix is to redesign the abstraction — e.g. a base Bird with move(), and a separate FlyingBird interface only for birds that actually fly.",
      example: "<pre>interface Bird { void move(); }\ninterface FlyingBird extends Bird { void fly(); }\nclass Penguin implements Bird { public void move(){ walk(); } }\nclass Eagle implements FlyingBird { ... }</pre>"
    },
    {
      q: "In a banking system, when should you prefer composition over deep inheritance chains?",
      options: [
        "Never — inheritance is always the enterprise-grade choice",
        "When behaviors like interest rate policy, withdrawal rules and fees need to change independently of each other",
        "Only when writing unit tests",
        "Composition should be avoided because it always requires more classes"
      ],
      correct: 1,
      why: "Deep inheritance (BankAccount → SavingsAccount → PremiumSavingsAccount → InternationalPremiumSavingsAccount) becomes brittle as business rules evolve, because every combination needs its own subclass. Composing an Account from separate InterestPolicy, WithdrawalPolicy and FeePolicy objects lets each rule vary independently.",
      example: "<pre>class Account {\n  private InterestPolicy interestPolicy;\n  private WithdrawalPolicy withdrawalPolicy;\n  private FeePolicy feePolicy;\n}</pre>Swapping in a different InterestPolicy at runtime avoids ever needing a new subclass."
    },
    {
      q: "What business problem does the Strategy pattern solve in a payments platform?",
      options: [
        "It hides a complex subsystem behind one simple call",
        "It lets you select one of several interchangeable algorithms or business rules at runtime",
        "It ensures only one instance of a class ever exists",
        "It converts one incompatible interface into another"
      ],
      correct: 1,
      why: "Strategy defines a family of interchangeable algorithms behind a common interface, chosen at runtime — perfect for 'the fee calculation differs by customer tier' or 'the payment execution differs by method' type problems.",
      example: "<pre>PricingService(PricingStrategy strategy) { this.strategy = strategy; }\nBigDecimal calculate(Order o){ return strategy.price(o); }</pre>Swap in <code>PremiumPricing</code> vs <code>RegularPricing</code> without touching PricingService."
    },
    {
      q: "What does the Circuit Breaker pattern actually protect against?",
      options: [
        "SQL injection attacks",

        "How many consumer groups exist for a topic"

{
  id: "redis", kicker: "Part D · Data Layer", title: "Redis Caching",
  tagline: "Cache-aside, TTL design, stampede protection and knowing what not to cache in a banking system.",
  questions: [
    {
      q: "What is the flow of the cache-aside pattern?",
      options: [
        "The database automatically pushes every change into the cache",
        "The application checks the cache first; on a miss it reads the database, then writes the result into the cache for next time",
        "The cache is only ever written to, never read from",
        "The application writes only to the cache and never touches the database"
      ],
      correct: 1,
      why: "Cache-aside puts the application in control: check cache &rarr; on hit return fast &rarr; on miss go to the source of truth (the database) &rarr; populate the cache with that result before returning, so the next request for the same key is fast.",
      example: "<pre>Account cached = redis.get(id);\nif (cached != null) return cached;\nAccount account = repository.findById(id).orElseThrow();\nredis.set(id, account, Duration.ofMinutes(5));\nreturn account;</pre>"
    },
    {
      q: "What is a 'cache stampede' and what typically triggers it?",
      options: [
        "Too many unused keys sitting in the cache with no traffic",
        "A very popular cache key expires, and a large burst of concurrent requests all miss at once and hammer the database simultaneously",
        "The cache server physically overheating",
        "Redis rejecting all writes above a size limit"
      ],
      correct: 1,
      why: "If one hot key expires, hundreds or thousands of simultaneous requests can all miss the cache at the same instant and pile onto the database together, sometimes overwhelming it right when load was already high.",
      example: "Mitigations include jittered TTLs (so keys don't all expire at the exact same moment), request coalescing/locks (only one request actually queries the DB while others wait for that result), and background refresh before expiry."
    },
    {
      q: "What is the purpose of setting a TTL (time to live) on a cached value?",
      options: [
        "To make writes to Redis faster",
        "To automatically expire data after a bounded time so temporary or freshness-sensitive values don't live forever and go stale",
        "To encrypt the cached value",
        "TTL has no real functional purpose in Redis"
      ],
      correct: 1,
      why: "Without an expiry, cached data can grow unbounded and, worse, silently serve stale information indefinitely. TTL bounds both memory growth and the maximum staleness window for cached data.",
      example: "<pre>SET otp:123456 \"valid\"\nEXPIRE otp:123456 300</pre>A one-time password automatically disappears from the cache after 5 minutes, whether or not it was ever used."
    },
    {
      q: "What's the core architectural difference between Redis and Kafka?",
      options: [
        "They are functionally identical and interchangeable",
        "Redis is primarily a low-latency in-memory data store best known for caching, counters and sessions; Kafka is a durable, replayable distributed event log built for streaming",
        "Kafka is only used for caching, Redis is only used for messaging",
        "Redis cannot be used for anything except caching"
      ],
      correct: 1,
      why: "Redis excels where sub-millisecond access to transient or frequently-read data matters (cache, session store, rate limiter, counters). Kafka excels where durable, ordered, replayable streams of events need to reach one or many independent consumers over time.",
      example: "Use Redis to cache a customer's profile for fast repeated reads with a TTL; use Kafka to durably record and fan out a 'PaymentCompleted' event stream to fraud, ledger and notification consumers, with replay capability."
    },

      q: "Why is it risky to casually cache a live bank account balance with a long TTL?",
      options: [
        "There is no risk — balances rarely change",
        "A stale cached balance could let a customer see (or a downstream system act on) an incorrect amount, which is unacceptable when near-real-time financial correctness is required",
        "Redis cannot store numeric values",
        "Long TTLs always improve correctness"
      ],
      correct: 1,
      why: "Not everything belongs in a cache. Highly volatile, correctness-critical data like a live balance needs either a very short TTL, explicit invalidation on every write, or to be read straight from the source of truth — caching it casually trades correctness for speed in a place where correctness usually wins.",

    }
  ]

    },

      options: [
        "Yes, always — nobody can read a JWT's contents without the secret key",
        "No — a typical signed JWT is base64-encoded and signed for integrity, but its payload is readable by anyone who has the token",
        "JWTs have no format at all, so the question doesn't apply",
        "Only the header is encrypted, never the payload"
      ],
      correct: 1,
      why: "Signing proves the token hasn't been tampered with and came from a trusted issuer — it does not hide the contents. Anyone holding the token can decode the payload, so secrets or sensitive data should never be placed in ordinary JWT claims.",
      example: "Decoding a JWT payload is as simple as base64-decoding the middle segment between the two dots — no key required to just read it, only to verify or forge the signature."
    },

        "ID tokens are used to call APIs, access tokens are only for login screens",
        "Only one of the two ever expires"
      ],
      correct: 1,

    },

        "SQL injection in the login form",
        "Expired refresh tokens"

        "It has no real downside and is actually the recommended approach",
        "Liveness probes run too infrequently for this to matter"

      correct: 1,

        "Blue-green is only usable for frontend applications"
      ],
      correct: 1,

/* ============================= APP STATE ============================= */
let currentSectionId = SECTIONS[0].id;
const state = {}; // { sectionId: { qIndex, answers: [selectedOptIndex or null], score } }
SECTIONS.forEach(s => {
  state[s.id] = { qIndex: 0, answers: new Array(s.questions.length).fill(null), score: 0 };
});

const topicList = document.getElementById('topicList');
const quizCard = document.getElementById('quizCard');
const topicTitle = document.getElementById('topicTitle');
const topicTagline = document.getElementById('topicTagline');
const topicKicker = document.getElementById('topicKicker');
const qIndexEl = document.getElementById('qIndex');
const qTotalEl = document.getElementById('qTotal');
const qScoreEl = document.getElementById('qScore');
const overallScore = document.getElementById('overallScore');
const overallBar = document.getElementById('overallBar');

function totalQuestions(){ return SECTIONS.reduce((a,s)=>a+s.questions.length,0); }
function totalAnswered(){
  return SECTIONS.reduce((a,s)=> a + state[s.id].answers.filter(x=>x!==null).length, 0);
}
function totalCorrect(){
  return SECTIONS.reduce((a,s)=> a + state[s.id].score, 0);
}

function renderSidebar(){
  topicList.innerHTML = '';
  SECTIONS.forEach(sec => {
    const st = state[sec.id];
    const answeredCount = st.answers.filter(x=>x!==null).length;
    const done = answeredCount === sec.questions.length;
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (sec.id === currentSectionId ? ' active' : '');
    btn.innerHTML = `
      <span class="dot${done?' done':''}"></span>
      <span class="topic-name">${sec.title}</span>
      <span class="topic-score">${st.score}/${sec.questions.length}</span>
    `;
    btn.addEventListener('click', () => {
      currentSectionId = sec.id;
      renderSidebar();
      renderQuestion();
      closeSidebarOnMobile();
    });
    topicList.appendChild(btn);
  });

  const answered = totalAnswered();
  const tot = totalQuestions();
  overallScore.textContent = `${totalCorrect()} / ${tot}`;
  overallBar.style.width = tot ? `${(answered/tot)*100}%` : '0%';
}

function currentSection(){ return SECTIONS.find(s=>s.id===currentSectionId); }

function renderQuestion(){
  const sec = currentSection();
  const st = state[sec.id];
  topicKicker.textContent = sec.kicker;
  topicTitle.textContent = sec.title;
  topicTagline.textContent = sec.tagline;

  const qi = st.qIndex;

  if (qi >= sec.questions.length) {
    qIndexEl.textContent = sec.questions.length;
    qTotalEl.textContent = sec.questions.length;
    qScoreEl.textContent = `Score: ${st.score} / ${sec.questions.length}`;
    quizCard.innerHTML = `
      <div class="section-complete">
        <div class="big">${st.score} / ${sec.questions.length}</div>
        <p>Track complete. Review any question again, or move to the next track from the sidebar.</p>
        <div class="btn-group" style="justify-content:center; margin-top:18px;">
          <button class="btn" id="restartBtn">Restart this track</button>
        </div>
      </div>`;
    document.getElementById('restartBtn').addEventListener('click', () => {
      state[sec.id] = { qIndex: 0, answers: new Array(sec.questions.length).fill(null), score: 0 };
      renderSidebar();
      renderQuestion();
    });
    return;
  }

  const q = sec.questions[qi];
  const selected = st.answers[qi];
  const locked = selected !== null;

  qIndexEl.textContent = qi + 1;
  qTotalEl.textContent = sec.questions.length;
  qScoreEl.textContent = `Score: ${st.score}`;

  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'opt';
    if (locked) {
      cls += ' locked';
      if (i === q.correct) cls += ' correct';
      else if (i === selected) cls += ' incorrect';
      else cls += ' dim';
    }
    const letter = String.fromCharCode(65+i);
    return `<button class="${cls}" data-idx="${i}" ${locked?'disabled':''}>
      <span class="letter">${letter}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let resultHtml = '';
  if (locked) {
    const wasCorrect = selected === q.correct;
    resultHtml = `
      <div class="result-panel show ${wasCorrect?'good':'bad'}">
        <div class="result-title">${wasCorrect ? '&#10003; Correct' : '&#10007; Not quite — here\'s why'}</div>
        <div class="result-body">${q.why}</div>
        <div class="example-box">
          <div class="example-label">Worked example</div>
          <div class="example-body">${q.example}</div>
        </div>
      </div>`;
  }

  quizCard.innerHTML = `
    <div class="qnum">Question ${qi+1}</div>
    <div class="qtext">${q.q}</div>
    <div class="options">${optionsHtml}</div>
    ${resultHtml}
    <div class="nav-row">
      <button class="btn" id="prevBtn" ${qi===0?'disabled':''}>&larr; Previous</button>
      <div class="btn-group">
        <button class="btn primary" id="nextBtn" ${locked?'':'disabled'}>${qi===sec.questions.length-1 ? 'Finish track' : 'Next question →'}</button>
      </div>
    </div>
  `;

  quizCard.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state[sec.id].answers[qi] !== null) return;
      const idx = parseInt(btn.dataset.idx, 10);
      state[sec.id].answers[qi] = idx;
      if (idx === q.correct) state[sec.id].score += 1;
      renderSidebar();
      renderQuestion();
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (qi > 0) { st.qIndex -= 1; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    st.qIndex += 1; renderQuestion();
  });
}

/* ============================= MOBILE MENU ============================= */
const sidebar = document.getElementById('sidebar');
const menuToggle = document.getElementById('menuToggle');
const scrim = document.getElementById('scrim');
function openSidebar(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSidebarOnMobile(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
menuToggle.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeSidebarOnMobile() : openSidebar();
});
scrim.addEventListener('click', closeSidebarOnMobile);

/* ============================= INIT ============================= */
renderSidebar();
renderQuestion();
</script>
</body>
</html>
